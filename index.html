<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Comics">
<meta name="format-detection" content="telephone=no">
<title>Comic Shelf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="modulepreload" href="vendor/pdf.min.mjs">
<style>
:root{
  --bg:#000; --bar:#000; --el:#1c1c1e; --el2:#2c2c2e; --el3:#3a3a3c; --sep:#262628;
  --txt:#f5f5f7; --mut:#8e8e93; --red:#e5383b; --blue:#0a84ff; --read:#000;
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue','Segoe UI',Roboto,Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --padx:max(16px,var(--sal)); --padr:max(16px,var(--sar));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--ui);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{position:fixed;inset:0;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit}
img{-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
.topbar{flex:none;background:var(--bar);padding:var(--sat) var(--padr) 0 var(--padx);border-bottom:.5px solid var(--sep);position:relative;z-index:5}
.tb-row{height:50px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.segctl{justify-self:center;display:inline-flex;background:var(--el);border-radius:9px;padding:2px;gap:2px}
.segctl button{min-width:96px;height:30px;border-radius:7px;font-size:14px;font-weight:600;color:var(--mut);transition:background .15s,color .15s}
.segctl button.on{background:var(--el3);color:#fff}
.icbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:20px;color:#fff}
.icbtn:active{background:#ffffff1a}
#importBtn{justify-self:end}
#importBtn svg{width:26px;height:26px;stroke-width:2}
.tabview{flex:1;min-height:0;position:relative}
.scrollv{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scrollv::-webkit-scrollbar,.row-s::-webkit-scrollbar{display:none}

/* ---------- Home: coverflow hero ---------- */
.hero{padding:10px 0 0;position:relative;overflow:hidden;background:radial-gradient(120% 70% at 50% 34%,#16161a 0%,#000 70%)}
.cf{position:relative;height:calc(var(--cw)*1.5 + 4px + var(--cw)*.16);perspective:1100px;perspective-origin:50% 45%;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.cf-item{position:absolute;left:50%;top:6px;width:var(--cw);height:calc(var(--cw)*1.5);margin-left:calc(var(--cw)/-2);transform-style:preserve-3d;will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cf-item img{width:100%;height:100%;object-fit:cover;display:block;background:var(--el);box-shadow:0 18px 50px rgba(0,0,0,.7);-webkit-box-reflect:below 1px linear-gradient(transparent 78%,rgba(255,255,255,.14))}
.cf-item .dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.cf-item.lite img{-webkit-box-reflect:none;box-shadow:none}.cf.moving .cf-item img{box-shadow:none}
.pillbtn{height:36px;padding:0 26px;border-radius:18px;background:#fff;color:#000;font-size:15px;font-weight:700}
.pillbtn:active{opacity:.8}
.pillbtn.ghost{background:var(--el2);color:#fff}

/* ---------- Home: rows ---------- */
.rows{padding:0 0 calc(24px + var(--sab))}
.row{margin:18px 0 6px}.rows>.row:first-child{margin-top:12px}
.row-top{display:flex;align-items:center}.row-top .row-h{flex:1;min-width:0;padding-right:2px}
.row-more{flex:none;width:40px;height:34px;margin-right:calc(var(--padr) - 10px);display:grid;place-items:center;color:var(--mut);border-radius:17px}
.row-more svg{width:22px;height:22px}.row-more:active{background:var(--el)}
.mgname{padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.row-h{display:flex;align-items:center;gap:4px;width:100%;padding:0 var(--padr) 0 var(--padx);height:34px;text-align:left}
.row-h h2{margin:0;font-size:19px;font-weight:700;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-h .n{font-size:14px;color:var(--mut);font-weight:500}
.row-h svg{width:20px;height:20px;color:var(--mut);stroke-width:2.4}
.row-s{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:8px var(--padr) 6px var(--padx);scroll-padding:0 var(--padx);overscroll-behavior-x:contain}
.rc{flex:none;width:var(--rw);text-align:left;display:block}
.cvr{position:relative;width:100%;aspect-ratio:2/3;background:var(--el);overflow:hidden}
.cvr img{width:100%;height:100%;object-fit:cover;display:block}
.cvr .done{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:11px;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center}
.cvr .done svg{width:13px;height:13px;stroke:#fff;stroke-width:3.2}
.cvr .rtlb{position:absolute;left:6px;top:6px;font-size:10px;font-weight:800;letter-spacing:.04em;background:rgba(0,0,0,.78);color:#fff;padding:2px 5px;border-radius:4px}
.pl{height:3px;background:var(--el3);margin-top:5px;overflow:hidden}
.pl i{display:block;height:100%;background:#fff}
.rc .t{font-size:14px;font-weight:700;color:#fff;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .s{font-size:12px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seeall{flex:none;width:var(--rw);aspect-ratio:2/3;background:var(--el);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:14px;font-weight:600}
.seeall svg{width:26px;height:26px;stroke-width:2;color:var(--mut)}
.seeall:active,.rc:active .cvr{opacity:.75}

/* ---------- Library ---------- */
#library{display:flex;flex-direction:column}
.libbar{flex:none;padding:10px var(--padr) 8px var(--padx);background:var(--bar);display:flex;flex-direction:column;gap:9px}
.lrow{display:flex;gap:8px;align-items:center;min-width:0}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:36px;border-radius:10px;border:0;background:var(--el);color:#fff;padding:0 12px 0 34px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--mut)}
.search svg{position:absolute;left:10px;top:9px;width:18px;height:18px;color:var(--mut)}
.sortbtn{flex:none;height:36px;padding:0 12px;border-radius:10px;background:var(--el);color:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sortbtn svg{width:17px;height:17px}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(-1*var(--padr)) 0 calc(-1*var(--padx));padding:0 var(--padr) 0 var(--padx)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 14px;border-radius:15px;background:var(--el);color:#d1d1d6;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:#fff;color:#000}
.chip.scope{background:var(--el2);color:#fff}
.chip.scope svg{width:14px;height:14px;stroke-width:2.6}
.chip .c{font-weight:500;opacity:.6}
#libScroll{flex:1;min-height:0}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;padding:6px calc(var(--padr) + var(--azw,0px)) calc(24px + var(--sab)) var(--padx)}
@media (min-width:600px){.lgrid{grid-template-columns:repeat(5,1fr);gap:12px 8px}}
@media (min-width:1000px){.lgrid{grid-template-columns:repeat(7,1fr)}}
.lc{display:block;text-align:left;min-width:0}
.lc:active .cvr{opacity:.75}
.lhead{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--mut);padding:8px 0 0;letter-spacing:.04em}
.lempty{color:var(--mut);text-align:center;padding:60px 20px;font-size:15px}
#azIndex{position:absolute;right:max(2px,var(--sar));top:120px;bottom:calc(80px + var(--sab));width:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;touch-action:none;user-select:none;-webkit-user-select:none}
#azIndex span{flex:0 1 18px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--blue);width:20px;min-height:10px}
#azIndex span.off{color:#48484a}
#azIndex span.hit{color:#fff}
.azpop{position:absolute;right:46px;width:56px;height:56px;border-radius:12px;background:var(--el2);color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:6;pointer-events:none}

/* ---------- now reading pill ---------- */

/* ---------- empty ---------- */
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 28px 80px;gap:10px}
.empty svg{width:64px;height:64px;color:#48484a;stroke-width:1.5}
.empty h2{margin:6px 0 0;font-size:22px;font-weight:700}
.empty p{margin:0 0 12px;color:var(--mut);font-size:15px;line-height:1.45;max-width:400px}

/* ---------- sheets / modals ---------- */
.mwrap{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,var(--sat)) 16px max(16px,var(--sab));animation:fadein .15s}
@keyframes fadein{from{opacity:0}}
.modal{background:var(--el);border-radius:14px;width:min(440px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal .mh{padding:18px 18px 4px}
.modal .mh h3{margin:0;font-size:18px;font-weight:700}
.modal .mb{padding:12px 18px}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:6px 18px 18px;flex-wrap:wrap}
.btn{height:38px;padding:0 18px;border-radius:10px;background:#fff;color:#000;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--el2);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn:active{opacity:.8}
.sp{flex:1}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px}
.fld input[type=text]{width:100%;height:42px;border-radius:10px;border:0;background:var(--el2);color:#fff;padding:0 12px;font-size:16px;outline:none}
.fld input:focus{box-shadow:0 0 0 2px var(--blue)}
.tgl{display:flex;align-items:center;gap:12px;padding:10px 0;font-weight:600;font-size:15px;cursor:pointer}
.tgl input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--el3);position:relative;flex:none;margin:0;transition:background .15s;order:2;margin-left:auto}
.tgl input::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl input:checked{background:#30d158}
.tgl input:checked::after{transform:translateX(20px)}
.tgl small{display:block;font-weight:400;color:var(--mut);font-size:12.5px;margin-top:2px}
.note{background:var(--el2);border-radius:10px;padding:12px 13px;color:#d1d1d6;font-size:14px;line-height:1.45;margin:12px 0}
.note b{color:#fff}
.stor{display:flex;align-items:baseline;gap:8px;font-size:15px;flex-wrap:wrap;color:var(--mut)}
.stor b{font-size:28px;font-weight:700;color:#fff}
.mstat{color:var(--mut);font-size:13px;margin-top:4px}
.confirm-msg{margin:0;line-height:1.45;color:#d1d1d6;font-size:15px}
/* action sheet */
.sheet{background:transparent;box-shadow:none;width:min(400px,100%)}
.sheet .grp{background:var(--el);border-radius:14px;overflow:hidden}
.sheet .hd{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:.5px solid var(--el3)}
.sheet .hd img{width:40px;height:60px;object-fit:cover;background:var(--el2)}
.sheet .hd b{display:block;font-size:15px}
.sheet .hd span{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.sheet .act{display:flex;align-items:center;gap:12px;width:100%;height:52px;padding:0 16px;font-size:16px;border-bottom:.5px solid var(--el3);text-align:left}
.sheet .act:last-child{border-bottom:0}
.sheet .act svg{width:20px;height:20px;color:var(--mut)}
.sheet .act.red,.sheet .act.red svg{color:#ff453a}
.sheet .act:active{background:var(--el2)}
.sheet .cancel{margin-top:8px;width:100%;height:52px;border-radius:14px;background:var(--el);font-size:16px;font-weight:700}
.menu{position:fixed;z-index:110;background:#2c2c2e;border-radius:12px;min-width:200px;box-shadow:0 14px 40px rgba(0,0,0,.6);overflow:hidden;animation:fadein .12s}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;padding:0 16px;font-size:15px;border-bottom:.5px solid #3a3a3c;text-align:left}
.menu button:last-child{border-bottom:0}
.menu button svg{width:17px;height:17px;stroke-width:2.6}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--sab));transform:translateX(-50%);z-index:200;background:#2c2c2e;color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;font-size:14px;max-width:min(92vw,480px);box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fadein .15s}
.toast .tb{height:3px;border-radius:2px;background:#ffffff22;margin-top:8px;overflow:hidden}
.toast .tb i{display:block;height:100%;background:#fff;transition:width .2s}

/* ---------- Reader ---------- */
#reader{background:var(--read);z-index:10}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--read)}
#zoomer{position:absolute;inset:0;transform-origin:0 0}
#zoomer.anim{transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.view{position:absolute;inset:0}
.pg{position:absolute}
.pg>canvas,.face>canvas{position:absolute;display:block;background:#fff}
.view .pg>canvas{box-shadow:0 4px 24px rgba(0,0,0,.6)}
.pg.loading,.face.loading{background:#111}
.phn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#ffffff1f}
.phn::after{content:"";position:absolute;left:50%;top:calc(50% + 44px);width:22px;height:22px;margin-left:-11px;border:2.5px solid #ffffff22;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flip{position:absolute;inset:0;z-index:6;pointer-events:none}
.face{position:absolute;overflow:hidden}
.face .shade{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:3}
.flipper{position:absolute;will-change:transform;z-index:5}
.flipper>.face{left:0;top:0;width:100%;height:100%}
.flipper>.face.back{transform:rotateY(180deg)}
.rbar{position:absolute;left:0;right:0;z-index:20;background:#000;transition:transform .2s ease,visibility .2s}
.rbar.top{top:0;padding:var(--sat) max(6px,var(--sar)) 0 max(6px,var(--sal));border-bottom:.5px solid var(--sep)}
.rbar.bot{bottom:0;padding:0 max(14px,var(--sar)) var(--sab) max(14px,var(--sal));border-top:.5px solid var(--sep)}
#reader:not(.ui) .rbar.top{transform:translateY(-110%);visibility:hidden}
#reader:not(.ui) .rbar.bot{transform:translateY(110%);visibility:hidden}
.rrow{height:44px;display:flex;align-items:center;gap:4px}
.rrow .back{display:flex;align-items:center;gap:1px;height:36px;padding:0 10px 0 2px;border-radius:9px;font-weight:500;font-size:16px;color:#fff}
.rrow .back:active{background:#ffffff14}
.rtitle{flex:1;min-width:0;text-align:center;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.rbtn{height:40px;min-width:40px;padding:0 9px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:#fff;font-size:12.5px;font-weight:600}
.rbtn:active{background:#ffffff14}
.rbtn.on{background:#fff;color:#000}
.rbtn svg.i{width:19px;height:19px}
.brow{height:34px;display:flex;align-items:center;gap:12px}
.scrub{flex:1;position:relative;height:34px;display:flex;align-items:center}
#scrub{width:100%;margin:0;-webkit-appearance:none;appearance:none;background:transparent;height:30px}
#scrub::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,#fff var(--pct,0%),#3a3a3c var(--pct,0%))}
#scrub[dir=rtl]::-webkit-slider-runnable-track{background:linear-gradient(270deg,#fff var(--pct,0%),#3a3a3c var(--pct,0%))}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:0;margin-top:-6px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
#scrub::-moz-range-track{height:3px;border-radius:2px;background:#3a3a3c}
#scrub::-moz-range-progress{height:3px;background:#fff}
#scrub::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
#pgText{font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
#bubble{position:absolute;bottom:42px;transform:translateX(-50%);background:#1c1c1e;border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.6);pointer-events:none;text-align:center;z-index:2}
#bubble .bt{width:96px;height:144px;display:flex;align-items:center;justify-content:center;background:#2c2c2e;overflow:hidden}
#bubble img{max-width:100%;max-height:100%;display:block}
#bubble span{display:block;font-size:13px;font-weight:600;color:#fff;margin-top:5px}
#pages{position:absolute;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
#pages .ph{flex:none;display:flex;align-items:center;gap:8px;padding:var(--sat) max(10px,var(--sar)) 0 max(10px,var(--sal));height:calc(48px + var(--sat));border-bottom:.5px solid var(--sep)}
#pages .ph h3{margin:0;flex:1;font-size:17px;font-weight:600}
#pgrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 8px;padding:14px max(14px,var(--sar)) calc(20px + var(--sab)) max(14px,var(--sal));align-content:start}
#pgrid button{display:block;text-align:center}
#pgrid .th{aspect-ratio:2/3;background:#1c1c1e;overflow:hidden;display:flex;align-items:center;justify-content:center}
#pgrid .th img{width:100%;height:100%;object-fit:contain}
#pgrid button.cur .th{outline:2px solid #fff;outline-offset:2px}
#pgrid span{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-top:5px}
.rows{--rw:112px}
@media (min-width:600px){.rows{--rw:136px}}
@media (min-width:1000px){.rows{--rw:142px}}
.rc,.lc,.cf-item,.seeall{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pl.none{background:transparent}
/* import menu + Google Drive progress sheet */
.menu.imp{min-width:230px}
.menu.imp button svg{width:20px;height:20px;stroke-width:1.8;color:#ebebf5cc}
.ebtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.modal.drv .confirm-msg b{color:#fff}
.dlwrap{align-items:flex-end}
@media (min-width:600px){.dlwrap{align-items:center}}
.modal.dl{width:min(480px,100%);display:flex;flex-direction:column;max-height:min(80vh,640px);overflow:hidden}
.modal.dl .mh{padding:18px 18px 12px;border-bottom:.5px solid #3a3a3c}
.dlsub{margin:4px 0 10px;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.dlbar{height:4px;border-radius:2px;background:#ffffff1f;overflow:hidden}
.dlbar i{display:block;height:100%;width:0;background:#fff;border-radius:2px;transition:width .15s linear}

/* ================= IndexedDB ================= */
let dbp=null;
function db(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ const r=indexedDB.open('comic-reader',2);   // v2: + reading lists ('queues')
  r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('comics')) d.createObjectStore('comics',{keyPath:'id'}); if(!d.objectStoreNames.contains('chunks')) d.createObjectStore('chunks',{keyPath:['id','i']});
    if(!d.objectStoreNames.contains('queues')) d.createObjectStore('queues',{keyPath:'id'}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return dbp; }
const req2p=r=>new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const txDone=t=>new Promise((res,rej)=>{ t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error('aborted')); });
async function dbAll(){ const d=await db(); return req2p(d.transaction('comics').objectStore('comics').getAll()); }
async function dbPut(rec){ const d=await db(); const t=d.transaction('comics','readwrite'); t.objectStore('comics').put(rec); return txDone(t); }
async function dbPutChunk(id,i,data){ const d=await db(); const t=d.transaction('chunks','readwrite'); t.objectStore('chunks').put({id,i,data}); return txDone(t); }
async function dbGetChunk(id,i){ const d=await db(); const r=await req2p(d.transaction('chunks').objectStore('chunks').get([id,i])); return r&&r.data; }
// reading lists: {id, name, items:[comic ids in reading order], created, updated}
async function qAll(){ const d=await db(); return req2p(d.transaction('queues').objectStore('queues').getAll()); }
async function qPut(q){ const d=await db(); const t=d.transaction('queues','readwrite'); t.objectStore('queues').put(q); return txDone(t); }
async function qDel(id){ const d=await db(); const t=d.transaction('queues','readwrite'); t.objectStore('queues').delete(id); return txDone(t); }
async function dbDelete(id){ const d=await db(); const t=d.transaction(['comics','chunks'],'readwrite'); t.objectStore('comics').delete(id); t.objectStore('chunks').delete(IDBKeyRange.bound([id,0],[id,Infinity])); return txDone(t); }

/* ================= PDF sources: range reads, never the whole file in memory ================= */
class FileSource{ constructor(f){this.f=f;this.size=f.size} read(a,b){ return this.f.slice(a,b).arrayBuffer(); } }
class IDBSource{
  constructor(id,size){ this.id=id; this.size=size; this.cache=new Map(); }
  async chunk(i){ if(this.cache.has(i)){ const c=this.cache.get(i); this.cache.delete(i); this.cache.set(i,c); return c; }
    let c=await dbGetChunk(this.id,i); if(!c) throw new Error('Missing data chunk '+i);
    if(c instanceof Blob) c=await c.arrayBuffer();
    this.cache.set(i,c); while(this.cache.size>3) this.cache.delete(this.cache.keys().next().value); return c; }
  async read(a,b){ b=Math.min(b,this.size); const out=new Uint8Array(Math.max(0,b-a)); let pos=a;
    while(pos<b){ const ci=Math.floor(pos/CHUNK), off=pos-ci*CHUNK; const c=await this.chunk(ci); const n=Math.min(c.byteLength-off,b-pos); if(n<=0) break; out.set(new Uint8Array(c,off,n),pos-a); pos+=n; }
    return out.buffer; }
}
let sharedWorker=null;

function warmPdf(){ if(!warmP) warmP=(async()=>{ try{ const bin=atob(WARM_PDF), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);

    const page=await doc.getPage(1); const c=document.createElement('canvas'); c.width=16; c.height=16;
    await page.render({canvasContext:c.getContext('2d'),viewport:page.getViewport({scale:1})}).promise; freeCanvas(c); await doc.destroy(); }catch(e){ console.warn('pdf warm-up skipped',e); } })();

async function openPdf(src){
  if(!sharedWorker) sharedWorker=new pdfjsLib.PDFWorker({name:'cr'});
  await warmPdf();
  const first=await src.read(0,Math.min(src.size,65536));
  class T extends pdfjsLib.PDFDataRangeTransport{ requestDataRange(a,b){ src.read(a,b).then(buf=>this.onDataRange(a,new Uint8Array(buf))).catch(e=>console.warn('range read failed',e)); } }
  const transport=new T(src.size,new Uint8Array(first));
  const task=pdfjsLib.getDocument({range:transport,length:src.size,worker:sharedWorker,disableAutoFetch:true,disableStream:true,rangeChunkSize:524288,
    cMapUrl:VENDOR+'cmaps/',cMapPacked:true,standardFontDataUrl:VENDOR+'standard_fonts/',isEvalSupported:false,verbosity:pdfjsLib.VerbosityLevel.ERRORS});
  return task.promise;
}
async function renderToCanvas(page,maxW,maxH,dpr,maxPx){
  const vp1=page.getViewport({scale:1});
  let s=Math.min(maxW/vp1.width,maxH/vp1.height)*dpr; const px=vp1.width*s*vp1.height*s; if(px>maxPx) s*=Math.sqrt(maxPx/px);
  const vp=page.getViewport({scale:s}); const c=document.createElement('canvas'); c.width=Math.max(1,Math.floor(vp.width)); c.height=Math.max(1,Math.floor(vp.height));
  const ctx=c.getContext('2d',{alpha:false}); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp,intent:'display'}).promise;
  return c;
}
const toBlob=(c,q=.8)=>new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',q));
const freeCanvas=c=>{ if(c){ c.width=0; c.height=0; } };


/* ================= covers: wide-spread detection, half pick, black-margin trim ================= */
const COVER_V=2;
// stats of a region of a small RGBA sample: mean luminance, std-dev, share of "ink" (non-near-black/non-near-white) pixels
function regionStats(d,W,x0,y0,x1,y1){ let n=0,s=0,s2=0,ink=0;
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){ const i=(y*W+x)*4, l=.299*d[i]+.587*d[i+1]+.114*d[i+2]; n++; s+=l; s2+=l*l; if(l>40&&l<235) ink++; }
  const m=s/Math.max(1,n); return {mean:m,std:Math.sqrt(Math.max(0,s2/Math.max(1,n)-m*m)),ink:ink/Math.max(1,n)}; }
const isBlank=st=>(st.mean<45&&st.std<28)||(st.mean>225&&st.std<22)||st.ink<0.04;
// find near-black bands at the edges of [x0,x1)x[y0,y1) in the sample; returns trimmed box (sample coords)
function trimBlack(d,W,x0,y0,x1,y1,cols=true){
  // letterbox = rows/cols that are essentially pure black (scanner bands), not just dark artwork
  const rowDark=y=>{ let lit=0,sum=0; for(let x=x0;x<x1;x++){ const i=(y*W+x)*4, v=d[i]+d[i+1]+d[i+2]; sum+=v; if(v>3*30) lit++; } return lit/(x1-x0)<0.01&&sum/(x1-x0)<3*9; };
  const colDark=x=>{ let lit=0,sum=0; for(let y=y0;y<y1;y++){ const i=(y*W+x)*4, v=d[i]+d[i+1]+d[i+2]; sum+=v; if(v>3*30) lit++; } return lit/(y1-y0)<0.01&&sum/(y1-y0)<3*9; };
  const mh=Math.floor((y1-y0)*0.3), mw=cols?Math.floor((x1-x0)*0.15):0; let t=y0,b=y1,l=x0,r=x1;
  while(t-y0<mh&&rowDark(t)) t++; while(y1-b<mh&&rowDark(b-1)) b--;
  while(l-x0<mw&&colDark(l)) l++; while(x1-r<mw&&colDark(r-1)) r--;
  if((r-l)<(x1-x0)*0.4||(b-t)<(y1-y0)*0.4) return [x0,y0,x1,y1];   // mostly black: don't trim
  return [l,t,r,b]; }
// mode: auto | right | left | full.  Returns {cover:ArrayBuffer(jpeg), crop:{mode,side,x,y,w,h} (fractions of page 1)}
async function makeCover(page,mode='auto'){
  const vp1=page.getViewport({scale:1}), maybe=vp1.width>vp1.height*0.95;
  const big=await renderToCanvas(page,maybe?820:420,640,1,maybe?900000:500000);
  const SW=maybe?128:64, SH=Math.max(8,Math.round(SW*big.height/big.width));
  const sm=document.createElement('canvas'); sm.width=SW; sm.height=SH; const sx=sm.getContext('2d',{willReadFrequently:true}); try{ big.getContext('2d').getImageData(0,0,1,1); }catch(e){}   // WebKit: force the rendered canvas to flush before copying it
  sx.drawImage(big,0,0,SW,SH);
  const d=sx.getImageData(0,0,SW,SH).data; freeCanvas(sm);
  // "wide" = a two-page spread scan: judged on the content after removing black letterbox bands
  const [,ty,,by]=trimBlack(d,SW,0,0,SW,SH,false); const wide=maybe&&vp1.width>vp1.height*((by-ty)/SH)*1.15;
  let side='full';
  if(mode==='right'||mode==='left') side=mode;
  else if(mode==='auto'&&wide){ const L=regionStats(d,SW,0,0,SW>>1,SH), Rr=regionStats(d,SW,SW>>1,0,SW,SH);
    side=(isBlank(Rr)&&!isBlank(L))?'left':'right'; }          // left usually the blank back cover; default right
  let x0=side==='right'?SW>>1:0, x1=side==='left'?SW>>1:SW;
  const [l,t,r,b]=trimBlack(d,SW,x0,0,x1,SH,side!=='full');
  const crop={mode,side,x:l/SW,y:t/SH,w:(r-l)/SW,h:(b-t)/SH};
  const px=crop.x*big.width, py=crop.y*big.height, pw=crop.w*big.width, ph=crop.h*big.height;
  const s=Math.min(1,360/pw,540/ph), out=document.createElement('canvas'); out.width=Math.max(1,Math.round(pw*s)); out.height=Math.max(1,Math.round(ph*s));
  out.getContext('2d',{alpha:false}).drawImage(big,px,py,pw,ph,0,0,out.width,out.height); freeCanvas(big);
  const cover=await (await toBlob(out,.82)).arrayBuffer(); freeCanvas(out);   // bytes (Blobs in IDB fail in some WebKit modes)
  return {cover,crop,wide}; }
// page-1 metadata for a new record; aspect comes from page 2 when page 1 is a wide spread scan
async function coverMeta(doc,mode='auto'){
  const page=await doc.getPage(1); const vp=page.getViewport({scale:1}); const cv=await makeCover(page,mode); page.cleanup();
  let aspect=vp.width/vp.height;
  if(cv.wide&&doc.numPages>1){ try{ const p2=await doc.getPage(2); const v2=p2.getViewport({scale:1}); aspect=v2.width/v2.height; p2.cleanup(); }catch(e){} }
  return {cover:cv.cover,coverCrop:cv.crop,coverMode:mode,coverV:COVER_V,aspect}; }

/* ================= page-turn style: fold in the middle for wide two-page scans ================= */
// a page is "wide" if width > height*1.15 once black letterbox bands are ignored
async function pageIsWide(page){ const vp=page.getViewport({scale:1}), a=vp.width/vp.height; if(a>1.15) return true; if(a<=0.95) return false;
  const c=await renderToCanvas(page,96,96,1,12000); const W=c.width,H=c.height, d=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data; freeCanvas(c);
  const [,t,,b]=trimBlack(d,W,0,0,W,H,false); return vp.width>vp.height*((b-t)/H)*1.15; }
// Auto: sample pages 2-6; most wide -> fold. Result cached on the record (turnMode 'standard'/'fold' override it).
async function turnIsFold(doc,c){ const m=c.turnMode||'auto'; if(m==='fold') return true; if(m==='standard') return false;
  if(typeof c.foldAuto==='boolean') return c.foldAuto;
  const idx=[]; for(let i=1;i<=5&&i<doc.numPages;i++) idx.push(i); let wide=0;
  for(const i of idx){ const pg=await doc.getPage(i+1); try{ if(await pageIsWide(pg)) wide++; } finally{ pg.cleanup(); } }
  c.foldAuto=idx.length>0&&wide>idx.length/2; dbPut(c).catch(()=>{}); return c.foldAuto; }

// Drive subfolder names that are just an issue range / era ('150-199', "300's", '1-50', '1990s', '#1-#25', '300+') aren't series names
function isRangeName(n){ const s=String(n||'').trim().replace(/[’‘]/g,"'");
  return /^(?:(?:issues?|nos?\.?|#)\s*)?#?\d{1,4}\s*(?:-|–|—|to|thru|through)\s*#?\d{1,4}$/i.test(s) || /^\d{1,4}\s*'?\s*s$/i.test(s) || /^#?\d{1,4}\s*\+?$/.test(s); }

/* ---- blank black pages (scanned "TM & ©" pages between ads) ----
   A page is "blank black" when, on a small render (page 1 never counts):
   - at least 95% of it is near-black (luma < 32), ignoring a thin 3% border (scanner edges);
   - everything bright is one small blob (the copyright box: at most 3.5% of the page), with almost nothing bright outside it (<= 0.03%: no stars, windows, rain);
   - the black outside that blob is flat: dark mean <= 22 and spread (std) <= 4.5. Night-scene art has gradients/texture (std 5.8+ on our dark test pages). */
const BLACK_V=2;   /* bump to re-check every comic */

    for(let k=0;k<N;k++){ if(!bright[k]||seen[k]) continue; let n=0,l=w,r=-1,t=h,b=-1; st.push(k); seen[k]=1;
      while(st.length){ const q=st.pop(), x=q%w, y=(q-x)/w; n++; if(x<l) l=x; if(x>r) r=x; if(y<t) t=y; if(y>b) b=y;
        for(const nb of [x>0?q-1:-1,x<w-1?q+1:-1,y>0?q-w:-1,y<h-1?q+w:-1]) if(nb>=0&&bright[nb]&&!seen[nb]){ seen[nb]=1; st.push(nb); } }
      if(!best||n>best.n) best={n,l,r,t,b}; } }
  const pad=2, bx=best?{l:best.l-pad,r:best.r+pad,t:best.t-pad,b:best.b+pad}:null, inBox=(x,y)=>bx&&x>=bx.l&&x<=bx.r&&y>=bx.t&&y<=bx.b;
  let out=0, sum=0, sq=0, nd=0; for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(inBox(x,y)) continue; const k=y*w+x; if(bright[k]) out++; else { const l=L[k]; sum+=l; sq+=l*l; nd++; } }
  const mean=nd?sum/nd:0, std=nd?Math.sqrt(Math.max(0,sq/nd-mean*mean)):0, boxArea=bx?((bx.r-bx.l+1)*(bx.b-bx.t+1))/N:0;
  const black=share>=0.95&&boxArea<=0.035&&out<=N*0.0003&&mean<=22&&std<=4.5;

  const c=await renderToCanvas(page,wide?192:96,wide?144:144,1,40000); const x=c.getContext('2d',{willReadFrequently:true});

// blank pages of a document (never page 0): {black:[...], white:[...]}, or null if cancelled. Yields between pages.
// Scans from page `from` to the end first (where the reader is heading), then the rest. Black: gives up if a quarter of the pages look black.
async function scanBlack(doc,{alive=()=>true,pause=()=>new Promise(r=>setTimeout(r,16)),from=1}={}){ const n=doc.numPages, black=[], white=[], f=clamp(from|0,1,Math.max(1,n-1));
  const order=[]; for(let i=f;i<n;i++) order.push(i); for(let i=1;i<f;i++) order.push(i);
  for(const i of order){ if(!alive()) return null; await pause(); const page=await doc.getPage(i+1); try{ const s=await pageBlackStats(page); if(s.black) black.push(i); else if(s.white) white.push(i); } finally{ page.cleanup(); } }
  black.sort((a,b)=>a-b); white.sort((a,b)=>a-b); return {black:black.length>Math.max(3,n*.25)?[]:black, white}; }

/* ---- guided panel view: panel boxes by recursive XY-cut on gutters ----
   A gutter row/column is (almost) all paper-white or all black across the region. Rows split first (reading order is rows
   top-to-bottom), then columns (left-to-right; reversed for right-to-left comics). Leaves smaller than 1.2% of the page are noise
   (page numbers, specks). Detection "fails" (null) with <2 or >30 panels; the reader then uses page thirds.
   Boxes are fractions of the analysed image: {x,y,w,h}. */
const PANEL_V=1;   /* bump to re-detect every comic */
function detectPanels(d,W,H,rtl=false){
  const N=W*H, cls=new Uint8Array(N);   // 1 = paper white, 2 = black, 0 = art

  const read=comics.filter(c=>c.lastRead).sort((a,b)=>b.lastRead-a.lastRead);
  push(read.filter(inProg)); push(read); push(comics.filter(c=>!c.lastRead).sort((a,b)=>b.added-a.added)); push(comics.slice().sort((a,b)=>b.added-a.added));
  return out; }
const cfItemsHTML=L=>L.map((c,i)=>`<div class="cf-item" data-i="${i}" data-id="${c.id}" style="display:none"><img alt="${esc(c.title)}" decoding="async" draggable="false"><div class="dim"></div></div>`).join('');
// series page carousel: strictly by issue number (ascending), then title
const seriesHeroList=s=>comics.filter(c=>(c.series||'')===s).sort(byIssue);
function renderSeriesHero(){ const sh=$('#seriesHero'); if(!sh) return;
  if(!ui.series||!comics.length){ if(sh.dataset.sig){ sh.dataset.sig=''; sh.innerHTML=''; SCF.stop(); SCF.el=null; SCF.items=[]; } return; }
  const L=seriesHeroList(ui.series), sig=ui.series+'|'+L.map(c=>c.id+'.'+(c.coverV||'')).join(',');
  if(sh.dataset.sig===sig) return; sh.dataset.sig=sig; SCF.stop();
  if(!L.length){ sh.innerHTML=''; SCF.el=null; SCF.items=[]; return; }
  sh.innerHTML=`<div class="hero shero"><div class="cf" id="scf" aria-label="${esc(ui.series)}">${cfItemsHTML(L)}</div></div>`; SCF.mount($('#scf'),L); }
function renderHome(){
  const el=$('#homeScroll'); if(!comics.length){ el.innerHTML=emptyHTML(); Drive.preload(); CF.items=[]; CF.el=null; return; }
  const cf=heroList();
  const groups=new Map(); comics.forEach(c=>{ const s=(c.series||'').trim(); if(s){ if(!groups.has(s)) groups.set(s,[]); groups.get(s).push(c); } });
  let rows=''; const hid=new Set(rowPrefs().hidden);
  rowKeys().filter(k=>!hid.has(k)).forEach(k=>{ if(k==='added') rows+=rowHTML('Recently Added',comics.slice().sort((a,b)=>b.added-a.added),'added');
    else if(k.startsWith('q:')){ const q=queues.find(x=>'q:'+x.id===k); if(q) rows+=queueRowHTML(q); }
    else { const s=k.slice(2); if(groups.has(s)) rows+=rowHTML(s,groups.get(s).sort(byIssue),'series',s); } });
  // Home rows: Recently Added + one per series only (Unread/Finished live as Library filter chips)
  el.innerHTML=`<div class="hero"><div class="cf" id="cf" aria-label="Recently read">${cfItemsHTML(cf)}</div></div><div class="rows">${rows}</div>`;
  CF.mount($('#cf'),cf);
}

/* ---------- 3D coverflow: touch-tracked, momentum, snaps to center ---------- */
// one factory, two carousels: Home (CF) and the series page (SCF)
const makeCF=()=>({items:[],pos:0,el:null,cw:240,sp:180,raf:0,shown:-1,
  mount(el,items){ this.el=el; this.items=items; this.pos=0; this.shown=-1; this.vis=new Set(); this.size(); this.bind(); },
  size(){ if(!this.el||!this.el.isConnected) return; const vw=innerWidth, vh=innerHeight;
    this.cw=Math.round(vw<600? Math.min(vw*.46,vh*.3) : Math.min(290,vw*.3,vh*.33)); this.sp=this.cw*.8;
    // side-stack spacing: solve so the 7th neighbour's centre lands on the screen edge (after perspective shrink), so stacks run off both edges
    { const cw=this.cw, T=7, P=1100, z=cw*.55+(T-1)*cw*.2, need=(vw/2)*(P+z)/P; this.gap=clamp((need-cw*.8)/(T-1),cw*.12,cw*.5);
      // window = neighbours up to the first one that sits fully past the screen edge (capped at CF_WIN): stacks always bleed off, no wasted layers
      this.win=CF_WIN; for(let k=2;k<=CF_WIN;k++){ const f=P/(P+cw*.55+(k-1)*cw*.2); if((cw*.8+(k-1)*this.gap-cw*.32)*f>vw/2){ this.win=k; break; } } }
    this.el.style.setProperty('--cw',this.cw+'px'); this.layout(); },
  // virtualized: only covers within ±CF_WIN of centre are displayed/transformed (enough to bleed past both edges); covers load lazily (±CF_WIN+2 prefetch)
  layout(){ if(!this.el) return; const kids=this.el.children, cw=this.cw, gap=this.gap||cw*.3, n=kids.length, W=this.win||CF_WIN;
    const lo=Math.max(0,Math.floor(this.pos)-W), hi=Math.min(n-1,Math.ceil(this.pos)+W), vis=this.vis||(this.vis=new Set());
    for(const k of [...vis]) if(k<lo||k>hi){ kids[k].style.display='none'; vis.delete(k); }
    for(let k=Math.max(0,lo-2);k<=Math.min(n-1,hi+2);k++){ const im=kids[k].firstChild; if(!im.src){ const u=cover(this.items[k]); if(u) im.src=u; } }
    for(let k=lo;k<=hi;k++){ const it=kids[k], o=k-this.pos, ao=Math.abs(o);
      if(!vis.has(k)){ it.style.display=''; vis.add(k); }
      const s=Math.sign(o), a=Math.min(ao,1), x=s*(a*cw*.8+Math.max(0,ao-1)*gap);
      const z=-a*cw*.55-Math.max(0,ao-1)*cw*.2, rot=-clamp(o,-1,1)*52, sc=1-a*.1;
      it.style.transform=`translateX(${x.toFixed(1)}px) translateZ(${z.toFixed(1)}px) rotateY(${rot.toFixed(2)}deg) scale(${sc.toFixed(3)})`;
      it.style.zIndex=1000-Math.round(ao*100); it.lastChild.style.opacity=Math.min(.55,a*.3+Math.max(0,ao-1)*.04).toFixed(3);   // light dimming so the centre stands out; far covers fade only slightly
      it.classList.toggle('lite',ao>2.5); }   // covers stay sharp (no blur); far stacks drop reflection/shadow (keeps compositing cheap)
    this.info(); },
  info(){ const i=clamp(Math.round(this.pos),0,this.items.length-1); if(i===this.shown) return; this.shown=i; const c=this.items[i]; if(!c||!this.el) return;
    // no caption under the carousel: the centre cover itself is the control (tap opens); keep it labelled for VoiceOver
    [...this.el.children].forEach((it,k)=>{ it.setAttribute('role','button'); it.setAttribute('aria-label',k===i?`${c.lastRead&&!isDone(c)?'Continue reading':'Open'} ${c.title}${c.lastRead?`, page ${(c.page||0)+1-skipList(c).filter(p=>p<(c.page||0)).length} of ${c.pages-skipList(c).length}`:''}`:this.items[k].title); }); },
  stop(){ cancelAnimationFrame(this.raf); this.raf=0; },
  moving(v){ if(this.el) this.el.classList.toggle('moving',v); },   // shadows are dropped while moving (cheaper compositing)
  to(target,dur){ this.stop(); this.moving(true); const from=this.pos, t0=performance.now(); target=clamp(target,0,this.items.length-1);
    const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); this.pos=from+(target-from)*e; this.layout(); if(k<1) this.raf=requestAnimationFrame(step); else { this.raf=0; this.pos=target; this.layout(); this.moving(false); } };
    this.raf=requestAnimationFrame(step); },
  bind(){ const el=this.el; let d=null;
    el.addEventListener('pointerdown',e=>{ if(e.button>0) return; this.stop(); d={id:e.pointerId,x0:e.clientX,y0:e.clientY,p0:this.pos,drag:false,s:[[e.timeStamp,e.clientX]],t0:e.timeStamp}; });
    el.addEventListener('pointermove',e=>{ if(!d||e.pointerId!==d.id) return; const dx=e.clientX-d.x0, dy=e.clientY-d.y0;
      if(!d.drag){ if(Math.abs(dx)>7&&Math.abs(dx)>Math.abs(dy)){ d.drag=true; this.moving(true); cancelLP(); try{el.setPointerCapture(e.pointerId)}catch(_){} } else if(Math.abs(dy)>10){ d=null; return; } else return; }
      d.s.push([e.timeStamp,e.clientX]); if(d.s.length>8) d.s.shift();
      let p=d.p0-dx/this.sp; const n=this.items.length-1; if(p<0) p*=.35; else if(p>n) p=n+(p-n)*.35; this.pos=p; this.layout(); });
    const end=(e,cancel)=>{ if(!d||e.pointerId!==d.id) return; const g=d; d=null;
      if(g.drag){ const s=g.s.filter(q=>g.s[g.s.length-1][0]-q[0]<=100), a=s[0], b=s[s.length-1]; /* velocity over the last ~100ms of the gesture */ const v=(b[0]-a[0])>0&&(e.timeStamp-b[0])<90? (b[1]-a[1])/(b[0]-a[0]) : 0;   // px/ms
        const proj=v*300*(1+Math.min(2.5,Math.abs(v))*.45); const target=Math.round(this.pos-proj/this.sp); const dist=Math.abs(clamp(target,0,this.items.length-1)-this.pos); this.to(target,clamp(300+dist*75,300,1400)); return; }
      if(cancel||lpFired) return; if(e.timeStamp-g.t0>600) return;
      const it=e.target.closest('.cf-item'); if(!it) return; const i=+it.dataset.i;
      if(i===Math.round(this.pos)) openReader(it.dataset.id); else this.to(i,420); };
    el.addEventListener('pointerup',e=>end(e,false)); el.addEventListener('pointercancel',e=>end(e,true));
    let wt=0; el.addEventListener('wheel',e=>{ if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)) return; e.preventDefault(); this.stop(); this.moving(true); const n=this.items.length-1;
      this.pos=clamp(this.pos+e.deltaX/this.sp,-.3,n+.3); this.layout(); clearTimeout(wt); wt=setTimeout(()=>this.to(Math.round(this.pos),300),120); },{passive:false}); }
});
const CF=makeCF(), SCF=makeCF();

/* ---------- Library ---------- */
const FILTERS=[['all','All'],['unread','Unread'],['progress','In Progress'],['finished','Finished']];
const SORTS={recent:'Recent',title:'Title',added:'Date Added',series:'Series'};
function libList(){ const q=ui.q.trim().toLowerCase(); let L=comics.filter(c=>(ui.series==null||(c.series||'')===ui.series)&&(!q||c.title.toLowerCase().includes(q)||(c.series||'').toLowerCase().includes(q)));
  if(ui.filter==='unread') L=L.filter(isUnread); else if(ui.filter==='progress') L=L.filter(inProg); else if(ui.filter==='finished') L=L.filter(isDone);
  if(ui.sort==='title') L.sort(ui.series!=null?byIssue:byTitle); else if(ui.sort==='added') L.sort((a,b)=>b.added-a.added);
  else if(ui.sort==='series') L.sort((a,b)=>(!a.series)-(!b.series)||(a.series||'').localeCompare(b.series||'',undefined,{numeric:true})||byIssue(a,b));
  else L.sort((a,b)=>(b.lastRead||0)-(a.lastRead||0)||b.added-a.added);
  return L; }
const letterOf=t=>{ const ch=(t||'').trim().charAt(0).toUpperCase(); return /[A-Z]/.test(ch)?ch:'#'; };
function renderLibrary(){ scopeUI();
  $('#sortLbl').textContent=SORTS[ui.sort];
  $('#chips').innerHTML=''+FILTERS.map(([k,l])=>`<button class="chip${ui.filter===k?' on':''}" data-act="filter" data-f="${k}">${l}</button>`).join('');
  const grid=$('#libGrid'), az=$('#azIndex');
  if(!comics.length){ grid.innerHTML=''; grid.style.display='none'; renderSeriesHero(); if(!$('#libScroll .empty')) $('#libScroll').insertAdjacentHTML('beforeend',emptyHTML()); az.classList.add('hidden'); $('#library .libbar').classList.add('hidden'); return; }
  $('#library .libbar').classList.remove('hidden'); $('#libScroll .empty')?.remove(); grid.style.display='';
  renderSeriesHero(); const L=libList(); const seen=new Set();
  grid.innerHTML=L.length? L.map(c=>{ const l=letterOf(c.title); const first=ui.sort==='title'&&!seen.has(l)&&(seen.add(l),true);
    return `<button class="lc" data-act="open" data-id="${c.id}" data-title="${esc(c.title)}" aria-label="${esc(c.title)}"${first?` data-letter="${l}"`:''}>${coverBox(c)}</button>`; }).join('')
    : `<div class="lempty" style="grid-column:1/-1">No comics here${ui.q?` matching “${esc(ui.q)}”`:''}.</div>`;
  const showAZ=ui.sort==='title'&&ui.series==null&&L.length>0; az.classList.toggle('hidden',!showAZ); grid.style.setProperty('--azw',showAZ?'14px':'0px');
  if(showAZ) az.innerHTML=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'].map(l=>`<span data-l="${l}" class="${seen.has(l)?'':'off'}">${l}</span>`).join('');
}
$('#q').addEventListener('input',e=>{ ui.q=e.target.value; renderLibrary(); });
$('#sortBtn').addEventListener('click',e=>{ e.stopPropagation(); openMenu($('#sortBtn'),Object.entries(SORTS).map(([k,l])=>({label:l,on:ui.sort===k,run:()=>{ ui.sort=k; store.set('sort',k); renderLibrary(); $('#libScroll').scrollTop=0; }}))); });
function seeAll(kind,series){ ui.series=null; ui.filter='all'; ui.q=''; $('#q').value='';
  if(kind==='series'){ ui.series=series; ui.sort='title'; } else if(kind==='added') ui.sort='added'; else if(kind==='unread'){ ui.filter='unread'; ui.sort='title'; } else if(kind==='finished') ui.filter='finished';
  store.set('sort',ui.sort); renderLibrary(); setTab('library'); $('#libScroll').scrollTop=0; }
// A–Z jump index (drag along it like iOS)
(()=>{ const az=$('#azIndex'); let pop=null, on=false;
  const pick=y=>{ const els=[...az.children]; if(!els.length) return; let best=els[0]; for(const s of els){ const r=s.getBoundingClientRect(); if(y>=r.top) best=s; }
    const order=els.map(s=>s.dataset.l), i0=order.indexOf(best.dataset.l); let tgt=null;
    for(let i=i0;i<order.length&&!tgt;i++) tgt=$(`#libGrid [data-letter="${order[i]}"]`);
    for(let i=i0;i>=0&&!tgt;i--) tgt=$(`#libGrid [data-letter="${order[i]}"]`);
    els.forEach(s=>s.classList.toggle('hit',s===best));
    if(!pop){ pop=document.createElement('div'); pop.className='azpop'; $('#library').appendChild(pop); }
    pop.textContent=best.dataset.l; const lr=$('#library').getBoundingClientRect(); pop.style.top=(clamp(y-lr.top-28,60,lr.height-80))+'px';
    if(tgt){ const sc=$('#libScroll'); sc.scrollTop=tgt.offsetTop-8; } };
  const done=()=>{ on=false; setTimeout(()=>{ pop?.remove(); pop=null; az.querySelectorAll('.hit').forEach(s=>s.classList.remove('hit')); },350); };
  az.addEventListener('pointerdown',e=>{ on=true; try{az.setPointerCapture(e.pointerId)}catch(_){} pick(e.clientY); e.preventDefault(); });
  az.addEventListener('pointermove',e=>{ if(on) pick(e.clientY); }); az.addEventListener('pointerup',done); az.addEventListener('pointercancel',done); })();

/* ---------- clicks, long-press & context menu ---------- */
let lp=null, lpFired=false;
function cancelLP(){ if(lp){ clearTimeout(lp.t); lp=null; } }
const shelfEl=$('#shelf');
const lpTarget=e=>e.target.closest('[data-id]')||e.target.closest('#homeScroll .row-h');
const lpRun=t=>t.dataset.id? actionSheet(t.dataset.id) : t.dataset.kind==='queue'? queueMenu(t,t.dataset.q) : seriesMenu(t,t.dataset.kind==='series'?t.dataset.series:'');
shelfEl.addEventListener('pointerdown',e=>{ lpFired=false; const t=lpTarget(e); if(!t||e.button>0) return; cancelLP();
  lp={x:e.clientX,y:e.clientY,t:setTimeout(()=>{ lp=null; lpFired=true; try{navigator.vibrate&&navigator.vibrate(8)}catch(_){} lpRun(t); },520)}; });
shelfEl.addEventListener('pointermove',e=>{ if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>9) cancelLP(); });
shelfEl.addEventListener('pointerup',cancelLP); shelfEl.addEventListener('pointercancel',cancelLP);
shelfEl.addEventListener('scroll',cancelLP,true);
shelfEl.addEventListener('contextmenu',e=>{ const t=lpTarget(e); e.preventDefault(); if(t&&!lpFired){ cancelLP(); lpFired=true; lpRun(t); } });
shelfEl.addEventListener('click',e=>{ if(lpFired){ lpFired=false; e.preventDefault(); e.stopPropagation(); return; }
  const a=e.target.closest('[data-act]'); if(!a) return; const k=a.dataset.act;
  if(k==='open') openReader(a.dataset.id,a.dataset.q?{queue:a.dataset.q}:{queue:null}); else if(k==='qedit') editQueue(a.dataset.q); else if(k==='qmenu') queueMenu(a,a.dataset.q); else if(k==='see') seeAll(a.dataset.kind,a.dataset.series);
  else if(k==='filter'){ ui.filter=a.dataset.f; renderLibrary(); $('#libScroll').scrollTop=0; } else if(k==='unscope') unscope();
  else if(k==='smenu') seriesMenu(a,a.dataset.kind==='series'?a.dataset.series:''); else if(k==='srename') renameSeries(a.dataset.series); else if(k==='smerge') mergeSeries([a.dataset.series]);
  else if(k==='import') $('#fileIn').click(); else if(k==='drive') Drive.start(); },true);
$('#fileIn').addEventListener('change',e=>{ const fs=[...e.target.files]; e.target.value=''; if(fs.length) importFiles(fs); });
$('#settingsBtn').onclick=()=>openSettings();
document.addEventListener('keydown',e=>{ if(R&&R.comic||document.querySelector('.mwrap')||ui.tab!=='home'||!CF.el||e.target.matches('input')) return;
  if(e.key==='ArrowLeft') CF.to(Math.round(CF.pos)-1,320); else if(e.key==='ArrowRight') CF.to(Math.round(CF.pos)+1,320); else if(e.key==='Enter'){ const c=CF.items[Math.round(CF.pos)]; if(c) openReader(c.id); } });

/* ---------- menus, sheets, modals ---------- */
function openMenu(anchor,items,cls){ document.querySelector('.menu')?.remove(); const m=document.createElement('div'); m.className='menu'+(cls?' '+cls:''); m.setAttribute('role','menu');
  m.innerHTML=items.map((it,i)=>it.icon?`<button role="menuitem" data-i="${i}"${it.id?` id="${it.id}"`:''}><span>${esc(it.label)}</span>${it.icon}</button>`:`<button role="menuitemradio" aria-checked="${!!it.on}" data-i="${i}">${esc(it.label)}${it.on?IC.check:''}</button>`).join(''); document.body.appendChild(m);
  const r=anchor.getBoundingClientRect(); m.style.top=(r.bottom+6)+'px'; m.style.left=Math.max(8,Math.min(innerWidth-m.offsetWidth-8,r.right-m.offsetWidth))+'px';
  const close=()=>{ m.remove(); document.removeEventListener('pointerdown',out,true); }; const out=e=>{ if(!m.contains(e.target)) close(); };
  setTimeout(()=>document.addEventListener('pointerdown',out,true),0); m.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ close(); items[+b.dataset.i].run(); } }); }
function modal(html,onOpen,cls){ return new Promise(res=>{ const w=document.createElement('div'); w.className='mwrap'; w.innerHTML=`<div class="modal${cls?' '+cls:''}" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(w);
  let vals=null; const close=v=>{ if(w._vals) vals=w._vals(); w.remove(); document.removeEventListener('keydown',kd); res({r:v,vals}); };
  const kd=e=>{ if(e.key==='Escape') close(null); }; document.addEventListener('keydown',kd);
  w.addEventListener('click',e=>{ if(e.target===w) close(null); const b=e.target.closest('[data-r]'); if(b) close(b.dataset.r); });
  onOpen&&onOpen(w,close); }); }
async function confirmBox(title,msg,ok='Delete'){ return (await modal(`<div class="mh"><h3>${esc(title)}</h3></div><div class="mb"><p class="confirm-msg">${esc(msg)}</p></div><div class="mf"><button class="btn ghost" data-r="no">Cancel</button><button class="btn red" data-r="yes" id="confirmOk">${esc(ok)}</button></div>`)).r==='yes'; }
async function actionSheet(id){ const c=comics.find(x=>x.id===id); if(!c) return; document.querySelector('.mwrap')?.remove();
  const {r}=await modal(`<div class="grp"><div class="hd"><img src="${cover(c)}" alt=""><div><b>${esc(c.title)}</b><span>${c.series?esc(c.series)+' · ':''}${c.pages} pages${c.lastRead?' · '+pctOf(c)+'%':''}</span></div></div>
    <button class="act" data-r="read" id="aRead">${IC.book}${c.lastRead&&!isDone(c)?'Continue Reading':'Read'}</button>
    <button class="act" data-r="queue" id="aQueue">${IC.list}Add to Reading List…</button>
    <button class="act" data-r="edit" id="aEdit">${IC.edit}Edit Title &amp; Series</button>
    <button class="act" data-r="toggle" id="aToggle">${isDone(c)?IC.undo+'Mark as Unread':IC.done+'Mark as Finished'}</button>
    <button class="act red" data-r="delete" id="aDelete">${IC.trash}Delete from Device</button></div>
    <button class="cancel" data-r="cancel">Cancel</button>`,null,'sheet');
  if(r==='read') openReader(id); else if(r==='queue') addToQueue(id); else if(r==='edit') editComic(id); else if(r==='delete') deleteComic(id);
  else if(r==='toggle'){ if(isDone(c)){ c.progress=0; c.page=0; c.lastRead=0; } else { c.progress=1; } await dbPut(c); renderShelf(); } }
async function editComic(id){ const c=comics.find(x=>x.id===id); if(!c) return;

    <div class="fld"><span>Cover</span><div class="seg4" id="eCover" role="radiogroup">${[['auto','Auto'],['right','Right half'],['left','Left half'],['full','Full page']].map(([v,l])=>`<button type="button" role="radio" data-v="${v}" aria-checked="${(c.coverMode||'auto')===v}" class="${(c.coverMode||'auto')===v?'on':''}">${l}</button>`).join('')}</div></div>

      <small class="fhint">Fold in middle: for PDFs with two comic pages side by side on each page. Auto detects them${typeof c.foldAuto==='boolean'?` (detected: ${c.foldAuto?'fold in middle':'standard'})`:''}.</small></div>
    <div class="fld" id="eFoldPW"${(c.turnMode==='fold'||(c.turnMode!=='standard'&&c.foldAuto))?'':' style="display:none"'}><span>Portrait</span><div class="seg4 seg2" id="eFoldP" role="radiogroup">${[['half','Half pages'],['full','Full sheet']].map(([v,l])=>`<button type="button" role="radio" data-v="${v}" aria-checked="${(c.foldPortrait||'half')===v}" class="${(c.foldPortrait||'half')===v?'on':''}">${l}</button>`).join('')}</div>

// drag to reorder a list: pointer capture on the .ah handle; the row follows the finger and swaps with neighbours past their midpoint
function dragSort(L,done){ let d=null;
  L.addEventListener('pointerdown',e=>{ const h=e.target.closest('.ah'); if(!h||e.button>0) return; e.preventDefault(); const x=h.closest('li');
    d={x,id:e.pointerId,y0:e.clientY,raf:0,lastY:e.clientY}; x.classList.add('drag'); try{h.setPointerCapture(e.pointerId)}catch(_){} });
  const move=y=>{ if(!d) return; d.lastY=y; const x=d.x; let dy=y-d.y0; let p=x.previousElementSibling, n=x.nextElementSibling;
    while(p&&dy<-p.offsetHeight/2){ L.insertBefore(x,p); d.y0-=p.offsetHeight; dy=y-d.y0; p=x.previousElementSibling; }
    while(n&&dy>n.offsetHeight/2){ L.insertBefore(n,x); d.y0+=n.offsetHeight; dy=y-d.y0; n=x.nextElementSibling; }
    x.style.transform=`translateY(${dy}px)`;
    const lr=L.getBoundingClientRect(); const edge=y<lr.top+36?-1:y>lr.bottom-36?1:0;   // auto-scroll near the list edges
    if(edge&&!d.raf){ const tick=()=>{ if(!d){return;} const before=L.scrollTop; L.scrollTop+=edge*8; d.y0-=L.scrollTop-before; move(d.lastY); d.raf=(L.scrollTop!==before&&(d.lastY<L.getBoundingClientRect().top+36||d.lastY>L.getBoundingClientRect().bottom-36))?requestAnimationFrame(tick):0; }; d.raf=requestAnimationFrame(tick); } };
  L.addEventListener('pointermove',e=>{ if(d&&e.pointerId===d.id){ e.preventDefault(); move(e.clientY); } });
  const end=e=>{ if(!d||e.pointerId!==d.id) return; cancelAnimationFrame(d.raf); d.x.classList.remove('drag'); d.x.style.transform=''; d=null; done&&done(); };
  L.addEventListener('pointerup',end); L.addEventListener('pointercancel',end); }

/* ---------- import (validate + cover from the picked File, then copy into IndexedDB in chunks) ---------- */
let importing=false;
async function importFiles(files){
  if(importing){ toast('Already importing…'); return; } importing=true;
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  let ok=0;
  for(let k=0;k<files.length;k++){ const f=files[k]; const tag=files.length>1?` (${k+1}/${files.length})`:'';
    if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name))){ toast(`Skipped “${f.name}” — not a PDF`); continue; }
    const id=uid(); let doc=null;
    try{
      toast(`Reading ${f.name}${tag}…`,{progress:0,sticky:true});
      doc=await openPdf(new FileSource(f));
      await doc.getPage(1); await doc.destroy(); doc=null;          // validate before copying
      const n=Math.ceil(f.size/CHUNK);
      for(let i=0;i<n;i++){ const ab=await f.slice(i*CHUNK,Math.min(f.size,(i+1)*CHUNK)).arrayBuffer(); await dbPutChunk(id,i,ab);
        toast(`Saving ${f.name}${tag}…`,{progress:(i+1)/n,sticky:true}); }
      doc=await openPdf(new IDBSource(id,f.size));                    // cover from the stored copy (same path as Drive import/migration)
      const meta=await coverMeta(doc); const pages=doc.numPages; await doc.destroy(); doc=null;
      const t0=titleFromName(f.name); const rec={id,title:t0,series:seriesGuess(t0),fileName:f.name,size:f.size,pages,...meta,added:Date.now()+k,lastRead:0,page:0,progress:0,rtl:false};
      await dbPut(rec); comics.push(rec); ok++; renderShelf();
    }catch(err){ console.warn('import failed',err); try{ if(doc) await doc.destroy(); }catch(e){} try{ await dbDelete(id); }catch(e){}
      const quota=err&&(err.name==='QuotaExceededError'||/quota/i.test(err.message||''));
      toast(quota?`Out of storage space importing “${f.name}”.`:`Couldn't import “${f.name}”: ${err&&err.message||'not a valid PDF'}`); await new Promise(r=>setTimeout(r,1800)); }
  }
  importing=false; if(ok) toast(`Imported ${ok} comic${ok>1?'s':''} ✓`); renderShelf(); if(ok) kickBlack();
}

const Drive=(()=>{

  let tok=null;                 // {t, exp}

  const folder=()=>store.get('driveFolder',null)||DRIVE_DEFAULT_FOLDER;
  // accepts a Drive folder link (…/folders/ID?resourcekey=KEY, …open?id=ID) or a bare ID
  function parseFolderLink(txt){ txt=String(txt||'').trim(); if(!txt) return null; let id=null, rk=null;
    try{ const u=new URL(txt); const m=u.pathname.match(/\/folders\/([\w-]{10,})/); id=m?m[1]:u.searchParams.get('id'); rk=u.searchParams.get('resourcekey'); }
    catch(e){ const m=txt.match(/^[\w-]{10,}$/); id=m?m[0]:null; }

  const rkHeader=(keys)=>{ const v=[...new Set(keys.filter(Boolean))].join(','); return v?{'X-Goog-Drive-Resource-Keys':v}:{}; };

  let tokenClient=null, loadP=null, pickerReady=false;

  let resumePicker=false;
  (()=>{ const h=location.hash; if(!/[#&](access_token|error)=/.test(h)) return;
    const p=new URLSearchParams(h.slice(1)); let want=null; try{ want=sessionStorage.getItem('cr.oauthState'); sessionStorage.removeItem('cr.oauthState'); }catch(e){}
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    try{ mode=sessionStorage.getItem('cr.oauthMode')||'pick'; sessionStorage.removeItem('cr.oauthMode'); }catch(e){}

$('#pgrid').addEventListener('click',e=>{ const b=e.target.closest('button[data-p]'); if(!b) return; $('#pages').classList.add('hidden'); jumpTo(+b.dataset.p); });


/* ---- end of comic: next issue card / End page (drawn like a page, so turns, cache and layout just work) ---- */
const activeQueue=()=>R.queue?queues.find(q=>q.id===R.queue)||null:null;
function nextIssue(c){ const q=activeQueue();

const nextImgs=new Map();
async function nextCover(n,mw,mh){ const key=`${n.id}|${mw}|${mh}`; if(nextImgs.has(key)) return nextImgs.get(key);

async function drawEndCard(w,h){ const W=Math.round(w*DPR), H=Math.round(h*DPR), k=DPR, c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d',{alpha:false}); x.fillStyle=R.spread?'#0b0b0b':'#000'; x.fillRect(0,0,W,H); /* facing page in 2-up; seamless black when the card fills the screen */ x.textAlign='center'; x.textBaseline='alphabetic'; const F=UIF(), n=R.next;
  if(n){ const pad=Math.round(Math.max(16,h*.03)*k), gap=Math.round(18*k);
    const no=issueNo(n.title), qn=activeQueue(), label=qn?n.title:`${n.series}${no!==Infinity?' #'+no:''}`;

    const block=capH+gap+ch, y0=Math.max(pad,Math.round((H-block)/2));

    x.font=`650 ${Math.round(32*k)}px ${F}`; x.fillStyle='#f4f4f4'; x.fillText(fitText(x,label,W*.92),W/2,ty);
    x.font=`500 ${Math.round(20*k)}px ${F}`; x.fillStyle='#a3a3a3'; x.fillText(R.rtl?'\u2190  Turn the page to start':'Turn the page to start  \u2192',W/2,ty+Math.round(34*k));
    const cy=y0+capH+gap, cx=(W-cw)/2;

    x.strokeStyle='rgba(255,255,255,.07)'; x.lineWidth=k; x.strokeRect(Math.round(cx)+.5*k,Math.round(cy)+.5*k,Math.round(cw)-k,Math.round(ch)-k);
  } else { const t=R.comic.title, cy=H*.44;
    x.font=`400 ${Math.round(12*k)}px ${F}`; x.fillStyle='#7a7a7a'; x.letterSpacing=`${1.6*k}px`; x.fillText('THE END',W/2,cy-Math.round(34*k)); x.letterSpacing='0px';

    const bw=Math.round(168*k), bh=Math.round(40*k), bx=(W-bw)/2, by=cy+Math.round(56*k); x.strokeStyle='rgba(255,255,255,.28)'; x.lineWidth=k; x.beginPath(); x.roundRect(bx+.5*k,by+.5*k,bw-k,bh-k,bh/2); x.stroke();

function fitText(x,t,max){ if(x.measureText(t).width<=max) return t; while(t.length>1&&x.measureText(t+'\u2026').width>max) t=t.slice(0,-1); return t+'\u2026'; }
function endTap(pt){ if(R.next||!R.endBtn||!R.viewEl) return false; const d=R.viewEl.querySelector(`.pg[data-p="${R.n}"]`); if(!d) return false; const cv=d.querySelector('canvas'); if(!cv) return false;
  const r=cv.getBoundingClientRect(), sr=stage.getBoundingClientRect(), b=R.endBtn, px=pt.x+sr.left-r.left, py=pt.y+sr.top-r.top;
  if(px>=b.x*r.width-8&&px<=(b.x+b.w)*r.width+8&&py>=b.y*r.height-8&&py<=(b.y+b.h)*r.height+8){ $('#rBack').click(); return true; } return false; }
function openNext(){ const n=R.next; if(!n) return; saveNow(); cancelFlipNow(); dropJobs(()=>true); const d=R.doc; R.doc=null; if(d) d.destroy().catch(()=>{}); freeHi(); cacheClear();
  n.page=0; n.half=null;   // the next-issue card always starts that issue on its cover, not the saved page
  try{ history.replaceState({r:n.id},'','#/read/'+n.id); }catch(e){} openReader(n.id,{push:false,atCover:true,queue:R.queue}); }

// blank-black detection finished (or the setting changed) for the open comic: rebuild the page sequence in place, keeping the reader on the same page
function reseq(){ if(!R.comic||!R.doc||!R.views.length) return; if(flip||animating||landing){ clearTimeout(R.reseqT); R.reseqT=setTimeout(reseq,250); return; }
  const was=R.skip?[...R.skip].join():''; const cur=pagesOf(R.views[R.vi]).filter(p=>p!=null&&p<=R.n), p=cur.length?cur[0]:0, h=halfOf(R.vi);
  buildViews(); if([...R.skip].join()===was){ return; } R.vi=clamp(viewOfPage(p,h),0,R.views.length-1); renderView(); }
addEventListener('cr-black',e=>{ if(R.comic&&e.detail===R.comic.id) reseq(); });

/* ================= Guided panel view ================= */
// double-tap a panel: the page glides in until that panel fills the screen (everything else dimmed); swipe or tap the edges for the next /
// previous panel in reading order, across page turns; double-tap again (or Full Page) for the whole page. Pinch leaves it for free zoom.
const P={on:false,busy:false,internal:false,list:[],i:0,vi:-1,key:null};
const pmask=document.createElement('div'); pmask.id='pmask'; pmask.className='hidden'; stage.appendChild(pmask);
const pexit=$('#pExit');
const panelsOn=()=>store.get('panelView',true);
const PANEL_PAD=6;
function panelCache(){ const c=R.comic; if(c.panelV!==PANEL_V||!c.panels){ c.panels={}; c.panelV=PANEL_V; } return c.panels; }
let panelSaveT=0; function panelSave(){ clearTimeout(panelSaveT); const c=R.comic; panelSaveT=setTimeout(()=>{ if(c) dbPut(c).catch(()=>{}); },1500); }
// units of a view in reading order: {p, h ('' | 'L' | 'R'), slot (index of the .pg element), crop (the half sits inside a whole-sheet canvas)}
function unitsOfView(k){ const v=R.views[k]; if(!v) return []; const out=[];
  if(v.length===2){ const vis=visualPages(v), order=R.rtl?[1,0]:[0,1]; order.forEach(j=>{ if(vis[j]!=null&&vis[j]<R.n) out.push({p:vis[j],h:'',slot:j,crop:false}); }); return out; }
  const p=v[0]; if(p==null||p>=R.n) return out;
  if(R.half){ out.push({p,h:R.vh[k]||'',slot:0,crop:false}); return out; }
  if(R.fold&&p>0&&(R.aspects[p]||0)>WIDE){ (R.rtl?['R','L']:['L','R']).forEach(h=>out.push({p,h,slot:0,crop:true})); return out; }
  out.push({p,h:'',slot:0,crop:false}); return out; }
const unitKey=u=>u.p+u.h;
function unitPanels(u,prio=0){ const pc=panelCache(), rtl=R.rtl, key=unitKey(u)+(rtl?'~r':''); if(key in pc) return Promise.resolve(pc[key]); const doc=R.doc, c=R.comic;   // RTL reading order is cached separately
  return enqueue('pn|'+key,'panel',u.p,prio,async()=>{ const page=await doc.getPage(u.p+1), vp=page.getViewport({scale:1}), wide=!!u.h&&vp.width>vp.height;
    const cv=await renderToCanvas(page,wide?760:380,560,1,wide?420000:220000); page.cleanup(); let b=null; try{ b=panelsOfCanvas(cv,u.h,rtl); }finally{ freeCanvas(cv); }
    if(R.comic===c){ panelCache()[key]=b||0; panelSave(); } return b||0; }); }
// where a unit's image sits in view coordinates (unzoomed)
function unitRect(u){ const el=R.viewEl&&R.viewEl.querySelectorAll('.pg')[u.slot]; if(!el) return null; const cv=el.querySelector('canvas');
  let x=parseFloat(el.style.left)||0, y=parseFloat(el.style.top)||0, w=el.offsetWidth, h=el.offsetHeight;
  if(cv){ x+=parseFloat(cv.style.left)||0; y+=parseFloat(cv.style.top)||0; w=parseFloat(cv.style.width)||w; h=parseFloat(cv.style.height)||h; }
  if(u.crop){ w/=2; if(u.h==='R') x+=w; } return {x,y,w,h}; }
const painted=()=>R.viewEl&&!R.viewEl.querySelector('.pg.loading');
function whenPainted(ms=2500){ return new Promise(res=>{ const t0=performance.now(); const f=()=>{ if(painted()||performance.now()-t0>ms) res(); else requestAnimationFrame(f); }; f(); }); }
async function panelList(k){ const us=unitsOfView(k), out=[];
  const boxes=await Promise.all(us.map(u=>unitPanels(u,0).catch(()=>0)));
  if(R.vi!==k) return null; await whenPainted();
  us.forEach((u,j)=>{ const r=unitRect(u); if(!r) return; const B=boxes[j]||panelThirds(r.w/r.h,R.rtl);
    B.forEach((b,bi)=>out.push({key:unitKey(u),bi,fb:!boxes[j],r:{x:r.x+b.x*r.w,y:r.y+b.y*r.h,w:b.w*r.w,h:b.h*r.h}})); });
  return out; }
function panelFit(r){ const W=stage.clientWidth, H=stage.clientHeight, m=Math.min(20,W*.03), pad=PANEL_PAD;
  const x=r.x-pad, y=r.y-pad, w=r.w+pad*2, h=r.h+pad*2, s=clamp(Math.min((W-2*m)/w,(H-2*m)/h),1,6);
  return {s,tx:W/2-(x+w/2)*s,ty:H/2-(y+h/2)*s,x,y,w,h}; }
function placeMask(animate){ if(!P.on||!P.list[P.i]){ pmask.classList.add('hidden'); return; } const f=panelFit(P.list[P.i].r);
  pmask.classList.toggle('anim',!!animate); pmask.classList.remove('hidden');
  Object.assign(pmask.style,{left:(f.x*Z.s+Z.tx)+'px',top:(f.y*Z.s+Z.ty)+'px',width:(f.w*Z.s)+'px',height:(f.h*Z.s)+'px'}); }
function showPanel(animate){ const pn=P.list[P.i]; if(!pn) return; const f=panelFit(pn.r); Z.s=f.s; Z.tx=f.tx; Z.ty=f.ty; applyZoom(animate); placeMask(animate);
  P.key={k:pn.key,bi:pn.bi}; pexit.querySelector('span').textContent=`${P.i+1} / ${P.list.length}`; scheduleHi(); }
function panelUI(on){ pexit.classList.toggle('hidden',!on); if(!on) pmask.classList.add('hidden'); readerEl.classList.toggle('panels',on); }
async function enterPanels(pt,want){ if(!R.doc||flip||animating||P.busy) return false; const k=R.vi; P.busy=true;
  try{ const L=await panelList(k); if(!L||!L.length||R.vi!==k||flip||Z.s>1.01) return false;
    let i=0;
    if(want){ const j=L.findIndex(p=>p.key===want.k&&p.bi===want.bi); i=j>=0?j:want.last?L.length-1:0; }
    else if(pt){ const hit=L.map((p,j)=>({j,in:pt.x>=p.r.x&&pt.x<=p.r.x+p.r.w&&pt.y>=p.r.y&&pt.y<=p.r.y+p.r.h,d:Math.hypot(pt.x-(p.r.x+p.r.w/2),pt.y-(p.r.y+p.r.h/2)),a:p.r.w*p.r.h}));
      const ins=hit.filter(h=>h.in).sort((a,b)=>a.a-b.a); i=ins.length?ins[0].j:hit.sort((a,b)=>a.d-b.d)[0].j; }
    P.on=true; P.list=L; P.i=i; P.vi=k; panelUI(true); showPanel(!want); toggleUI(false); return true; }
  finally{ P.busy=false; } }
function exitPanels(animate=true){ if(!P.on) return; P.on=false; P.key=null; panelUI(false); resetZoom(animate); }
function dropPanels(){ if(!P.on) return; P.on=false; P.key=null; panelUI(false); }   // leave panel mode but keep the current zoom (pinch, ctrl-wheel)
async function stepPanel(fwd){ if(!P.on||P.busy) return; const ni=P.i+(fwd?1:-1);
  if(ni>=0&&ni<P.list.length){ P.i=ni; showPanel(true); return; }
  const t=R.vi+(fwd?1:-1);
  if(t>=R.views.length){ if(R.next){ exitPanels(false); openNext(); } else bouncePanel(-1); return; }
  if(t<0){ bouncePanel(1); return; }
  if(!unitsOfView(t).length){ exitPanels(false); jumpToView(t); return; }   // the end card is shown as a whole page
  P.busy=true; const fade=a=>new Promise(r=>{ if(!stage.animate){ r(); return; } const an=stage.animate([{opacity:a?1:0},{opacity:a?0:1}],{duration:a?110:170,easing:'ease-out',fill:'forwards'}); an.onfinish=()=>{ r(); if(!a) an.cancel(); }; });

    else { P.list=L; P.i=fwd?0:L.length-1; P.vi=t; showPanel(false); } await fade(false); }

// a re-render (rotation, resize, settings) while in panel mode comes back to the same panel when it is still on screen
function panelsAfterRender(){ if(P.internal||!P.on) return; const want=P.key; P.on=false; panelUI(false);
  if(!want) return; const k=R.vi; if(!unitsOfView(k).some(u=>unitKey(u)===want.k)) return;
  setTimeout(()=>{ if(R.vi===k&&!P.on&&Z.s<=1.01) enterPanels(null,want); },60); }
pexit.addEventListener('click',()=>exitPanels(true));
addEventListener('resize',()=>{ if(P.on) placeMask(false); });
/* ================= boot ================= */
window.__cr={black:{scan:scanBlack,stats:pageBlackStats,blackStats,async statsOfUrl(u){ const b=await (await fetch(u)).blob(); const doc=await openPdf(new FileSource(b)); const out=[]; try{ for(let i=0;i<doc.numPages;i++){ const pg=await doc.getPage(i+1); out.push(await pageBlackStats(pg)); pg.cleanup(); } } finally{ await doc.destroy(); } return out; }},drive:Drive,issueNo,isRangeName,series:{rename:renameSeries,merge:mergeSeries,counts:seriesCounts},rows:{keys:rowKeys,prefs:rowPrefs,arrange:arrangeRows},cov:{makeCover,openPdf,IDBSource},R,Z,get flip(){return flip},get animating(){return animating},cache:()=>({n:cache.size,px:cachePx,budget:CACHE_BUDGET}),panels:{P,detect:detectPanels,thirds:panelThirds,enter:enterPanels,exit:exitPanels,step:stepPanel,units:unitsOfView,list:panelList,async detectUrl(u,rtl=false){ const b=await (await fetch(u)).blob(); const doc=await openPdf(new FileSource(b)); const out=[]; try{ for(let i=0;i<doc.numPages;i++){ const pg=await doc.getPage(i+1), vp=pg.getViewport({scale:1}), wide=vp.width>vp.height*1.15; const cv=await renderToCanvas(pg,wide?760:380,560,1,wide?420000:220000); pg.cleanup(); out.push(wide?{L:panelsOfCanvas(cv,'L',rtl),R:panelsOfCanvas(cv,'R',rtl)}:panelsOfCanvas(cv,'',rtl)); freeCanvas(cv); } } finally{ await doc.destroy(); } return out; }},CF,SCF,go,jumpTo,toggleUI,scheduleHi,get comics(){return comics},get queues(){return queues},kickBlack};
(async()=>{ try{ await loadLibrary(); }catch(e){ console.warn(e); $('#homeScroll').innerHTML='<div class="empty"><h2>Storage unavailable</h2><p>On-device storage is unavailable in this browser mode (e.g. Private Browsing).</p></div>'; return; }
  try{ if(comics.length&&navigator.storage&&navigator.storage.persisted&&!(await navigator.storage.persisted())) navigator.storage.persist().catch(()=>{}); }catch(e){}
  const m=location.hash.match(/^#\/read\/(.+)$/);
  if(m&&comics.find(c=>c.id===m[1])){ try{ history.replaceState(null,'',location.pathname+location.search); history.pushState({r:m[1]},'','#/read/'+m[1]); }catch(e){} openReader(m[1],{push:false}); }
  else if(m){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
