<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Comics">
<meta name="format-detection" content="telephone=no">
<title>Comic Shelf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="modulepreload" href="vendor/pdf.min.mjs">
<script>
/* v52 startup safety net (plain script, runs even if the app module fails to load): never a silent blank screen.
   Shows an error panel with Reload; "Reset app files" clears only the service worker + its file cache, never the comics (IndexedDB). */
(function(){
  var shown=false, errs=[];
  function show(title,detail){ if(shown||document.documentElement.dataset.ready==='1'&&title!=='crash') return; shown=true;
    var go=function(){ var d=document.getElementById('crCrash'); if(!d){ d=document.createElement('div'); d.id='crCrash'; document.body.appendChild(d); }
      d.setAttribute('style','position:fixed;inset:0;z-index:2147483647;background:#000;color:#fff;font:16px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 24px 24px;text-align:center;gap:14px');
      d.innerHTML='<h2 style="margin:0;font-size:22px">Comic Shelf didn\u2019t start</h2><p style="margin:0;max-width:440px;color:#bbb">Your comics are safe on this device. Tap Reload to try again.</p>'+
        '<button id="crReload" style="min-height:44px;padding:0 28px;border-radius:22px;border:0;background:#fff;color:#000;font-size:17px;font-weight:600">Reload</button>'+
        '<button id="crReset" style="min-height:40px;padding:0 20px;border-radius:20px;border:1px solid #555;background:none;color:#ddd;font-size:15px">Reset app files (keeps comics)</button>'+
        '<pre style="max-width:90vw;white-space:pre-wrap;color:#777;font-size:12px;margin:8px 0 0">'+String(detail||'').replace(/[<&]/g,function(c){return c==='<'?'&lt;':'&amp;';}).slice(0,600)+'</pre>';
      document.getElementById('crReload').onclick=function(){ location.reload(); };
      document.getElementById('crReset').onclick=function(){ var p=[]; try{ if(navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }catch(e){}
        try{ if(window.caches) p.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(e){}
        Promise.all(p).catch(function(){}).then(function(){ location.replace(location.pathname+'?r='+Date.now()); }); };
    };
    if(document.body) go(); else addEventListener('DOMContentLoaded',go);
  }
  window.__crFail=function(e){ show('crash',(e&&(e.stack||e.message))||e); };
  addEventListener('error',function(e){ var t=e.target; if(t&&t!==window){ if(t.tagName!=='SCRIPT') return; errs.push('Failed to load '+(t.src||'app script')); if(document.documentElement.dataset.ready!=='1') show('load',errs.join('\n')); return; }
    errs.push((e.message||'Error')+(e.filename?' @'+e.filename.split('/').pop()+':'+e.lineno:'')); if(document.documentElement.dataset.ready!=='1') show('err',errs.join('\n')); },true);
  addEventListener('unhandledrejection',function(e){ var r=e.reason; errs.push('Unhandled: '+((r&&(r.stack||r.message))||r)); });
  setTimeout(function(){ if(document.documentElement.dataset.ready!=='1') show('slow','Startup took longer than 12 seconds.\n'+errs.join('\n')); },12000);
})();
</script>
<style>
:root{
  --bg:#000; --bar:#000; --el:#1c1c1e; --el2:#2c2c2e; --el3:#3a3a3c; --sep:#262628;
  --txt:#f5f5f7; --mut:#8e8e93; --red:#e5383b; --blue:#0a84ff; --read:#000;
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue','Segoe UI',Roboto,Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --padx:max(16px,var(--sal)); --padr:max(16px,var(--sar));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--ui);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{position:fixed;inset:0;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit}
img{-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
.topbar{flex:none;background:var(--bar);padding:var(--sat) var(--padr) 0 var(--padx);border-bottom:.5px solid var(--sep);position:relative;z-index:5}
.tb-row{height:50px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.segctl{justify-self:center;display:inline-flex;background:var(--el);border-radius:9px;padding:2px;gap:2px}
.segctl button{min-width:96px;height:40px;border-radius:7px;font-size:14px;font-weight:600;color:var(--mut);transition:background .15s,color .15s}
.segctl button.on{background:var(--el3);color:#fff}
.icbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:20px;color:#fff}
.icbtn:active{background:#ffffff1a}
#importBtn{justify-self:end}
#importBtn svg{width:26px;height:26px;stroke-width:2}
.tabview{flex:1;min-height:0;position:relative}
.scrollv{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scrollv::-webkit-scrollbar,.row-s::-webkit-scrollbar{display:none}

/* ---------- Home: coverflow hero ---------- */
.hero{padding:10px 0 0;position:relative;overflow:hidden;background:radial-gradient(120% 70% at 50% 34%,#16161a 0%,#000 70%)}
.cf{position:relative;height:calc(var(--cw)*1.5 + 4px + var(--cw)*.16);perspective:1100px;perspective-origin:50% 45%;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.cf-item{position:absolute;left:50%;top:6px;width:var(--cw);height:calc(var(--cw)*1.5);margin-left:calc(var(--cw)/-2);transform-style:preserve-3d;will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cf-item img{width:100%;height:100%;object-fit:cover;display:block;background:var(--el);box-shadow:0 18px 50px rgba(0,0,0,.7);-webkit-box-reflect:below 1px linear-gradient(transparent 78%,rgba(255,255,255,.14))}
.cf-item .dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.cf-item.lite img{-webkit-box-reflect:none;box-shadow:none}.cf.moving .cf-item img{box-shadow:none}
.pillbtn{height:36px;padding:0 26px;border-radius:18px;background:#fff;color:#000;font-size:15px;font-weight:700}
.pillbtn:active{opacity:.8}
.pillbtn.ghost{background:var(--el2);color:#fff}

/* ---------- Home: rows ---------- */
.rows{padding:0 0 calc(24px + var(--sab))}
.row{margin:18px 0 6px}.rows>.row:first-child{margin-top:12px}
.row-top{display:flex;align-items:center}.row-top .row-h{flex:1;min-width:0;padding-right:2px}
.row-more{flex:none;width:40px;height:34px;margin-right:calc(var(--padr) - 10px);display:grid;place-items:center;color:var(--mut);border-radius:17px}
.row-more svg{width:22px;height:22px}.row-more:active{background:var(--el)}
.mgname{padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.row-h{display:flex;align-items:center;gap:4px;width:100%;padding:0 var(--padr) 0 var(--padx);height:34px;text-align:left}
.row-h h2{margin:0;font-size:19px;font-weight:700;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-h .n{font-size:14px;color:var(--mut);font-weight:500}
.row-h svg{width:20px;height:20px;color:var(--mut);stroke-width:2.4}
.row-s{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:8px var(--padr) 6px var(--padx);scroll-padding:0 var(--padx);overscroll-behavior-x:contain}
.rc{flex:none;width:var(--rw);text-align:left;display:block}
.cvr{position:relative;width:100%;aspect-ratio:2/3;background:var(--el);overflow:hidden}
.cvr img{width:100%;height:100%;object-fit:cover;display:block}
.cvr .done{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:11px;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center}
.cvr .done svg{width:13px;height:13px;stroke:#fff;stroke-width:3.2}
.cvr .rtlb{position:absolute;left:6px;top:6px;font-size:10px;font-weight:800;letter-spacing:.04em;background:rgba(0,0,0,.78);color:#fff;padding:2px 5px;border-radius:4px}
.pl{height:3px;background:var(--el3);margin-top:5px;overflow:hidden}
.pl i{display:block;height:100%;background:#fff}
.rc .t{font-size:14px;font-weight:700;color:#fff;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .s{font-size:12px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seeall{flex:none;width:var(--rw);aspect-ratio:2/3;background:var(--el);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:14px;font-weight:600}
.seeall svg{width:26px;height:26px;stroke-width:2;color:var(--mut)}
.seeall:active,.rc:active .cvr{opacity:.75}

/* ---------- Library ---------- */
#library{display:flex;flex-direction:column}
.libbar{flex:none;padding:10px var(--padr) 8px var(--padx);background:var(--bar);display:flex;flex-direction:column;gap:9px}
.lrow{display:flex;gap:8px;align-items:center;min-width:0}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:36px;border-radius:10px;border:0;background:var(--el);color:#fff;padding:0 12px 0 34px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--mut)}
.search svg{position:absolute;left:10px;top:9px;width:18px;height:18px;color:var(--mut)}
.sortbtn{flex:none;height:36px;padding:0 12px;border-radius:10px;background:var(--el);color:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sortbtn svg{width:17px;height:17px}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(-1*var(--padr)) 0 calc(-1*var(--padx));padding:0 var(--padr) 0 var(--padx)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 14px;border-radius:15px;background:var(--el);color:#d1d1d6;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:#fff;color:#000}
.chip.scope{background:var(--el2);color:#fff}
.chip.scope svg{width:14px;height:14px;stroke-width:2.6}
.chip .c{font-weight:500;opacity:.6}
#libScroll{flex:1;min-height:0}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;padding:6px calc(var(--padr) + var(--azw,0px)) calc(24px + var(--sab)) var(--padx)}
@media (min-width:600px){.lgrid{grid-template-columns:repeat(5,1fr);gap:12px 8px}}
@media (min-width:1000px){.lgrid{grid-template-columns:repeat(7,1fr)}}
.lc{display:block;text-align:left;min-width:0;position:relative}
.lc:active .cvr{opacity:.75}
.lhead{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--mut);padding:8px 0 0;letter-spacing:.04em}
.lempty{color:var(--mut);text-align:center;padding:60px 20px;font-size:15px}
#azIndex{position:absolute;right:max(2px,var(--sar));top:120px;bottom:calc(80px + var(--sab));width:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;touch-action:none;user-select:none;-webkit-user-select:none}
#azIndex span{flex:0 1 18px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--blue);width:20px;min-height:10px}
#azIndex span.off{color:#48484a}
#azIndex span.hit{color:#fff}
.azpop{position:absolute;right:46px;width:56px;height:56px;border-radius:12px;background:var(--el2);color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:6;pointer-events:none}

/* ---------- now reading pill ---------- */

/* ---------- empty ---------- */
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 28px 80px;gap:10px}
.empty svg{width:64px;height:64px;color:#48484a;stroke-width:1.5}
.empty h2{margin:6px 0 0;font-size:22px;font-weight:700}
.empty p{margin:0 0 12px;color:var(--mut);font-size:15px;line-height:1.45;max-width:400px}

/* ---------- sheets / modals ---------- */
.mwrap{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,var(--sat)) 16px max(16px,var(--sab));animation:fadein .15s}
@keyframes fadein{from{opacity:0}}
.modal{background:var(--el);border-radius:14px;width:min(440px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal .mh{padding:18px 18px 4px}
.modal .mh h3{margin:0;font-size:18px;font-weight:700}
.modal .mb{padding:12px 18px}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:6px 18px 18px;flex-wrap:wrap}
.btn{height:38px;padding:0 18px;border-radius:10px;background:#fff;color:#000;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--el2);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn:active{opacity:.8}
.sp{flex:1}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px}
.fld input[type=text]{width:100%;height:42px;border-radius:10px;border:0;background:var(--el2);color:#fff;padding:0 12px;font-size:16px;outline:none}
.fld input:focus{box-shadow:0 0 0 2px var(--blue)}
.tgl{display:flex;align-items:center;gap:12px;padding:10px 0;font-weight:600;font-size:15px;cursor:pointer}
.tgl input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--el3);position:relative;flex:none;margin:0;transition:background .15s;order:2;margin-left:auto}
.tgl input::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl input:checked{background:#30d158}
.tgl input:checked::after{transform:translateX(20px)}
.tgl small{display:block;font-weight:400;color:var(--mut);font-size:12.5px;margin-top:2px}
.note{background:var(--el2);border-radius:10px;padding:12px 13px;color:#d1d1d6;font-size:14px;line-height:1.45;margin:12px 0}
.note b{color:#fff}
.stor{display:flex;align-items:baseline;gap:8px;font-size:15px;flex-wrap:wrap;color:var(--mut)}
.stor b{font-size:28px;font-weight:700;color:#fff}
.mstat{color:var(--mut);font-size:13px;margin-top:4px}
.confirm-msg{margin:0;line-height:1.45;color:#d1d1d6;font-size:15px}
/* action sheet */
.sheet{background:transparent;box-shadow:none;width:min(400px,100%)}
.sheet .grp{background:var(--el);border-radius:14px;overflow:hidden}
.sheet .hd{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:.5px solid var(--el3)}
.sheet .hd img{width:40px;height:60px;object-fit:cover;background:var(--el2)}
.sheet .hd b{display:block;font-size:15px}
.sheet .hd span{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.sheet .act{display:flex;align-items:center;gap:12px;width:100%;height:52px;padding:0 16px;font-size:16px;border-bottom:.5px solid var(--el3);text-align:left}
.sheet .act:last-child{border-bottom:0}
.sheet .act svg{width:20px;height:20px;color:var(--mut)}
.sheet .act.red,.sheet .act.red svg{color:#ff453a}
.sheet .act:active{background:var(--el2)}
.sheet .cancel{margin-top:8px;width:100%;height:52px;border-radius:14px;background:var(--el);font-size:16px;font-weight:700}
.menu{position:fixed;z-index:110;background:#2c2c2e;border-radius:12px;min-width:200px;box-shadow:0 14px 40px rgba(0,0,0,.6);overflow:hidden;animation:fadein .12s}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;padding:0 16px;font-size:15px;border-bottom:.5px solid #3a3a3c;text-align:left}
.menu button:last-child{border-bottom:0}
.menu button svg{width:17px;height:17px;stroke-width:2.6}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--sab));transform:translateX(-50%);z-index:200;background:#2c2c2e;color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;font-size:14px;max-width:min(92vw,480px);box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fadein .15s}
.toast .tb{height:3px;border-radius:2px;background:#ffffff22;margin-top:8px;overflow:hidden}
.toast .tb i{display:block;height:100%;background:#fff;transition:width .2s}

/* ---------- Reader ---------- */
#reader{background:var(--read);z-index:10}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--read)}
#zoomer{position:absolute;inset:0;transform-origin:0 0}
#zoomer.anim{transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.view{position:absolute;inset:0}
.pg{position:absolute}
.pg>canvas,.face>canvas{position:absolute;display:block;background:#fff}
.view .pg>canvas{box-shadow:0 4px 24px rgba(0,0,0,.6)}
.pg.loading,.face.loading{background:#111}
.phn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#ffffff1f}
.phn::after{content:"";position:absolute;left:50%;top:calc(50% + 44px);width:22px;height:22px;margin-left:-11px;border:2.5px solid #ffffff22;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flip{position:absolute;inset:0;z-index:6;pointer-events:none}
.face{position:absolute;overflow:hidden}
.face .shade{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:3}
.flipper{position:absolute;will-change:transform;z-index:5}
.flipper>.face{left:0;top:0;width:100%;height:100%}
.flipper>.face.back{transform:rotateY(180deg)}
.rbar{position:absolute;left:0;right:0;z-index:20;background:#000;transition:transform .2s ease,visibility .2s}
.rbar.top{top:0;padding:var(--sat) max(6px,var(--sar)) 0 max(6px,var(--sal));border-bottom:.5px solid var(--sep)}
.rbar.bot{bottom:0;padding:0 max(14px,var(--sar)) var(--sab) max(14px,var(--sal));border-top:.5px solid var(--sep)}
#reader:not(.ui) .rbar.top{transform:translateY(-110%);visibility:hidden}
#reader:not(.ui) .rbar.bot{transform:translateY(110%);visibility:hidden}
.rrow{height:44px;display:flex;align-items:center;gap:4px}
.rrow .back{display:flex;align-items:center;gap:1px;height:36px;padding:0 10px 0 2px;border-radius:9px;font-weight:500;font-size:16px;color:#fff}
.rrow .back:active{background:#ffffff14}
.rtitle{flex:1;min-width:0;text-align:center;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.rbtn{height:40px;min-width:40px;padding:0 9px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:#fff;font-size:12.5px;font-weight:600}
.rbtn:active{background:#ffffff14}
.rbtn.on{background:#fff;color:#000}
.rbtn svg.i{width:19px;height:19px}
.brow{height:34px;display:flex;align-items:center;gap:12px}
.scrub{flex:1;position:relative;height:34px;display:flex;align-items:center}
#scrub{width:100%;margin:0;-webkit-appearance:none;appearance:none;background:transparent;height:30px}
#scrub::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,#fff var(--pct,0%),#3a3a3c var(--pct,0%))}
#scrub[dir=rtl]::-webkit-slider-runnable-track{background:linear-gradient(270deg,#fff var(--pct,0%),#3a3a3c var(--pct,0%))}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:0;margin-top:-6px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
#scrub::-moz-range-track{height:3px;border-radius:2px;background:#3a3a3c}
#scrub::-moz-range-progress{height:3px;background:#fff}

/* ================= IndexedDB ================= */
let dbp=null;
function db(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ const r=indexedDB.open('comic-reader',3);   // v2: + reading lists ('queues'); v3: + per-file overrides ('overrides': manual dates)
  r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('comics')) d.createObjectStore('comics',{keyPath:'id'}); if(!d.objectStoreNames.contains('chunks')) d.createObjectStore('chunks',{keyPath:['id','i']});

async function ovDel(k){ const d=await db(); const t=d.transaction('overrides','readwrite'); t.objectStore('overrides').delete(k); return txDone(t); }
async function dbAll(){ const d=await db(); return req2p(d.transaction('comics').objectStore('comics').getAll()); }
async function dbPut(rec){ const d=await db(); const t=d.transaction('comics','readwrite'); t.objectStore('comics').put(rec); return txDone(t); }
async function dbPutChunk(id,i,data){ const d=await db(); const t=d.transaction('chunks','readwrite'); t.objectStore('chunks').put({id,i,data}); return txDone(t); }
async function dbGetChunk(id,i){ const d=await db(); const r=await req2p(d.transaction('chunks').objectStore('chunks').get([id,i])); return r&&r.data; }
// reading lists: {id, name, items:[comic ids in reading order], created, updated}
async function qAll(){ const d=await db(); return req2p(d.transaction('queues').objectStore('queues').getAll()); }
async function qPut(q){ const d=await db(); const t=d.transaction('queues','readwrite'); t.objectStore('queues').put(q); return txDone(t); }
async function qDel(id){ const d=await db(); const t=d.transaction('queues','readwrite'); t.objectStore('queues').delete(id); return txDone(t); }
async function dbDelete(id){ const d=await db(); const t=d.transaction(['comics','chunks'],'readwrite'); t.objectStore('comics').delete(id); t.objectStore('chunks').delete(IDBKeyRange.bound([id,0],[id,Infinity])); return txDone(t); }

/* ================= PDF sources: range reads, never the whole file in memory ================= */
class FileSource{ constructor(f){this.f=f;this.size=f.size} read(a,b){ return this.f.slice(a,b).arrayBuffer(); } }
class IDBSource{
  constructor(id,size){ this.id=id; this.size=size; this.cache=new Map(); }
  async chunk(i){ if(this.cache.has(i)){ const c=this.cache.get(i); this.cache.delete(i); this.cache.set(i,c); return c; }
    let c=await dbGetChunk(this.id,i); if(!c) throw new Error('Missing data chunk '+i);

const alpha=(a,b)=>a.localeCompare(b,undefined,{numeric:true});

  const nh=p.hidden.filter(k=>!keys.has(k)); if(allHidden) nh.push(tk); setRowPrefs(no,nh); }

/* ---------- shelf of volumes (v30): one book spine per series/volume (Library grouping incl. Move to Series), on a dark wooden shelf ---------- */
const SPINE_V=3;   // v33: + accent; v34: art panel dropped (resample frees the stored crop)
const hashN=t=>{ let h=2166136261; for(const ch of String(t)) h=Math.imul(h^ch.charCodeAt(0),16777619); return h>>>0; };

/* ---------- import (validate + cover from the picked File, then copy into IndexedDB in chunks) ---------- */
let importing=false;
async function importFiles(files){
  if(importing){ toast('Already importing…'); return; } importing=true;
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  let ok=0;
  for(let k=0;k<files.length;k++){ const f=files[k]; const tag=files.length>1?` (${k+1}/${files.length})`:'';
    if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name))){ toast(`Skipped “${f.name}” — not a PDF`); continue; }
    const id=uid(); let doc=null;
    try{
      toast(`Reading ${f.name}${tag}…`,{progress:0,sticky:true});
      doc=await openPdf(new FileSource(f));
      await doc.getPage(1); await doc.destroy(); doc=null;          // validate before copying
      const n=Math.ceil(f.size/CHUNK);
      for(let i=0;i<n;i++){ const ab=await f.slice(i*CHUNK,Math.min(f.size,(i+1)*CHUNK)).arrayBuffer(); await dbPutChunk(id,i,ab);
        toast(`Saving ${f.name}${tag}…`,{progress:(i+1)/n,sticky:true}); }
      doc=await openPdf(new IDBSource(id,f.size));                    // cover from the stored copy (same path as Drive import/migration)
      const meta=await coverMeta(doc); const pages=doc.numPages; await doc.destroy(); doc=null;
      const t0=titleFromName(f.name); const rec=withSeriesOverride({id,title:t0,series:seriesGuess(t0),fileName:f.name,size:f.size,pages,...meta,added:Date.now()+k,lastRead:0,page:0,progress:0,rtl:false});
      await dbPut(rec); comics.push(rec); ok++; renderShelf();
    }catch(err){ console.warn('import failed',err); try{ if(doc) await doc.destroy(); }catch(e){} try{ await dbDelete(id); }catch(e){}
      const quota=err&&(err.name==='QuotaExceededError'||/quota/i.test(err.message||''));
      toast(quota?`Out of storage space importing “${f.name}”.`:`Couldn't import “${f.name}”: ${err&&err.message||'not a valid PDF'}`); await new Promise(r=>setTimeout(r,1800)); }
  }
  importing=false; if(ok) toast(`Imported ${ok} comic${ok>1?'s':''} ✓`); renderShelf(); if(ok) kickBlack();
}

/* ---- bitmap LRU (pixel budget; evicted canvases are zeroed to release memory on iPad) ---- */
const cache=new Map(); let cachePx=0;
function cacheGet(k){ const e=cache.get(k); if(e){ cache.delete(k); cache.set(k,e); } return e; }

/* ---- priority job queue: one pdf.js render at a time, nearest pages first ---- */
const jobs=new Map(); let running=0;

let pumpT=0;
function pump(){ if(running>=1) return; let best=null; for(const j of jobs.values()) if(!j.started&&(!best||j.prio<best.prio)) best=j; if(!best) return;

  Promise.resolve().then(best.run).then(v=>{ if(gen!==R.gen){ if(v&&v.canvas) freeCanvas(v.canvas); throw {stale:true}; } best.resolve(v); },e=>best.reject(e))
    .catch(e=>best.reject(e)).finally(()=>{ jobs.delete(best.key); running--; pump(); }); }
function dropJobs(pred){ for(const [k,j] of jobs) if(!j.started&&pred(j)){ jobs.delete(k); j.reject({stale:true}); } }

function creditsOf(c){ const r=(c.driveId&&CREDITS.d[c.driveId])||(c.fileName&&CREDITS.f[c.fileName]);
  let [w,p]=r?r.split('|').map(s=>s?s.split(',').map(i=>crNorm(CREDITS.n[+i])):[]):[[],[]]; let v=[]; const m=c.metaCredits;

const CR_ROLES=[['writer','Writer'],['artist','Artist'],['cover','Cover']];
const crBtn=n=>`<button type="button" class="crn" data-creator="${esc(n)}">${esc(n)}</button>`;

// every issue in the library by a creator: [{series,items:[{c,d,roles}]}], groups and issues oldest first
function creatorIssues(name){ const key=crKey(name), by=new Map();

  const t=x=>x.d?ymOf(x.d):1e9;

const CRP={on:false,name:''};

function allCreators(){ const by=new Map();

marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_246"},"Amazing Spider-Man 247.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_247","first":["Brooklyn-Queen Expressway"],"n":["Norton mentions the apparent death of the Hobgoblin in Amazing Spider-Man Vol 1 245, however, this was actually petty criminal Lefty Donovan. The real Hobgoblin endures, his true identity is not revealed until Spider-Man: Hobgoblin Lives Vol 1 3."]},"Amazing Spider-Man 248.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_248","first":["Tim Harrison","Slocum Brewer Cancer Clinic"],"n":["Spider-Man tells Timmy his origins, as they were told in Amazing Fantasy Vol 1 15."]},"Amazing Spider-Man 249.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_249","first":["Williams","Kingsley Limited"],"n":["The sudden jolt Peter gets from his spider-sense is a warning about the cosmic being known as the Beyonder, as revealed in Marvel Super Heroes Secret Wars Vol 1 1.","How Norman Osborn got his powers and how he discovered Spider-Man's secret identity. These details were revealed in Amazing Spider-Man Vol 1 39–40.","The death of Gwen Stacy and the apparent demise of Norman Osborn in Amazing Spider-Man Vol 1 121–122. The public at large believes that Norman Osborn is dead. However, he survived as revealed in Osborn Journals Vol 1 1 and will resurface in Amazing Spider-Man Vol 1 412.","The man who appears to be Roderick Kinglsey here is actually his twin brother Daniel. This fact, and the true identity of the Hobgoblin are revealed in Spider-Man: Hobgoblin Lives Vol 1 1–3."]},"Amazing Spider-Man 250.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_250","n":["The sudden jolt Peter gets from his spider-sense is a warning about the cosmic being known as the Beyonder, as revealed in Marvel Super Heroes Secret Wars Vol 1 1.","How Norman Osborn got his powers and how he discovered Spider-Man's secret identity. These details were revealed in Amazing Spider-Man Vol 1 39–40.","The death of Gwen Stacy and the apparent demise of Norman Osborn in Amazing Spider-Man Vol 1 121–122. The public at large believes that Norman Osborn is dead. However, he survived as revealed in Osborn Journals Vol 1 1 and will resurface in Amazing Spider-Man Vol 1 412.","The man who appears to be Roderick Kingsley here is actually his twin brother Daniel. This fact, and the true identity of the Hobgoblin are revealed in Spider-Man: Hobgoblin Lives Vol 1 1–3."]},"Amazing Spider-Man 251.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_251","n":["The sudden jolt Peter gets from his spider-sense is a warning about the cosmic being known as the Beyonder, as revealed in Marvel Super Heroes Secret Wars Vol 1 1."]},"Amazing Spider-Man 252.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_252","first":["Weezie"],"n":["Marvel Team-Up Vol 1 141 - Spider-Man and Curt Connors return from Battleworld.","Avengers Vol 1 243 - The Avengers return from Battleworld.","Avengers Vol 1 243 - The Avengers return from Battleworld.","Avengers Vol 1 243 - The Avengers return from Battleworld."]},"Amazing Spider-Man 253.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_253","first":["Ray Nesters","Tony Nesters","Babyface Bob Clayton","Coach James Albertson"],"n":["The wall-crawler also recalls his brief career in showbiz when he first started being Spider-Man, and how it stopped after the death of his Uncle Ben. That happened in Amazing Fantasy Vol 1 15.","Betty Leeds mentions how Joe Robertson has taken over as editor-in-chief of the Daily Bugle. This happened after Jameson revealed in involvement in the creation of the Scorpion. As seen in Amazing Spider-Man Vol 1 251."]},"Amazing Spider-Man 254.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_254","first":["Tony Falcone","Bernie","Gino's Restaurant"]},"Amazing Spider-Man 255.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_255","first":["Ivan Kragoff's Apartment"],"n":["The reason Peter is so exhausted is because his costume is really alive and has been taking him out web-slinging while he's asleep, as revealed in next issue and in Amazing Spider-Man Vol 1 258.","Aunt May is upset with Peter because he quit grad school, as revealed in Amazing Spider-Man Vol 1 243. He told her in Amazing Spider-Man Vol 1 253, and stood her up for dinner last issue, making matters worse.","The man who has the Battlewagon is revealed to be the Hobgoblin as revealed in Amazing Spider-Man Vol 1 257."]},"Amazing Spider-Man 256.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_256","first":["Frankie Silvera","Ralph Mac","Fireheart Enterprises","Heartsdale","Fireheart Enterprises Headquarters"],"n":["The depiction of the original twin towers at the site of the World Trade Center seen in the New York skyline should be considered a topical reference per the Sliding Timescale of Earth-616."]},"Amazing Spider-Man 257.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_257","first":["Bill","Saint Lauren Summit"],"n":["Puma's enhanced senses reveal to him what Spider-Man learns about the black costume in the next issue. He startles the hero by stating that the webbing the costume creates is organic, although he assumes that Spider-Man already knew."]},"Amazing Spider-Man 258.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_258","first":["William Slattery","Sonic Blaster"],"n":["Mary Jane revealed that she has known for years that Peter Parker was secretly Spider-Man at the climax of last issue. The details of this discovery are depicted in Marvel Graphic Novel Vol 1 46: The Amazing Spider-Man: Parallel Lives and Untold Tales of Spider-Man Vol 1 16.","Peter at first assumes that Mary Jane learned his identity because of his battle with the Puma last issue; whether he notices her statement then that she knew before then is unclear, but he understands her meaning by the end of the issue.","Peter fears that Puma will return to his apartment to attack him again, but does not know that the Rose canceled the contract on Spider-Man's life last issue.","Although the Hobgoblin \"proves\" he didn't die in Amazing Spider-Man Vol 1 251, it is later revealed in Web of Spider-Man Vol 1 30 and Spider-Man: Hobgoblin Lives Vol 1 3, the Hobgoblin featured in this issue is Ned Leeds, brainwashed by Roderick Kingsley into believing he was the original Hobgoblin."]},"Amazing Spider-Man 259.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_259","first":["Philip Watson","Madeline Watson","Gayle Watson","Frank Brown","Timmy Byrnes","Mr. Hudson","Mr. Santellio","Santellio's"],"n":["Untold Tales of Spider-Man Vol 1 16 - Mary Jane worries about her sister Gayle's marriage.","Marvel Graphic Novel Vol 1 46: The Amazing Spider-Man: Parallel Lives - Notices that Gayle's husband Tommy feels trapped in his marriage.","Marvel Graphic Novel Vol 1 46: The Amazing Spider-Man: Parallel Lives - Madeline meets her future husband, has their first child, Gayle.","Marvel Graphic Novel Vol 1 46: The Amazing Spider-Man: Parallel Lives - Madeline watches as Gayle grows into a woman of her own. Is against Gayle getting married after high school."]},"Amazing Spider-Man 260.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_260","n":["Lastly, he is worried about Mary Jane Watson knowing his secret identity. She revealed to him that he knew in Amazing Spider-Man Vol 1 257. The details of this discovery are detailed in Marvel Graphic Novel Vol 1 46: The Amazing Spider-Man: Parallel Lives and Untold Tales of Spider-Man Vol 1 16.","That his formula was created by Norman Osborn, the original Green Goblin. The Green Goblin's origins were detailed in Amazing Spider-Man Vol 1 39–40.","Betty wonders where Ned is when she calls. What she doesn't know is that he is secretly operating as the Hobgoblin, as revealed in Amazing Spider-Man Vol 1 289.","Ann MacIntosh mentions how J. Jonah Jameson recently got married to Marla Madison. That happened in Amazing Spider-Man Annual Vol 1 18."]},"Amazing Spider-Man 261.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_261","n":["Mary Jane wonders how the Hobgoblin knows her name. As revealed in Spider-Man: Hobgoblin Lives Vol 1 3, this Hobgoblin was actually Roderick Kingsley. Kingsley, a fashion designer, would know Mary Jane as she is a model.","Harry discovered that his father was the Green Goblin in Amazing Spider-Man Vol 1 122. A later relapse led to Harry discovering Peter's secret identity and becoming the Green Goblin himself, lasting until Amazing Spider-Man Vol 1 137."]},"Amazing Spider-Man 262.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_262","first":["Roberto DeNatale","Bluto","Cheo","Jake \"D.J.\" (Dirty Jake) Jones","\"Scurvy Jack's\" Tavern","St. Rudolph Hotel"],"n":["Jake Jones' claims to have taken a compromising photo of former First Lady Jackie Onassis. Particularly since Onassis passed away in 1994."]},"Amazing Spider-Man 263.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_263","first":["Matt","Eddie"],"n":["Peter relates Harry's inability to protect Liz from the Hobgoblin to his inability to protect Gwen Stacy. Gwen was killed during a battle between Spider-Man and the Green Goblin back in Amazing Spider-Man Vol 1 121."]},"Amazing Spider-Man 264.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_264","first":["Philmont \"Pops\" Magee","Dr. Rattamun","Benjamin Handley","Cheryl Swanson","Mindy","Wendall","Mr. Blodgett","State Street Hospital"]},"Amazing Spider-Man 265.pdf":{"u":"https://marvel.fandom.com/wiki/Amazing_Spider-Man_Vol_1_265","first":["Wild Pack","Ron","Lori","Madeline","Silver Sable's Chai"],"n":["Silver Sable states that her father formed the Wild Pack to hunt Nazis. This is a factual reference, as the series Avengers 1959 Vol 1 reveals, Ernest Sablinova was active duri ,["Amine Gemayel, brother of Bachir, is elected president of Lebanon.","September 23"],["The Wimpy Operation, the first act of armed resistance against Israeli troops in Beirut, begins.","September 24"]],"wu":"https://en.wikipedia.org/wiki/1982#September"},"1982-10":{"us":[["In Orlando, Florida, Walt Disney World opens the second largest theme park, EPCOT Center, to the public for the first time.","October 1"],["The Garn–St. Germain Depository Institutions Act deregulates the U.S. savings and loan industry.","October 15"],["Car designer John DeLorean is arrested for selling cocaine to undercover FBI agents (he is later found not guilty on the grounds of entrapment).","October 19"]],"usu":"https://en.wikipedia.org/wiki/1982_in_the_United_States#October","w":[["The Mary Rose, flagship of Henry VIII of England that sank in 1545, is raised from the Solent.","October 11"],["The Saudi Arabian cargo ship Elhawi Star, transporting 3,631 tonnes of ceramic tiles and 781 tonnes of lumber to Chioggia, sank while being towed away from the Port of Rijeka by the tugboats Beli Kamik and Aries because of the unevenly distributed cargo.","October 12"],["Luzhniki disaster: During the UEFA Cup match between FC Spartak Moscow and HFC Haarlem, 66 people are crushed to death.","October 20"]],"wu":"https://en.wikipedia.org/wiki/1982#October"},"1982-11":{"us":[["November – The severe early 1980s recession ends sometime this month.",""],["November – The unemployment rate peaks at 10.8%.",""],["United States elections, 1982. The Republican Party loses 27 seats to the majority Democratic Party in the House.","November 2"]],"usu":"https://en.wikipedia.org/wiki/1982_in_the_United_States#November","w":[["Paul Biya becomes the second president of Cameroon following the resignation of Ahmadou Ahidjo.","November 6"],["Kenan Evren becomes the seventh president of Turkey as a result of the constitution referendum. His former title was \"head of state\".","November 8"],["In Lebanon, the first Tyre head /* ================= v54: About this issue — sourced notes (built-in NOTES + live Look up), each fact with its source link ================= */
const NT_MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ntHost=u=>{ try{ return new URL(u).hostname.replace(/^www\./,'').replace('en.wikipedia.org','Wikipedia').replace('marvel.fandom.com','Marvel Database').replace('dc.fandom.com','DC Database').replace('imagecomics.fandom.com','Image Comics Database'); }catch(e){ return 'source'; } };
const ntSrc=u=>`<a class="ntsrc" href="${esc(u)}" target="_blank" rel="noopener">${esc(ntHost(u))}</a>`;
function notesOf(c){ return c.notesLive||(c.fileName&&NOTES.i[c.fileName])||null; }
function monthOf(c){ const d=dateOf(c); if(!d||!d.m||d.src==='est') return null; const k=d.y+'-'+d.m; return {d,k,e:(c.monthLive&&c.monthLive.k===k?c.monthLive.e:null)||NOTES.m[k]||null}; }
function aboutBody(c){ const n=notesOf(c), mo=monthOf(c); let h='', m='';
  const li=(t,u)=>`<li>${esc(t)} ${ntSrc(u)}</li>`;
  if(n){ const L=[]; if(n.first) L.push(li('First appearance'+(n.first.length>1?'s':'')+': '+n.first.join(', ')+'.',n.u)); if(n.death) L.push(li('Death of '+n.death.join(', ')+'.',n.u)); (n.n||[]).forEach(t=>L.push(li(t,n.u)));
    if(L.length) h+=`<section class="ntg"><h3>Noteworthy</h3><ul>${L.join('')}</ul></section>`;
    if(n.s&&n.s.length) h+=`<section class="ntg"><h3>From the creators</h3><ul>${n.s.map(t=>li(t,n.u)).join('')}</ul></section>`; }
  if(mo&&mo.e){ const L=[]; (mo.e.us||[]).forEach(([t,d])=>L.push(li((d?d+': ':'')+t,mo.e.usu))); const W=(mo.e.w||[]).map(([t,d])=>li((d?d+': ':'')+t,mo.e.wu));
    if(L.length||W.length) m=`<section class="ntg"><h3>${NT_MON[mo.d.m-1]} ${mo.d.y}</h3>${L.length?`<h4>In the U.S.</h4><ul>${L.join('')}</ul>`:''}${W.length?`<h4>In the world</h4><ul>${W.join('')}</ul>`:''}</section>`; }
  return {h,m}; }
const AB={on:false,id:null,busy:false};
function openAbout(id){ const c=comics.find(x=>x.id===id); if(!c) return; const mw=document.querySelector('.mwrap'); if(mw){ const x=mw.querySelector('[data-r=cancel],[data-r=done]'); if(x) x.click(); else mw.remove(); }
  AB.id=id; $('#abName').textContent=c.title; const d=dateOf(c); $('#abSub').textContent=[c.series,d?fmtDate(d):''].filter(Boolean).join(' · '); renderAbout(); $('#abBody').scrollTop=0; $('#about').classList.remove('hidden'); AB.on=true; }
function renderAbout(){ const c=comics.find(x=>x.id===AB.id); if(!c) return; const {h,m}=aboutBody(c), n=notesOf(c);
  $('#abBody').innerHTML=`<div class="rinfo"><img src="${cover(c)}" alt=""><div>${creditsHTML(c)||'<p class="fhint">No creator credits for this issue.</p>'}</div></div>`+(h||`<p class="fhint ntnone">${n?'Nothing noteworthy on record for this issue.':'No notes for this issue yet.'} Only facts with a source are shown.</p>`)+m+
   `<div class="ntfoot"><button class="pillbtn" id="abLook">${AB.busy?'Looking up…':n?'Refresh':'Look up'}</button>${n&&n.u?`<span class="fhint">Issue facts from ${ntSrc(n.u)}</span>`:''}</div>`;
  $('#abLook').disabled=AB.busy; }

const ntClean=s=>{ s=String(s).replace(/<ref[^>]*\/>|<ref[\s\S]*?<\/ref>|<!--[\s\S]*?-->|<[^>]+>/g,''); for(let i=0;i<3;i++) s=s.replace(/\{\{([^{}]*)\}\}/g,(m,b)=>{ const p=b.split('|'), k=p[0].trim().toLowerCase(); return ['1st','death','mentioned','flashback','dies'].includes(k)&&p[1]?p[1]:['w','wp','wikipedia','cl','sic','c','m','a','apn','ml','g','mel'].includes(k)&&p.length>1?p[p.length-1]:''; });
  return s.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,'$1').replace(/\[https?:\/\/\S+ ([^\]]*)\]/g,'$1').replace(/'{2,}/g,'').replace(/\s*\((?:Earth|Earth-\d+)[^)]*\)/g,'').replace(/\s+/g,' ').replace(/&(#?\w+);/g,(m)=>{ const t=document.createElement('textarea'); t.innerHTML=m; return t.value; }).replace(/^[\s*:]+|[\s*:]+$/g,''); };
const NT_SKIP=/letters? (page|column)|letter column|bullpen|marvel age|checklist|advertis|reprint|pin-?up|recap|dedicated|soapbox|continued (from|in)|continues|takes place|chronolog|placement|this story|is set|occurs (before|after)|variant|newsstand|price|hype box|mail|published in|editorial|statement of ownership/i;
const NT_KEY=/\bfirst\b|debut|origin|death|dies|killed|final|last appearance|return|reveal|wedding|marri|join|introduc|becomes|identity|1st/i, NT_SAID=/\b(said|stated|recalled|explained|interview|according to|commented|admitted|wanted to)\b/i;
function ntParse(wt,url){ const uniq=a=>[...new Set(a.filter(Boolean))]; const first=uniq([...wt.matchAll(/\{\{1st(?: Dies| Full| Identified)?\|\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g)].map(m=>ntClean(m[2]||m[1]))).slice(0,8);
  const names=[...wt.matchAll(/\|\s*(?:Writer|Penciler|Penciller|Artist|Inker)\d*(?:_\d+)?\s*=([^\n]+)/g)].map(m=>ntClean(m[1])).filter(Boolean);
  const death=uniq([...wt.matchAll(/\{\{Death\|\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g)].map(m=>ntClean(m[2]||m[1]))).slice(0,4); const n=[], s=[];
  for(const k of ['Notes','Trivia']){ const m=wt.match(new RegExp('\\|\\s*'+k+'\\s*=([\\s\\S]*?)(?=\\n\\|\\s*\\w+\\s*=|\\n\\}\\}\\s*$)')); if(!m) continue;
    for(const b of m[1].split(/\n\s*\*+/)){ const t=ntClean(b); if(t.length<20||t.length>320||NT_SKIP.test(t)||!/[.!?"”)]$/.test(t)) continue; if(NT_SAID.test(t)){ if(names.some(x=>t.includes(x.split(' ').pop()))) s.push(t); } else if(NT_KEY.test(t)) n.push(t); } }
  const o={u:url}; if(first.length) o.first=first; if(death.length) o.death=death; if(n.length) o.n=n.slice(0,4); if(s.length) o.s=s.slice(0,2); return o; }
async function ntWiki(host,titles){ const r=await fetch(`https://${host}/api.php?`+new URLSearchParams({action:'query',prop:'revisions',rvprop:'content',rvslots:'main',format:'json',redirects:1,origin:'*',titles:titles.join('|')})); const j=await r.json();
  return Object.values((j.query||{}).pages||{}).filter(p=>p.revisions).map(p=>({title:p.title,wt:p.revisions[0].slots.main['*']})); }
async function lookupNotes(c){ const d=dateOf(c), no=issueNo(c.title); const ser=(c.series||c.title.replace(/[\s#-]*\d+.*$/,'')).replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
  let found=null;
  if(ser&&no<1e6&&isFinite(no)){ const T=[1,2,3,4,5].map(v=>`${ser} Vol ${v} ${no}`);
    for(const host of ['marvel.fandom.com','dc.fandom.com','imagecomics.fandom.com']){ let P=[]; try{ P=await ntWiki(host,T); }catch(e){ continue; }
      const ok=P.filter(p=>{ const y=+(p.wt.match(/\|\s*Year\s*=\s*(\d{4})/)||[])[1]; return d?y===d.y:P.length===1; });
      if(ok.length){ found=ntParse(ok[0].wt,`https://${host}/wiki/`+encodeURIComponent(ok[0].title.replace(/ /g,'_'))); break; } } }
  if(found) c.notesLive=found;
  if(d&&d.m&&d.src!=='est'&&!NOTES.m[d.y+'-'+d.m]){ try{ const name=NT_MON[d.m-1], e={};
    for(const [k,pg] of [['us',`${d.y} in the United States`],['w',String(d.y)]]){ const j=await (await fetch('https://en.wikipedia.org/w/api.php?'+new URLSearchParams({action:'parse',page:pg,prop:'wikitext',format:'json',redirects:1,origin:'*'}))).json(); const wt=j.parse?j.parse.wikitext['*']:'';
      const m=wt.match(new RegExp('\\n==+\\s*'+name+'\\s*==+([\\s\\S]*?)(?=\\n==+\\s*[A-Z])')); if(!m) continue; const L=[];
      for(const line of m[1].split('\n')){ if(!/^\*[^*]/.test(line)) continue; const dm=line.match(new RegExp('^\\*\\s*\\[\\[('+name+' \\d+)')); const t=ntClean(line).replace(new RegExp('^'+name+' \\d+(?:–\\d+)?\\s*[–-]\\s*'),''); if(t.length>=25&&t.length<=260&&!/\bborn\b|\bdies\b|died/.test(t)) L.push([t,dm?dm[1]:'']); if(L.length>=3) break; }
      if(L.length){ e[k]=L; e[k==='us'?'usu':'wu']=`https://en.wikipedia.org/wiki/${encodeURIComponent(pg.replace(/ /g,'_'))}#${name}`; } }
    if(Object.keys(e).length) c.monthLive={k:d.y+'-'+d.m,e}; }catch(e){} }
  await dbPut(c); return !!found; }

/* ================= v45: "Also on sale this month" — bottom of the end-of-issue / up-next page: other comics in your library with the same cover month (Timeline dates) =================
   Exact month: dates set by you, looked up, built-in list, metadata or file name. An ≈ estimate is labelled "around <Mon Year>";
   a year-only date matches the whole year ("around 1987"). No usable date or no other issue: no section. "+N more" opens the full grid page (#creator). */
function saleKey(c){ const d=dateOf(c); if(!d||!d.y) return null; const est=d.src==='lookup';
  if(!d.m) return {mode:'year',y:d.y,label:`around ${d.y}`,est:true};
  return {mode:'month',y:d.y,m:d.m,ym:ymOf(d),label:`${est?'around ':''}${MONTHS[d.m-1].slice(0,3)} ${d.y}`,est}; }
function onSale(c){ const k=saleKey(c); if(!k) return null; const others=comics.filter(x=>x.id!==c.id).map(x=>({c:x,d:dateOf(x)})).filter(x=>x.d&&x.d.y);
  const hit=k.mode==='year'? x=>x.d.y===k.y : x=>x.d.y===k.y&&x.d.m===k.m;
  let L=others.filter(hit), near=null;
  if(!L.length&&others.length){
    if(k.mode==='year'){ const ys=[...new Set(others.map(x=>x.d.y))].sort((a,b)=>Math.abs(a-k.y)-Math.abs(b-k.y)||a-b); near={y:ys[0],label:String(ys[0])}; L=others.filter(x=>x.d.y===near.y); }
    else { const md=others.filter(x=>x.d.m); if(md.length){ const ym=md.map(x=>ymOf(x.d)).sort((a,b)=>Math.abs(a-k.ym)-Math.abs(b-k.ym)||a-b)[0]; near={ym,label:ymLabel(ym)}; L=md.filter(x=>ymOf(x.d)===ym); } } }
  L.sort((a,b)=>(a.c.series||'').localeCompare(b.c.series||'')||byIssue(a.c,b.c)); return {k,L,near,exact:near?0:L.length}; }

  $('#crBody').scrollTop=0; $('#creator').classList.remove('hidden'); CRP.on=true; CRP.name=''; CRP.sale=id; CRP.t0=performance.now(); }
/* ---------- Animate page (Grok Imagine): plan panels with Grok vision, make one clip per panel, play them in order ---------- */
const Anim=(()=>{
  const API='https://cr-animate.djapps.workers.dev', PRICE={sec:0.03,img:0.01};
  const pass=()=>store.get('animPass','');
  const call=async(path,body)=>{ const r=await fetch(API+path,{method:body?'POST':'GET',headers:{'content-type':'application/json','x-pass':pass()},body:body?JSON.stringify(body):undefined}); let j={}; try{ j=await r.json(); }catch(e){} if(!r.ok){ const e=new Error(j.error||('Server error '+r.status)); e.j=j; e.status=r.status; throw e; } return j; };
  // clip + plan cache: its own IndexedDB so it never touches the comics database version
  let dbp; const adb=()=>dbp||(dbp=new Promise((res,rej)=>{ const r=indexedDB.open('cr-anim',1); r.onupgradeneeded=()=>{ r.result.createObjectStore('clips'); r.result.createObjectStore('plans'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const idb=async(st,mode,fn)=>{ const d=await adb(); return new Promise((res,rej)=>{ const t=d.transaction(st,mode); const q=fn(t.objectStore(st)); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); }); };
  const get=(st,k)=>idb(st,'readonly',s=>s.get(k)), put=(st,k,v)=>idb(st,'readwrite',s=>s.put(v,k));
  const money=v=>'$'+(Math.round(v*100)/100).toFixed(2);
  const costOf=pl=>pl.panels.reduce((a,q)=>a+q.seconds*PRICE.sec+PRICE.img,0);

  async function passSheet(msg){ let st={configured:true}; try{ st=await call('/status'); }catch(e){ toast('Can’t reach the Animate server. Are you online?'); return false; }
    const set=!st.configured;
    const {r,vals}=await modal(`<div class="mh"><h3>Animate passcode</h3></div><div class="mb">
      <p class="confirm-msg">${msg?esc(msg)+' ':''}${set?'Choose a passcode for Animate page. Only devices with this passcode can spend your xAI credits.':'Enter your Animate passcode for this device.'}</p>
      ${!set&&pass()?'<label class="fld"><span>Current passcode (to change it)</span><input id="aOld" type="password" autocomplete="off"></label>':''}
      <label class="fld"><span>${set?'New passcode (6+ characters)':'Passcode'}</span><input id="aPass" type="password" autocomplete="off" autocapitalize="off" enterkeyhint="done"></label>
      <p class="fhint">Daily limit: ${money(st.cap||10)}. Used today: ${money(st.spent||0)}.</p></div>
      <div class="mf"><button class="btn ghost" data-r="cancel">Cancel</button><button class="btn" data-r="ok">${set?'Set Passcode':'Save'}</button></div>`,
      w=>{ setTimeout(()=>w.querySelector('#aPass').focus(),50); w._vals=()=>({p:w.querySelector('#aPass').value.trim(),old:w.querySelector('#aOld')?.value.trim()||''}); });

    catch(e){ if(e.status===401) store.set('animPass',''); toast(e.message); return false; } }

  async function pageImage(i){ const pg=await R.doc.getPage(i+1); const c=await renderToCanvas(pg,1500,2200,1,3.4e6); pg.cleanup(); return c; }
  function crop(cv,box){ let [x,y,w,h]=box; const pad=0; x=Math.max(0,x-pad); y=Math.max(0,y-pad); w=Math.min(1-x,w+pad*2); h=Math.min(1-y,h+pad*2);
    const sx=x*cv.width, sy=y*cv.height, sw=Math.max(8,w*cv.width), sh=Math.max(8,h*cv.height), k=Math.min(2.5,Math.max(1,720/Math.min(sw,sh)));
    const c=document.createElement('canvas'); c.width=Math.round(sw*k); c.height=Math.round(sh*k); const g=c.getContext('2d',{alpha:false}); g.imageSmoothingQuality='high'; g.drawImage(cv,sx,sy,sw,sh,0,0,c.width,c.height); return c; }

  async function start(){ const c=R.comic; if(!c||!R.doc) return; let ps=pagesOf(R.views[R.vi]).filter(p=>p<R.n); if(!ps.length){ toast('Pick a comic page to animate'); return; }
    const page=ps[0], key=c.id+':'+page; const cached=await get('plans',key).catch(()=>null);

      if(r==='play') return player(c,page,cached); if(r!=='redo') return; }

    catch(e){ hideToast(); toast(e.message); if(e.status===401) passSheet(e.message); return; }
    const pl=res.plan; if(!pl.panels.length){ toast('Grok didn’t find any panels on this page'); return; }
    pl.panels.forEach(q=>{ q.thumb=crop(cv,q.box).toDataURL('image/jpeg',.88); });
    const total=costOf(pl), left=(res.cap||10)-(res.spent||0);
    const {r}=await modal(`<div class="mh"><h3>Animate page ${ordOf(page)+1}</h3><p class="dlsub">${esc(pl.mood)}</p></div><div class="mb anplan">
      <p class="anscore">${IC_NOTE}${esc(pl.score)}</p>
      ${pl.panels.map((q,k)=>`<div class="anrow"><img src="${q.thumb}" alt=""><div><b>${k+1}. ${esc(q.what)}</b><span>${esc(q.camera)} · ${q.seconds}s</span><small>${esc(q.sound)}</small></div></div>`).join('')}
      <p class="fhint">${pl.panels.length} clips · ${pl.panels.reduce((a,q)=>a+q.seconds,0)}s of 720p video · about ${money(total)} of xAI credit. Used today: ${money(res.spent||0)} of ${money(res.cap||10)}.</p></div>
      <div class="mf"><button class="btn ghost" data-r="cancel">Cancel</button><button class="btn" data-r="go" ${total>left?'disabled':''}>${total>left?'Over today’s limit':'Animate · '+money(total)}</button></div>`,null,'anmodal');
    if(r!=='go') return;
    pl.page=page; pl.at=Date.now(); await put('plans',key,pl).catch(()=>{});
    player(c,page,pl,cv); }

  let P2=null;
  function player(c,page,pl,cv){ close(); const el=document.createElement('div'); el.id='anim'; el.innerHTML=`<header class="anbar"><button class="icbtn" id="anClose" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div class="antitle"><b>${esc(c.title)}</b><small>Page ${ordOf(page)+1} · ${pl.panels.length} panels</small></div><button class="rbtn" id="anSave" aria-label="Save clip"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>Save</button></header>
      <div class="anstage"><video id="anVid" playsinline controls preload="auto"></video><div class="anwait" id="anWait"></div></div>
      <div class="annotes" id="anNotes"></div><div class="anstrip" id="anStrip">${pl.panels.map((q,k)=>`<button class="anchip" data-k="${k}"><img src="${q.thumb}" alt=""><i>${k+1}</i><em></em></button>`).join('')}</div>`;
    document.body.appendChild(el); const S={el,c,page,pl,cv,cur:-1,urls:[],state:pl.panels.map(()=>'wait'),err:[],gen:{}}; P2=S;
    const vid=el.querySelector('#anVid');

    el.querySelector('#anStrip').onclick=e=>{ const b=e.target.closest('.anchip'); if(b) show(+b.dataset.k,true); };

    S.show=show; function show(k,play){ S.cur=k; const q=pl.panels[k];
      el.querySelectorAll('.anchip').forEach((b,i)=>b.classList.toggle('on',i===k));
      el.querySelector('#anNotes').innerHTML=`<b>${k+1}. ${esc(q.what)}</b><div class="annote"><span>Camera</span>${esc(q.camera)}</div><div class="annote"><span>Music &amp; sound</span>${esc(q.sound)}</div><div class="annote"><span>Pacing</span>${esc(q.pacing)}</div>`;
      const w=el.querySelector('#anWait'), st=S.state[k];
      if(st==='ready'){ w.classList.add('hidden'); vid.classList.remove('hidden'); if(vid.dataset.k!==String(k)){ vid.src=S.urls[k]; vid.dataset.k=k; } if(play) vid.play().catch(()=>{}); }
      else { vid.pause(); vid.classList.add('hidden'); w.classList.remove('hidden'); w.style.backgroundImage=`url(${q.thumb})`; w.innerHTML=`<span>${st==='fail'?esc(S.err[k]||'This panel couldn’t be animated'):st==='make'?'<i class="spin"></i>Animating panel…':'<i class="spin"></i>Waiting its turn…'}</span>`; } }
    function mark(k,st,err){ S.state[k]=st; if(err) S.err[k]=err; const b=el.querySelectorAll('.anchip')[k]; if(b){ b.dataset.st=st; } if(S.cur===k) show(k,st==='ready'&&(vid.paused||vid.ended)); else if(st==='ready'&&S.cur>=0&&S.state[S.cur]!=='ready'&&k===S.cur+1) {} }

  async function run(S){ const {c,page,pl}=S, base=c.id+':'+page; let next=0, live=true; S.stop=()=>{ live=false; };

    const todo=pl.panels.map((q,k)=>k).filter(k=>S.state[k]!=='ready'); if(!todo.length){ pl.done=true; return; }

    const one=async k=>{ const q=pl.panels[k]; S.mark(k,'make');
      try{ const img=crop(S.cv,q.box).toDataURL('image/jpeg',.9);

        for(let i=0;i<120&&live;i++){ await new Promise(r=>setTimeout(r,5000)); const s=await call('/clip/'+id).catch(()=>({status:'pending'}));
          if(s.status==='done'&&s.url){ const r=await fetch(API+'/video?u='+encodeURIComponent(s.url),{headers:{'x-pass':pass()}}); if(!r.ok) throw new Error('Couldn’t download the clip');
            const blob=await r.blob(); await put('clips',base+':'+k,{blob,at:Date.now()}).catch(()=>{}); S.urls[k]=URL.createObjectURL(blob); S.mark(k,'ready'); if(S.cur===k||S.state.slice(0,k).every(x=>x==='fail')) S.show(k,true); return; }
          if(s.status==='failed'||s.status==='expired') throw new Error(s.moderated?'Grok Imagine declined this panel (content rules)':(s.error||'Grok Imagine couldn’t make this clip'));
          if(s.moderated) throw new Error('Grok Imagine declined this panel (content rules)'); }
        if(live) throw new Error('Timed out waiting for this clip'); }
      catch(e){ if(!live) return; const msg=e.j&&e.j.refused?'Grok Imagine declined this panel: '+e.message:e.message; S.mark(k,'fail',msg); if(e.j&&e.j.cap){ live=false; toast(e.message); } } };

  async function save(S){ const k=S.cur; if(S.state[k]!=='ready'){ toast('This clip isn’t ready yet'); return; }
    const blob=await (await fetch(S.urls[k])).blob(), name=`${(S.c.title||'comic').replace(/[^\w\- ]+/g,'').trim()} p${ordOf(S.page)+1} panel ${k+1}.mp4`;

  function close(){ if(!P2) return; P2.stop&&P2.stop(); P2.urls.forEach(u=>u&&URL.revokeObjectURL(u)); P2.el.remove(); P2=null; }
  const IC_NOTE='<svg class="i" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>';
  return {start,passSheet,close,isOpen:()=>!!P2};
