<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Comics">
<meta name="format-detection" content="telephone=no">
<title>Comic Shelf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="modulepreload" href="vendor/pdf.min.mjs">
<style>
:root{
  --bg:#000; --bar:#000; --el:#1c1c1e; --el2:#2c2c2e; --el3:#3a3a3c; --sep:#262628;
  --txt:#f5f5f7; --mut:#8e8e93; --red:#e5383b; --blue:#0a84ff; --read:#000;
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue','Segoe UI',Roboto,Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --padx:max(16px,var(--sal)); --padr:max(16px,var(--sar));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--ui);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{position:fixed;inset:0;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit}
img{-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
.topbar{flex:none;background:var(--bar);padding:var(--sat) var(--padr) 0 var(--padx);border-bottom:.5px solid var(--sep);position:relative;z-index:5}
.tb-row{height:50px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.segctl{justify-self:center;display:inline-flex;background:var(--el);border-radius:9px;padding:2px;gap:2px}
.segctl button{min-width:96px;height:40px;border-radius:7px;font-size:14px;font-weight:600;color:var(--mut);transition:background .15s,color .15s}
.segctl button.on{background:var(--el3);color:#fff}
.icbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:20px;color:#fff}
.icbtn:active{background:#ffffff1a}
#importBtn{justify-self:end}
#importBtn svg{width:26px;height:26px;stroke-width:2}
.tabview{flex:1;min-height:0;position:relative}
.scrollv{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scrollv::-webkit-scrollbar,.row-s::-webkit-scrollbar{display:none}

/* ---------- Home: coverflow hero ---------- */
.hero{padding:10px 0 0;position:relative;overflow:hidden;background:radial-gradient(120% 70% at 50% 34%,#16161a 0%,#000 70%)}
.cf{position:relative;height:calc(var(--cw)*1.5 + 4px + var(--cw)*.16);perspective:1100px;perspective-origin:50% 45%;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.cf-item{position:absolute;left:50%;top:6px;width:var(--cw);height:calc(var(--cw)*1.5);margin-left:calc(var(--cw)/-2);transform-style:preserve-3d;will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cf-item img{width:100%;height:100%;object-fit:cover;display:block;background:var(--el);box-shadow:0 18px 50px rgba(0,0,0,.7);-webkit-box-reflect:below 1px linear-gradient(transparent 78%,rgba(255,255,255,.14))}
.cf-item .dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.cf-item.lite img{-webkit-box-reflect:none;box-shadow:none}.cf.moving .cf-item img{box-shadow:none}
.pillbtn{height:36px;padding:0 26px;border-radius:18px;background:#fff;color:#000;font-size:15px;font-weight:700}
.pillbtn:active{opacity:.8}
.pillbtn.ghost{background:var(--el2);color:#fff}

/* ---------- Home: rows ---------- */
.rows{padding:0 0 calc(24px + var(--sab))}
.row{margin:18px 0 6px}.rows>.row:first-child{margin-top:12px}
.row-top{display:flex;align-items:center}.row-top .row-h{flex:1;min-width:0;padding-right:2px}
.row-more{flex:none;width:40px;height:34px;margin-right:calc(var(--padr) - 10px);display:grid;place-items:center;color:var(--mut);border-radius:17px}
.row-more svg{width:22px;height:22px}.row-more:active{background:var(--el)}
.mgname{padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.row-h{display:flex;align-items:center;gap:4px;width:100%;padding:0 var(--padr) 0 var(--padx);height:34px;text-align:left}
.row-h h2{margin:0;font-size:19px;font-weight:700;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-h .n{font-size:14px;color:var(--mut);font-weight:500}
.row-h svg{width:20px;height:20px;color:var(--mut);stroke-width:2.4}
.row-s{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:8px var(--padr) 6px var(--padx);scroll-padding:0 var(--padx);overscroll-behavior-x:contain}
.rc{flex:none;width:var(--rw);text-align:left;display:block}
.cvr{position:relative;width:100%;aspect-ratio:2/3;background:var(--el);overflow:hidden}
.cvr img{width:100%;height:100%;object-fit:cover;display:block}
.cvr .done{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:11px;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center}
.cvr .done svg{width:13px;height:13px;stroke:#fff;stroke-width:3.2}
.cvr .rtlb{position:absolute;left:6px;top:6px;font-size:10px;font-weight:800;letter-spacing:.04em;background:rgba(0,0,0,.78);color:#fff;padding:2px 5px;border-radius:4px}
.pl{height:3px;background:var(--el3);margin-top:5px;overflow:hidden}
.pl i{display:block;height:100%;background:#fff}
.rc .t{font-size:14px;font-weight:700;color:#fff;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .s{font-size:12px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seeall{flex:none;width:var(--rw);aspect-ratio:2/3;background:var(--el);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:14px;font-weight:600}
.seeall svg{width:26px;height:26px;stroke-width:2;color:var(--mut)}
.seeall:active,.rc:active .cvr{opacity:.75}

/* ---------- Library ---------- */
#library{display:flex;flex-direction:column}
.libbar{flex:none;padding:10px var(--padr) 8px var(--padx);background:var(--bar);display:flex;flex-direction:column;gap:9px}
.lrow{display:flex;gap:8px;align-items:center;min-width:0}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:36px;border-radius:10px;border:0;background:var(--el);color:#fff;padding:0 12px 0 34px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--mut)}
.search svg{position:absolute;left:10px;top:9px;width:18px;height:18px;color:var(--mut)}
.sortbtn{flex:none;height:36px;padding:0 12px;border-radius:10px;background:var(--el);color:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sortbtn svg{width:17px;height:17px}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(-1*var(--padr)) 0 calc(-1*var(--padx));padding:0 var(--padr) 0 var(--padx)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 14px;border-radius:15px;background:var(--el);color:#d1d1d6;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:#fff;color:#000}
.chip.scope{background:var(--el2);color:#fff}
.chip.scope svg{width:14px;height:14px;stroke-width:2.6}
.chip .c{font-weight:500;opacity:.6}
#libScroll{flex:1;min-height:0}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;padding:6px calc(var(--padr) + var(--azw,0px)) calc(24px + var(--sab)) var(--padx)}
@media (min-width:600px){.lgrid{grid-template-columns:repeat(5,1fr);gap:12px 8px}}
@media (min-width:1000px){.lgrid{grid-template-columns:repeat(7,1fr)}}
.lc{display:block;text-align:left;min-width:0;position:relative}
.lc:active .cvr{opacity:.75}
.lhead{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--mut);padding:8px 0 0;letter-spacing:.04em}
.lempty{color:var(--mut);text-align:center;padding:60px 20px;font-size:15px}
#azIndex{position:absolute;right:max(2px,var(--sar));top:120px;bottom:calc(80px + var(--sab));width:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;touch-action:none;user-select:none;-webkit-user-select:none}
#azIndex span{flex:0 1 18px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--blue);width:20px;min-height:10px}
#azIndex span.off{color:#48484a}
#azIndex span.hit{color:#fff}
.azpop{position:absolute;right:46px;width:56px;height:56px;border-radius:12px;background:var(--el2);color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:6;pointer-events:none}

/* ---------- now reading pill ---------- */

/* ---------- empty ---------- */
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 28px 80px;gap:10px}
.empty svg{width:64px;height:64px;color:#48484a;stroke-width:1.5}
.empty h2{margin:6px 0 0;font-size:22px;font-weight:700}
.empty p{margin:0 0 12px;color:var(--mut);font-size:15px;line-height:1.45;max-width:400px}

/* ---------- sheets / modals ---------- */
.mwrap{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,var(--sat)) 16px max(16px,var(--sab));animation:fadein .15s}
@keyframes fadein{from{opacity:0}}
.modal{background:var(--el);border-radius:14px;width:min(440px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal .mh{padding:18px 18px 4px}
.modal .mh h3{margin:0;font-size:18px;font-weight:700}
.modal .mb{padding:12px 18px}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:6px 18px 18px;flex-wrap:wrap}
.btn{height:38px;padding:0 18px;border-radius:10px;background:#fff;color:#000;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--el2);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn:active{opacity:.8}
.sp{flex:1}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px}
.fld input[type=text]{width:100%;height:42px;border-radius:10px;border:0;background:var(--el2);color:#fff;padding:0 12px;font-size:16px;outline:none}
.fld input:focus{box-shadow:0 0 0 2px var(--blue)}
.tgl{display:flex;align-items:center;gap:12px;padding:10px 0;font-weight:600;font-size:15px;cursor:pointer}
.tgl input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--el3);position:relative;flex:none;margin:0;transition:background .15s;order:2;margin-left:auto}
.tgl input::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl input:checked{background:#30d158}
.tgl input:checked::after{transform:translateX(20px)}
.tgl small{display:block;font-weight:400;color:var(--mut);font-size:12.5px;margin-top:2px}
.note{background:var(--el2);border-radius:10px;padding:12px 13px;color:#d1d1d6;font-size:14px;line-height:1.45;margin:12px 0}
.note b{color:#fff}
.stor{display:flex;align-items:baseline;gap:8px;font-size:15px;flex-wrap:wrap;color:var(--mut)}
.stor b{font-size:28px;font-weight:700;color:#fff}
.mstat{color:var(--mut);font-size:13px;margin-top:4px}
.confirm-msg{margin:0;line-height:1.45;color:#d1d1d6;font-size:15px}
/* action sheet */
.sheet{background:transparent;box-shadow:none;width:min(400px,100%)}
.sheet .grp{background:var(--el);border-radius:14px;overflow:hidden}
.sheet .hd{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:.5px solid var(--el3)}
.sheet .hd img{width:40px;height:60px;object-fit:cover;background:var(--el2)}
.sheet .hd b{display:block;font-size:15px}
.sheet .hd span{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.sheet .act{display:flex;align-items:center;gap:12px;width:100%;height:52px;padding:0 16px;font-size:16px;border-bottom:.5px solid var(--el3);text-align:left}
.sheet .act:last-child{border-bottom:0}
.sheet .act svg{width:20px;height:20px;color:var(--mut)}
.sheet .act.red,.sheet .act.red svg{color:#ff453a}
.sheet .act:active{background:var(--el2)}
.sheet .cancel{margin-top:8px;width:100%;height:52px;border-radius:14px;background:var(--el);font-size:16px;font-weight:700}
.menu{position:fixed;z-index:110;background:#2c2c2e;border-radius:12px;min-width:200px;box-shadow:0 14px 40px rgba(0,0,0,.6);overflow:hidden;animation:fadein .12s}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;padding:0 16px;font-size:15px;border-bottom:.5px solid #3a3a3c;text-align:left}
.menu button:last-child{border-bottom:0}
.menu button svg{width:17px;height:17px;stroke-width:2.6}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--sab));transform:translateX(-50%);z-index:200;background:#2c2c2e;color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;font-size:14px;max-width:min(92vw,480px);box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fadein .15s}
.toast .tb{height:3px;border-radius:2px;background:#ffffff22;margin-top:8px;overflow:hidden}
.toast .tb i{display:block;height:100%;background:#fff;transition:width .2s}

/* ---------- Reader ---------- */
#reader{background:var(--read);z-index:10}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--read)}
#zoomer{position:absolute;inset:0;transform-origin:0 0}
#zoomer.anim{transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.view{position:absolute;inset:0}
.pg{position:absolute}
.pg>canvas,.face>canvas{position:absolute;display:block;background:#fff}
.view .pg>canvas{box-shadow:0 4px 24px rgba(0,0,0,.6)}
.pg.loading,.face.loading{background:#111}
.phn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#ffffff1f}
.phn::after{content:"";position:absolute;left:50%;top:calc(50% + 44px);width:22px;height:22px;margin-left:-11px;border:2.5px solid #ffffff22;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flip{position:absolute;inset:0;z-index:6;pointer-events:none}
.face{position:absolute;overflow:hidden}
.face .shade{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:3}
.flipper{position:absolute;will-change:transform;z-index:5}
.flipper>.face{left:0;top:0;width:100%;height:100%}
.flipper>.face.back{transform:rotateY(180deg)}
.rbar{position:absolute;left:0;right:0;z-index:20;background:#000;transition:transform .2s ease,visibility .2s}
.rbar.top{top:0;padding:var(--sat) max(6px,var(--sar)) 0 max(6px,var(--sal));border-bottom:.5px solid var(--sep)}
.rbar.bot{bottom:0;padding:0 max(14px,var(--sar)) var(--sab) max(14px,var(--sal));border-top:.5px solid var(--sep)}
#reader:not(.ui) .rbar.top{transform:translateY(-110%);visibility:hidden}
#reader:not(.ui) .rbar.bot{transform:translateY(110%);visibility:hidden}
.rrow{height:44px;display:flex;align-items:center;gap:4px}
.rrow .back{display:flex;align-items:center;gap:1px;height:36px;padding:0 10px 0 2px;border-radius:9px;font-weight:500;font-size:16px;color:#fff}
.rrow .back:active{background:#ffffff14}
.rtitle{flex:1;min-width:0;text-align:center;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.rbtn{height:40px;min-width:40px;padding:0 9px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:#fff;font-size:12.5px;font-weight:600}
.rbtn:active{background:#ffffff14}
.rbtn.on{background:#fff;color:#000}
.rbtn svg.i{width:19px;height:19px}
.brow{height:34px;display:flex;align-items:center;gap:12px}
.scrub{flex:1;position:relative;height:34px;display:flex;align-items:center}
#scrub{width:100%;margin:0;-webkit-appearance:none;appearance:none;background:transparent;height:30px}
#scrub::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,#fff var(--pct,0%),#3a3a3c var(--pct,0%))}
#scrub[dir=rtl]::-webkit-slider-runnable-track{background:linear-gradient(270deg,#fff var(--pct,0%),#3a3a3c var(--pct,0%))}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:0;margin-top:-6px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
#scrub::-moz-range-track{height:3px;border-radius:2px;background:#3a3a3c}
#scrub::-moz-range-progress{height:3px;background:#fff}
#scrub::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
#pgText{font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
#bubble{position:absolute;bottom:42px;transform:translateX(-50%);background:#1c1c1e;border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.6);pointer-events:none;text-align:center;z-index:2}
#bubble .bt{width:96px;height:144px;display:flex;align-items:center;justify-content:center;background:#2c2c2e;overflow:hidden}
#bubble img{max-width:100%;max-height:100%;display:block}
#bubble span{display:block;font-size:13px;font-weight:600;color:#fff;margin-top:5px}
#pages{position:absolute;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
#pages .ph{flex:none;display:flex;align-items:center;gap:8px;padding:var(--sat) max(10px,var(--sar)) 0 max(10px,var(--sal));height:calc(48px + var(--sat));border-bottom:.5px solid var(--sep)}
#pages .ph h3{margin:0;flex:1;font-size:17px;font-weight:600}
#pgrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 8px;padding:14px max(14px,var(--sar)) calc(20px + var(--sab)) max(14px,var(--sal));align-content:start}
#pgrid button{display:block;text-align:center}
#pgrid .th{aspect-ratio:2/3;background:#1c1c1e;overflow:hidden;display:flex;align-items:center;justify-content:center}
#pgrid .th img{width:100%;height:100%;object-fit:contain}
#pgrid button.cur .th{outline:2px solid #fff;outline-offset:2px}
#pgrid span{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-top:5px}
.rows{--rw:112px}
@media (min-width:600px){.rows{--rw:136px}}
@media (min-width:1000px){.rows{--rw:142px}}
.rc,.lc,.cf-item,.seeall{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pl.none{background:transparent}
/* import menu + Google Drive progress sheet */
.menu.imp{min-width:230px}
.menu.imp button svg{width:20px;height:20px;stroke-width:1.8;color:#ebebf5cc}
.ebtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.modal.drv .confirm-msg b{color:#fff}
.dlwrap{align-items:flex-end}
@media (min-width:600px){.dlwrap{align-items:center}}
.modal.dl{width:min(480px,100%);display:flex;flex-direction:column;max-height:min(80vh,640px);overflow:hidden}
.modal.dl .mh{padding:18px 18px 12px;border-bottom:.5px solid #3a3a3c}
.dlsub{margin:4px 0 10px;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.dlbar{height:4px;border-radius:2px;background:#ffffff1f;overflow:hidden}
.dlbar i{display:block;height:100%;width:0;background:#fff;border-radius:2px;transition:width .15s linear}

  box-shadow:inset 0 9px 0 -7px rgba(255,255,255,.18),inset 0 -9px 0 -7px rgba(0,0,0,.35),0 -1px 0 rgba(0,0,0,.6);transition:transform .2s cubic-bezier(.2,.8,.2,1);-webkit-tap-highlight-color:transparent}
.spine.out{transform:translateY(-14px)}
/* vertical text: title and Vol/years are two vertical lines (columns) running the full spine height */
.spine .sp-t,.spine .sp-m{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-inline-size:100%;line-height:1.25}
.spine .sp-t{font-size:13px;font-weight:700;letter-spacing:.02em}
.spine .sp-m{font-size:10.5px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
@media (max-width:600px){.spine .sp-t{font-size:12px}.spine .sp-m{font-size:10px}}
@media (prefers-reduced-motion:reduce){.spine{transition:none}.spine.out{transform:none}}
.volshelf+.row{margin-top:12px}
/* v31 spine typography: bundled open-licensed fonts (fonts/LICENSE-*.txt), Latin subset */
@font-face{font-family:'Bangers';src:url(fonts/Bangers.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Bungee';src:url(fonts/Bungee.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Luckiest Guy';src:url(fonts/LuckiestGuy.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Black Ops One';src:url(fonts/BlackOpsOne.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Creepster';src:url(fonts/Creepster.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Cinzel Decorative';src:url(fonts/CinzelDecorative.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Orbitron';src:url(fonts/Orbitron.woff2) format('woff2');font-weight:400 900;font-display:swap}
@font-face{font-family:'Permanent Marker';src:url(fonts/PermanentMarker.woff2) format('woff2');font-weight:400;font-display:swap}
.spine .sp-t{font-family:var(--ff),var(--ui);font-weight:var(--fw);font-size:calc(14px * var(--fs));letter-spacing:var(--ls);text-transform:var(--tt);transform:skewY(var(--sk));
  text-shadow:0 0 1px var(--so),1px 0 0 var(--so),0 1px 1px var(--so);line-height:1.15}
.spine .sp-m{text-shadow:0 0 1px var(--so)}
@media (max-width:600px){.spine .sp-t{font-size:calc(13px * var(--fs))}}
/* v34 spines: bigger books, nearly black body, thin accent rule, big glowing title; soft shelf lighting */
.volshelf{--bh:220px;background:linear-gradient(180deg,#1d1712 0%,#120e0b 55%,#0c0a08 100%)}
@media (max-width:600px){.volshelf{--bh:165px}}
.vs-s{gap:5px;padding-top:14px}
.spine{background-color:var(--sb);background-image:linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.06) 18%,rgba(255,255,255,0) 40%,rgba(0,0,0,.12) 78%,rgba(0,0,0,.55)),linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0) 35%);
  padding:22px 0 20px;justify-content:center;border-radius:2px 2px 1px 1px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 8px -2px rgba(0,0,0,.65),2px 0 4px -2px rgba(0,0,0,.6)}
.spine .sp-rule{position:absolute;left:14%;right:14%;top:10px;height:2px;border-radius:1px;background:var(--sa);opacity:.95}
.spine .sp-t{color:var(--si);font-size:calc(var(--tfs) * var(--fs));text-shadow:0 0 8px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.6);line-height:1.1}
.spine .sp-m{color:#b8b8be;opacity:1;font-weight:600;font-size:10.5px;text-shadow:0 0 6px rgba(0,0,0,.7)}
.spine .sp-n{position:absolute;left:0;right:0;bottom:6px;writing-mode:horizontal-tb;text-align:center;font-size:10px;font-weight:700;color:#8e8e96;font-variant-numeric:tabular-nums;line-height:1}
@media (max-width:600px){.spine .sp-t{font-size:calc(var(--tfs) * var(--fs) * .9)}}

/* v35 spines: real-book look (rounded edges, cylindrical shading, raised bands), no count / no vol-years; tip-out selection */
.volshelf{perspective:900px}
.spine{border-radius:6px/3px;background-image:linear-gradient(90deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.28) 9%,rgba(255,255,255,.07) 32%,rgba(255,255,255,.11) 50%,rgba(255,255,255,.07) 68%,rgba(0,0,0,.28) 91%,rgba(0,0,0,.62) 100%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 30%);
  padding:26px 0 26px;transform-origin:50% 100%;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease;will-change:transform}
.spine .sp-rule{left:8%;right:8%;top:12px;height:3px;border-radius:1.5px;opacity:.9;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%,rgba(0,0,0,.35)),var(--sa);box-shadow:0 1px 1px rgba(0,0,0,.6),0 -1px 0 rgba(255,255,255,.06)}
.spine .sp-rule.sp-rb{top:auto;bottom:12px}
.spine.out{transform:translateY(-16px) rotateX(-10deg) scale(1.05);z-index:2;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 22px -6px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){.spine{transition:none}.spine.out{transform:none}}

/* v36 spinner rack: cream wire frame, tops lean out, tier wires, pocket lips, two-line header sign */
.pk::before{border-color:#eee6d2;left:-5px;right:-5px;top:auto;height:34%;border-width:2px}
.pk::after{background:linear-gradient(90deg,transparent 20%,#e8dfc8 20% calc(20% + 2px),transparent calc(20% + 2px) calc(80% - 2px),#e8dfc8 calc(80% - 2px) 80%,transparent 80%),linear-gradient(#f1ead8,#f1ead8) 0 0/100% 3px no-repeat;height:22%}
.wing{background:linear-gradient(90deg,#e9e1cc 0 2px,transparent 2px calc(100% - 2px),#e9e1cc calc(100% - 2px)),repeating-linear-gradient(180deg,transparent 0 calc(var(--pitch) + 4px),rgba(233,225,204,.55) calc(var(--pitch) + 4px) calc(var(--pitch) + 6px))}
.rkpole{background:linear-gradient(90deg,#9c9584,#f6f1e4 40%,#d9d1bd 60%,#8a8473);width:12px;left:-6px}
.rkbase{background:radial-gradient(ellipse at 50% 35%,#fffdf6,#e2dac6 55%,#a39b87)}
.rksign{flex-direction:column;gap:2px;background:linear-gradient(#fbfaf5,#ece8dc);border:3px solid #eee6d2;border-radius:2px;height:calc(var(--sign) * .86);left:calc(var(--pw) * -.95);width:calc(var(--pw) * 1.9)}
.rksign .rs-a{font:900 calc(var(--sign) * .36)/1 "Arial Black","Helvetica Neue",Arial,sans-serif;letter-spacing:.04em;color:#1d3fae;text-shadow:1.5px 1.5px 0 #c8242a}
.rksign .rs-b{font:900 calc(var(--sign) * .2)/1 "Arial Black","Helvetica Neue",Arial,sans-serif;letter-spacing:.08em;color:#c8242a}

/* v37: sign = one flat layer (SVG board+text background), lifted 2px off the pole's plane so the two never z-fight */
.rksign{background:#f5f2e8 center/100% 100% no-repeat;transform:translateZ(2px);transform-style:flat;backface-visibility:hidden}
.rkpole{transform:translateZ(-1px)}

/* v38: Recent tab (4th segment) — compact newest-first grid */
#recScroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rgrid{grid-template-columns:repeat(4,1fr);gap:8px 5px}
@media (min-width:600px){.rgrid{grid-template-columns:repeat(7,1fr);gap:10px 6px}}
@media (min-width:1000px){.rgrid{grid-template-columns:repeat(9,1fr)}}
.segctl button .rs{display:none}
.segctl button{min-width:84px;padding:0 10px}
@media (max-width:700px){.segctl button .rl{display:none}.segctl button .rs{display:inline}}
@media (max-width:440px){.segctl button{min-width:0;padding:0 8px;font-size:13px}}

/* ---------- v40: night at the comic shop — flat 2D layers on the stage (never inside the 3D rotor: no coplanar z-fighting) ---------- */
.rkmood{position:absolute;left:calc(var(--padx) + 6px);bottom:calc(var(--sab) + 12px);z-index:6;display:flex;gap:8px}
.moodbtn{height:40px;min-width:44px;padding:0 14px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;background:#000c;border:.5px solid #333;color:#d8d8dc;font-size:14px;font-weight:600}
.moodbtn .i{width:18px;height:18px}
.moodbtn[aria-pressed="true"]{background:#3a2a12;border-color:#a8792f;color:#ffd58a}
.rklamp,.rkvig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s ease}
.rklamp{z-index:0;background:
  radial-gradient(ellipse 42% 30% at 50% 4%,rgba(255,214,150,.55),rgba(255,190,110,.18) 45%,transparent 75%),
  radial-gradient(ellipse 60% 70% at 50% 48%,rgba(255,170,80,.20),rgba(120,70,30,.10) 45%,transparent 72%),
  linear-gradient(180deg,#1a120b 0%,#0e0a07 62%,#17100a 62.2%,#0b0806 100%)}
.rkvig{z-index:4;background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 52%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.85) 100%)}
#rack.night #rkStage{background:#0b0806}
#rack.night .rklamp,#rack.night .rkvig{opacity:1}
#rkScene{z-index:1}
@media (prefers-reduced-motion:reduce){.rklamp,.rkvig{transition:none}}

/* ---------- v40: back-issue bin (longbox seen from slightly above; our own cardboard + bags) ---------- */
#bin{position:absolute;inset:0;z-index:41;background:#000;display:flex;flex-direction:column}#bin.hidden{display:none}
#bin .pillbtn{height:40px;padding:0 18px}
#binStage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  background:radial-gradient(ellipse 70% 55% at 50% 30%,#2a2724 0%,#141312 60%,#070707 100%)}
.bn-back{position:absolute;left:50%;transform:translateX(-50%);width:calc(var(--bcw) * 1.3);top:calc(62% - var(--bch) * 1.75);height:calc(var(--bch) * 1.5);
  background:linear-gradient(180deg,#8a6a43,#6e5232);border-radius:4px 4px 0 0;box-shadow:inset 0 0 0 2px #5c4428,inset 0 14px 18px -10px rgba(0,0,0,.6)}
#binCards{position:absolute;left:50%;top:calc(62% - var(--bch) * .62);width:0;height:0}
.bn-c{position:absolute;left:0;top:0;width:var(--bcw);height:var(--bch);padding:0;border:0;background:#222;transform-origin:50% 100%;will-change:transform,opacity;border-radius:2px;
  box-shadow:0 -1px 0 rgba(255,255,255,.18),0 10px 18px rgba(0,0,0,.55)}
.bn-c img{position:absolute;inset:4px 3px 0 3px;width:calc(100% - 6px);height:calc(100% - 4px);object-fit:cover;object-position:top;pointer-events:none}
/* the bag: clear plastic sheen + a folded flap at the top, drawn with gradients (one flat element per card) */
.bn-bag{position:absolute;inset:0;pointer-events:none;border-radius:2px;border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 62%,rgba(255,255,255,.10) 78%,rgba(255,255,255,0) 92%)}
.bn-tab{position:absolute;left:-1px;right:-1px;top:-9px;height:10px;pointer-events:none;border-radius:2px 2px 0 0;background:linear-gradient(180deg,rgba(235,240,245,.38),rgba(235,240,245,.16));border:1px solid rgba(255,255,255,.25);border-bottom:0}
.bn-c.lift{box-shadow:0 -1px 0 rgba(255,255,255,.25),0 26px 40px rgba(0,0,0,.75)}
.bn-front{position:absolute;left:50%;transform:translateX(-50%);width:calc(var(--bcw) * 1.4);top:calc(62% - var(--bch) * .24);bottom:0;z-index:495;pointer-events:none;
  background:linear-gradient(180deg,#a47e50 0%,#8f6c42 30%,#6f5332 100%);border-radius:3px 3px 0 0;box-shadow:0 -6px 16px rgba(0,0,0,.55),inset 0 3px 0 rgba(255,235,200,.25)}
.bn-front i{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:28%;height:20px;border-radius:10px;background:#3b2c1b;box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}   /* hand hole */
.bn-c.lift{z-index:600!important}
.bn-hint{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 10px);text-align:center;color:#c9b493;font-size:13px;z-index:700;margin:0;pointer-events:none}

/* v42 creator credits */
.credits{display:flex;flex-direction:column;gap:2px;padding:6px 0 2px}
.crwrap{padding:0 16px 8px;border-bottom:.5px solid var(--sep)}
.crrow{display:flex;align-items:center;gap:8px;min-height:40px}
.crl{flex:none;width:52px;color:var(--mut);font-size:13px}
.crv{display:flex;flex-wrap:wrap;gap:4px 6px}
.crn{min-height:40px;min-width:40px;padding:0 12px;border-radius:20px;background:var(--el);color:#fff;font-size:14px;font-weight:600}
.crn:active{background:var(--el2)}
#creator{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}#creator.hidden{display:none}
#creator .rkt h2{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#crBody{flex:1;min-height:0;padding:4px var(--padr) calc(24px + var(--sab)) var(--padx)}
.crg h3{margin:14px 0 8px;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:baseline}.crg h3 small{color:var(--mut);font-weight:500;font-size:12px}
.crgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px 8px}
@media (max-width:560px){.crgrid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}}
.crc{display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.crc .tt{font-size:11.5px;color:#e5e5ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crc .td{font-size:10.5px;color:var(--mut)}
.rinfo{display:flex;gap:12px;align-items:center;margin-bottom:6px}.rinfo img{width:52px;border-radius:4px}.rinfo b{display:block}.rinfo span{color:var(--mut);font-size:13px}

/* v44: Home without category rows: carousel, shelf and Continue Reading fill the screen (no empty band at the bottom on iPad) */
#homeScroll.norows{display:flex;flex-direction:column;min-height:100%}
#homeScroll.norows>.rows{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding-bottom:calc(16px + var(--sab))}
/* shelf stays snug under the carousel (v34 rule); on tall screens the Continue Reading covers grow to use the height instead of leaving a band */
#homeScroll.norows>.rows>.cont{--rw:clamp(112px,calc((100vh - 820px)*.42 + 112px),230px)}
.scoph{padding:10px var(--padx) 4px}.scoph h2{margin:0;font-size:22px;font-weight:700}.scoph small{color:var(--mut);font-size:13px}
</style>
</head>

<!-- ================= SHELF ================= -->
<section id="shelf" class="screen">
  <section id="rack" class="hidden" aria-label="Spinner rack"><header class="rkbar"><div class="tb-row rk-row">
    <button class="icbtn" id="rkBack" aria-label="Back to Timeline"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

    <div class="rknav"><button class="icbtn" id="rkPrev" aria-label="Previous month"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button class="icbtn" id="rkNext" aria-label="Next month"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div></div></header>
    <div id="rkStage"><div id="rkScene"><div id="rkRotor"></div><div class="rkbase"><i></i></div></div>

      <div class="rkmood"><button class="moodbtn" id="rkNight" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>Night</span></button><button class="moodbtn" id="rkRain" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M7 16a4 4 0 1 1 .5-8 6 6 0 0 1 11.5 2 3.5 3.5 0 0 1-1 6.9H7z"/><path d="M9 19l-1 2M13 19l-1 2M17 19l-1 2"/></svg><span>Rain</span></button></div><div class="rklamp" aria-hidden="true"></div><div class="rkvig" aria-hidden="true"></div><button class="icbtn rkspin" id="rkLeft" aria-label="Spin left"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button class="icbtn rkspin" id="rkRight" aria-label="Spin right"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div></section>
  <header class="topbar"><div class="tb-row">
    <button class="icbtn" id="libBack" aria-label="Back to Library"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="icbtn" id="settingsBtn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <div class="segctl" role="tablist" id="tabs"><button role="tab" data-tab="home" class="on">Home</button><button role="tab" data-tab="library">Library</button><button role="tab" data-tab="timeline">Timeline</button><button role="tab" data-tab="recent" aria-label="Recently Added"><span class="rl">Recently Added</span><span class="rs">Recent</span></button></div>
    <div class="tb-r"><button class="txtbtn" id="selBtn" aria-pressed="false" aria-label="Select"><span class="lbl">Select</span><svg class="i ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg></button><button class="icbtn" id="importBtn" aria-label="Import PDFs"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <input type="file" id="fileIn" accept="application/pdf,.pdf" multiple hidden>
  </div></header>
  <main id="home" class="tabview"><div class="scrollv" id="homeScroll"></div></main>
  <main id="library" class="tabview hidden">
    <div class="libbar">
      <div class="lrow"><label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search your library" autocomplete="off" enterkeyhint="search"></label>
        <button class="sortbtn" id="sortBtn" aria-haspopup="menu"><svg class="i" viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span id="sortLbl">Recent</span></button></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="scrollv" id="libScroll"><div id="seriesHero"></div><div class="lgrid" id="libGrid"></div></div>
    <nav id="azIndex" class="hidden" aria-label="Jump to letter"></nav>
    <div id="selBar" class="selbar hidden" role="toolbar" aria-label="Selection"><div class="sb-row">
      <button class="txtbtn" id="selAll">Select All</button><span id="selCount" class="selcount">0 selected</span>
      <button class="txtbtn" id="selRemove" disabled aria-label="Remove from Series">Remove<span class="w">&nbsp;from Series</span></button><button class="pillbtn" id="selMove" disabled aria-label="Move to Series">Move<span class="w">&nbsp;to Series</span>…</button></div></div>
  </main>
  <section id="bin" class="hidden" aria-label="Back-issue bin"><header class="rkbar"><div class="tb-row rk-row">
    <button class="icbtn" id="binClose" aria-label="Close bin"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="rkt"><h2>Back-issue bin</h2><small id="binSub"></small></div>
    <div class="rknav"><button class="pillbtn" id="binDig" aria-label="Dig: shuffle in a random handful">Dig</button></div></div></header>
    <div id="binStage"><div class="bn-back" aria-hidden="true"></div><div id="binCards"></div><div class="bn-front" aria-hidden="true"><i></i></div>
      <p class="bn-hint">Swipe to flip · tap the raised comic to read</p></div></section>
  <main id="recent" class="tabview hidden" aria-label="Recently Added"><div class="scrollv" id="recScroll"><div class="lgrid rgrid" id="recGrid"></div></div></main>
  <main id="timeline" class="tabview hidden" aria-label="Timeline"><div class="tlbar"><div class="tldec" id="tlDec" aria-label="Jump to decade"></div><div class="tlr"><span id="tlCount" class="tlcount"></span><button class="icbtn" id="tlBin" aria-label="Back-issue bin"><svg class="i" viewBox="0 0 24 24"><path d="M3 9h18l-2 11H5z"/><path d="M7 9V5h3v4M11 9V4h3v5M15 9V6h3v3"/></svg></button><button class="icbtn" id="tlRack" aria-label="Spinner rack"><svg class="i" viewBox="0 0 24 24"><path d="M12 2v20M7 22h10"/><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="11" width="14" height="5" rx="1"/></svg></button></div></div><div class="scrollv" id="tlScroll"></div></main>

function cover(c){ if(!c.cover) return ''; let u=coverURL.get(c.id); if(!u){ u=URL.createObjectURL(c.cover instanceof Blob?c.cover:new Blob([c.cover],{type:'image/jpeg'})); coverURL.set(c.id,u); } return u; }
const pctOf=c=>c.pages?Math.round(clamp(c.progress||0,0,1)*100):0;
const isDone=c=>(c.progress||0)>=1, isUnread=c=>!c.lastRead&&!((c.progress||0)>0), inProg=c=>!isDone(c)&&!isUnread(c);
const byTitle=(a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true,sensitivity:'base'});
// issue number from a title: '#12' wins; else the last number once (…)/[…] tags (years, scanner names) are dropped. X-MEN177 -> 177
function issueNo(t){ const s=String(t||''); let m=s.match(/#\s*(\d+(?:\.\d+)?)/); if(m) return parseFloat(m[1]);
  m=s.replace(/[([].*?[)\]]/g,' ').match(/(\d+(?:\.\d+)?)(?!.*\d)/); return m?parseFloat(m[1]):Infinity; }
const byIssue=(a,b)=>{ const x=issueNo(a.title), y=issueNo(b.title); return x!==y? (x===Infinity?1:y===Infinity?-1:x-y) : byTitle(a,b); };
function seriesGuess(t){ const s=t.replace(/[([].*?[)\]]/g,' ').replace(/\s+/g,' ').trim();
  const m=s.match(/^(.*?)[\s,_-]*(?:#|no\.?\s*|issue\s*|vol(?:ume)?\.?\s*|v|ch(?:apter)?\.?\s*|book\s*)?(\d{1,4})(?:\s*of\s*\d+)?$/i);
  return m&&m[1].trim().length>=2&&/[a-z]/i.test(m[1])? m[1].replace(/[\s,_#-]+$/,'').trim() : ''; }
/* ---- manual series: a series set by hand (Move to Series, Rename/Merge, Edit) is remembered per file (Drive id, or file name + size),
   so deleting and re-importing / re-syncing from Drive keeps it instead of re-grouping by folder or file name.
   c.autoSeries = what automatic grouping gave at import; Remove from Series goes back to it. ---- */
const fileKeys=c=>[c.driveId?'d:'+c.driveId:null,c.fileName?'f:'+c.fileName+'|'+(c.size||0):null].filter(Boolean);
const seriesOv=()=>store.get('seriesOv',{})||{};

// new record (Files or Drive import): remember the automatic series, then apply a saved manual series for this file
function withSeriesOverride(rec){ applyDateOv(rec); rec.autoSeries=rec.series||''; const ov=seriesOv(), k=fileKeys(rec).find(k=>k in ov); if(k!=null){ rec.series=ov[k]; rec.seriesManual=true; } return rec; }
async function loadLibrary(){ comics=await dbAll(); try{ dateOv=new Map((await ovAll()).filter(o=>o.date).map(o=>[o.k,o.date])); }catch(e){ dateOv=new Map(); } comics.forEach(applyDateOv); try{ queues=await qAll(); }catch(e){ console.warn('reading lists unavailable',e); queues=[]; } renderShelf(); setTimeout(migrateCovers,400); kickBlack(5000); setTimeout(backfillDates,2500); }
/* ---- background blank-black page detection, cached per comic (c.blackPages, c.blackV) ----
   newest-read first, one comic at a time, idle-paced; while a comic is open only that comic is scanned */
const needsBlack=c=>c.blackV!==BLACK_V;
const skipVal=c=>(c.skipBlack??store.get('skipBlack',true))?'on':'off';
const blankList=c=>[...(c.blackPages||[]),...(c.whitePages||[])].filter(p=>p>0&&p<c.pages).sort((a,b)=>a-b);
const skipList=c=>skipVal(c)==='on'?blankList(c):[];
let blackBusy=false, blackT=0;
let lastInput=0; ['pointerdown','pointermove','keydown','wheel'].forEach(t=>addEventListener(t,()=>{ lastInput=performance.now(); },{capture:true,passive:true}));
const readerBusy=()=>!!R.comic&&(flip||animating||landing||running>0||jobs.size>0||performance.now()-lastInput<1500);
function kickBlack(delay=1500){ clearTimeout(blackT); blackT=setTimeout(blackLoop,delay); }
async function blackLoop(){ if(blackBusy||window.__crNoScan) return; blackBusy=true;
  try{ for(;;){ if(importing) { kickBlack(3000); break; }
      const open=R.comic, c=open?(needsBlack(open)?open:null):comics.filter(needsBlack).sort((a,b)=>(b.lastRead||0)-(a.lastRead||0)||(b.added||0)-(a.added||0))[0];
      if(!c) break; if(!await scanOne(c)) break; } }
  finally{ blackBusy=false; } }
async function scanOne(c){ let doc=null; const id=c.id;
  const alive=()=>!window.__crNoScan&&comics.some(x=>x.id===id)&&(!R.comic||R.comic.id===id);
  const pause=async()=>{ for(let k=0;k<600&&readerBusy();k++) await new Promise(r=>setTimeout(r,100));   /* never compete with a page turn or page render */
    await new Promise(r=>{ const go=()=>setTimeout(r,R.comic?40:6); if(window.requestIdleCallback) requestIdleCallback(go,{timeout:300}); else go(); }); };
  try{ doc=await openPdf(new IDBSource(c.id,c.size)); const r=await scanBlack(doc,{alive,pause,from:R.comic&&R.comic.id===id?(c.page||0):1}); if(r==null) return false;
    c.blackPages=r.black; c.whitePages=r.white; c.blackV=BLACK_V; delete c.blankPages; delete c.blankPagesV2; delete c.blankTail; await dbPut(c); dispatchEvent(new CustomEvent('cr-black',{detail:id})); return true; }
  catch(e){ console.warn('black-page scan failed',e); c.blackPages=[]; c.whitePages=[]; c.blackV=BLACK_V; return true; }
  finally{ if(doc) doc.destroy().catch(()=>{}); } }
/* regenerate a comic's cover thumbnail from its stored PDF (cover mode change, or migration) */
let coverJob=Promise.resolve();
function recover(c,mode){ return coverJob=coverJob.then(async()=>{ const doc=await openPdf(new IDBSource(c.id,c.size));
  try{ const m=await coverMeta(doc,mode||c.coverMode||'auto'); Object.assign(c,m); if(!c.coverMode||mode) c.coverMode=m.coverMode; } finally{ await doc.destroy(); }
  await dbPut(c); const u=coverURL.get(c.id); if(u){ URL.revokeObjectURL(u); coverURL.delete(c.id); } renderShelf(); }).catch(e=>{ throw e; }); }
// one-time (per COVER_V) background migration: older imports get cropped covers + crop info
async function migrateCovers(){ const todo=comics.filter(c=>(c.coverV||0)<COVER_V); if(!todo.length){ store.set('coverMig',COVER_V); return; }
  for(const c of todo){ if(!comics.includes(c)) continue; while(R&&R.comic) await new Promise(r=>setTimeout(r,1500));   // don't compete with the reader
    try{ await recover(c,c.coverMode||'auto'); }catch(e){ console.warn('cover migration failed for',c.title,e); c.coverV=COVER_V; try{ await dbPut(c); }catch(_){} } }
  store.set('coverMig',COVER_V); }

/* ---------- Continue Reading row (v43; replaces the v1 single "Continue reading" card, removed in v7): directly under the spine shelf ----------
   in-progress issues, most recently read first; when a series' latest-read issue is finished, its next unread issue joins too.
   Remove from Continue Reading only hides it (progress untouched) until you read it again. */
const contHid=()=>store.get('contHide',{})||{};
function contList(){ const H=contHid(), hidden=c=>H[c.id]!=null&&(c.lastRead||0)<=H[c.id], out=[], seen=new Set();
  const cand=[]; comics.filter(inProg).forEach(c=>cand.push({c,t:c.lastRead||0}));
  const by=new Map(); comics.forEach(c=>{ const s=(c.series||'').trim(); if(s){ if(!by.has(s)) by.set(s,[]); by.get(s).push(c); } });
  for(const L of by.values()){ const cur=L.filter(c=>c.lastRead).sort((a,b)=>b.lastRead-a.lastRead)[0]; if(!cur||!isDone(cur)) continue;
    const ord=L.slice().sort(byIssue), nx=ord.slice(ord.indexOf(cur)+1).find(isUnread); if(nx) cand.push({c:nx,t:cur.lastRead,next:true}); }
  cand.sort((a,b)=>b.t-a.t).forEach(x=>{ if(!seen.has(x.c.id)&&!hidden(x.c)){ seen.add(x.c.id); out.push(x); } }); return out; }
const pageOf=c=>{ const sk=skipList(c), n=Math.max(1,(c.pages||1)-sk.length), p=(c.page||0)+1-sk.filter(q=>q<(c.page||0)).length; return [Math.min(Math.max(1,p),n),n]; };

  clearTimeout(toastT); if(!sticky) toastT=setTimeout(hideToast,2600); }

let importing=false;
async function importFiles(files){
  if(importing){ toast('Already importing…'); return; } importing=true;
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  let ok=0;
  for(let k=0;k<files.length;k++){ const f=files[k]; const tag=files.length>1?` (${k+1}/${files.length})`:'';
    if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name))){ toast(`Skipped “${f.name}” — not a PDF`); continue; }
    const id=uid(); let doc=null;
    try{
      toast(`Reading ${f.name}${tag}…`,{progress:0,sticky:true});
      doc=await openPdf(new FileSource(f));
      await doc.getPage(1); await doc.destroy(); doc=null;          // validate before copying
      const n=Math.ceil(f.size/CHUNK);
      for(let i=0;i<n;i++){ const ab=await f.slice(i*CHUNK,Math.min(f.size,(i+1)*CHUNK)).arrayBuffer(); await dbPutChunk(id,i,ab);
        toast(`Saving ${f.name}${tag}…`,{progress:(i+1)/n,sticky:true}); }
      doc=await openPdf(new IDBSource(id,f.size));                    // cover from the stored copy (same path as Drive import/migration)
      const meta=await coverMeta(doc); const pages=doc.numPages; await doc.destroy(); doc=null;
      const t0=titleFromName(f.name); const rec=withSeriesOverride({id,title:t0,series:seriesGuess(t0),fileName:f.name,size:f.size,pages,...meta,added:Date.now()+k,lastRead:0,page:0,progress:0,rtl:false});
      await dbPut(rec); comics.push(rec); ok++; renderShelf();
    }catch(err){ console.warn('import failed',err); try{ if(doc) await doc.destroy(); }catch(e){} try{ await dbDelete(id); }catch(e){}
      const quota=err&&(err.name==='QuotaExceededError'||/quota/i.test(err.message||''));
      toast(quota?`Out of storage space importing “${f.name}”.`:`Couldn't import “${f.name}”: ${err&&err.message||'not a valid PDF'}`); await new Promise(r=>setTimeout(r,1800)); }
  }
  importing=false; if(ok) toast(`Imported ${ok} comic${ok>1?'s':''} ✓`); renderShelf(); if(ok) kickBlack();
}

/* ================= Google Drive import (GIS token client + Picker; streamed into chunked IndexedDB) =================
   The access token lives in memory only. Files are downloaded straight from Google to this device; nothing is uploaded. */
const Drive=(()=>{
  const SCOPE=DRIVE_FOLDER_IMPORT?'https://www.googleapis.com/auth/drive.readonly':'https://www.googleapis.com/auth/drive.file';
  const APP_ID=GOOGLE_APP_ID||(GOOGLE_CLIENT_ID.match(/^(\d+)-/)||[])[1]||'';
  const configured=()=>!!(GOOGLE_CLIENT_ID&&GOOGLE_API_KEY);
  const FOLDER='application/vnd.google-apps.folder';
  const REDIRECT=new URL('./',location.href).href.split('#')[0].split('?')[0];
  let tok=null;                 // {t, exp}
  let mode='pick';              // 'pick' (Picker) | 'folder' (Import Entire Folder)
  const folder=()=>store.get('driveFolder',null)||DRIVE_DEFAULT_FOLDER;
  // accepts a Drive folder link (…/folders/ID?resourcekey=KEY, …open?id=ID) or a bare ID
  function parseFolderLink(txt){ txt=String(txt||'').trim(); if(!txt) return null; let id=null, rk=null;
    try{ const u=new URL(txt); const m=u.pathname.match(/\/folders\/([\w-]{10,})/); id=m?m[1]:u.searchParams.get('id'); rk=u.searchParams.get('resourcekey'); }
    catch(e){ const m=txt.match(/^[\w-]{10,}$/); id=m?m[0]:null; }
    return id?{id,resourceKey:rk||''}:null; }
  const rkHeader=(keys)=>{ const v=[...new Set(keys.filter(Boolean))].join(','); return v?{'X-Goog-Drive-Resource-Keys':v}:{}; };
  const folderKey=()=>{ const f=folder(); return f.resourceKey?`${f.id}/${f.resourceKey}`:''; };
  let tokenClient=null, loadP=null, pickerReady=false;
  const tokOK=()=>tok&&tok.exp>Date.now()+60000;

  // pick up a token returned by the redirect fallback (Home Screen app), then strip it from the URL
  let resumePicker=false;
  (()=>{ const h=location.hash; if(!/[#&](access_token|error)=/.test(h)) return;
    const p=new URLSearchParams(h.slice(1)); let want=null; try{ want=sessionStorage.getItem('cr.oauthState'); sessionStorage.removeItem('cr.oauthState'); }catch(e){}
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    try{ mode=sessionStorage.getItem('cr.oauthMode')||'pick'; sessionStorage.removeItem('cr.oauthMode'); }catch(e){}
    if(p.get('access_token')&&want&&p.get('state')===want){ tok={t:p.get('access_token'),exp:Date.now()+(+p.get('expires_in')||3600)*1000}; resumePicker=true; }
    else if(p.get('error')) setTimeout(()=>toast(p.get('error')==='access_denied'?'Google sign-in was cancelled':'Google sign-in failed: '+p.get('error')),600); })();

  function script(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=()=>rej(new Error('Could not load '+src)); document.head.appendChild(s); }); }
  function load(){ if(!configured()) return Promise.reject(new Error('not configured'));
    if(!loadP) loadP=Promise.all([
      script('https://accounts.google.com/gsi/client').then(()=>{ tokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:SCOPE,callback:()=>{},error_callback:()=>{}}); }),
      script('https://apis.google.com/js/api.js').then(()=>new Promise((res,rej)=>gapi.load('picker',{callback:res,onerror:rej}))).then(()=>{ pickerReady=true; })
    ]).catch(e=>{ loadP=null; throw e; });
    return loadP; }
  const ready=()=>!!(tokenClient&&pickerReady);
  function preload(){ if(configured()&&navigator.onLine) load().catch(()=>{}); }

  const notSetUp=()=>modal(`<div class="mh"><h3>Drive import not set up yet</h3></div><div class="mb"><p class="confirm-msg">Importing straight from Google Drive needs a one-time Google sign-in setup that hasn't been added to this app yet.</p><p class="confirm-msg" style="margin-top:10px">Until then, use <b>From Files</b>.</p></div><div class="mf"><button class="btn" data-r="ok" id="dNotSetOk">OK</button></div>`,null,'drv');

  // entry point: must run synchronously inside the user's tap so the sign-in popup isn't blocked
  const afterToken=()=>mode==='folder'?folderFlow():showPicker();
  function start(m){ mode=m||'pick';
    if(!configured()){ notSetUp(); return; }
    if(!navigator.onLine){ toast("You're offline. Connect to the internet to import from Google Drive."); return; }
    if(tokOK()){ if(mode==='folder') folderFlow(); else ensureLoaded().then(showPicker).catch(e=>toast("Couldn't load Google Picker: "+e.message)); return; }
    if(ready()){ requestToken(); return; }
    // scripts still loading: show a sheet whose button gives us a fresh tap for the popup
    modal(`<div class="mh"><h3>Google Drive</h3></div><div class="mb"><p class="confirm-msg" id="dConnMsg">Connecting to Google…</p></div><div class="mf"><button class="btn ghost" data-r="no">Cancel</button><button class="btn" id="dConnGo" disabled>Continue</button></div>`,(w,close)=>{
      load().then(()=>{ if(!w.isConnected) return; w.querySelector('#dConnMsg').textContent=`Ready. Sign in with Google to ${mode==='folder'?'list the comics in your Drive folder':'choose comics from your Drive'}.`; const b=w.querySelector('#dConnGo'); b.disabled=false; b.onclick=()=>{ close('go'); requestToken(); }; })
        .catch(()=>{ if(w.isConnected) w.querySelector('#dConnMsg').textContent="Couldn't reach Google. Check your connection and try again."; }); },'drv'); }
  const ensureLoaded=()=>ready()?Promise.resolve():load();

  function requestToken(){
    tokenClient.callback=r=>{ if(r.error){ signInHelp(r.error==='access_denied'?'cancelled':'error',r.error_description||r.error); return; }
      if(!google.accounts.oauth2.hasGrantedAllScopes(r,SCOPE)){ signInHelp('scope'); return; }
      tok={t:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000}; afterToken(); };
    tokenClient.error_callback=e=>signInHelp(e&&e.type||'unknown');
    try{ tokenClient.requestAccessToken({prompt:''}); }catch(e){ signInHelp('popup_failed_to_open'); } }

  // popups are unreliable in iPad Home Screen apps: explain, offer a retry and a same-window (redirect) sign-in
  function signInHelp(kind,detail){
    const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
    const msg=kind==='popup_failed_to_open'?"The Google sign-in window couldn't open (it may have been blocked as a pop-up)."
      :kind==='popup_closed'?'The Google sign-in window was closed before sign-in finished.'
      :kind==='cancelled'?'Google sign-in was cancelled.'
      :kind==='scope'?'Drive access wasn\'t granted. Tick the Google Drive permission when signing in.'
      :'Google sign-in failed'+(detail?`: ${detail}`:'.');
    modal(`<div class="mh"><h3>Sign in to Google Drive</h3></div><div class="mb"><p class="confirm-msg">${esc(msg)}</p>
      <p class="confirm-msg" style="margin-top:10px">${standalone?'In the Home Screen app, the sign-in window sometimes can\'t report back. Use <b>Sign in here</b> to sign in in this window. You\'ll come straight back to your library.':'Try again, or use <b>Sign in here</b> to sign in in this window. If pop-ups are blocked, allow them for this site in Settings → Safari.'}</p></div>
      <div class="mf"><button class="btn ghost" data-r="no">Cancel</button><button class="btn ghost" id="dRetry">Try Again</button><button class="btn" id="dRedirect">Sign in here</button></div>`,(w,close)=>{
        w.querySelector('#dRetry').onclick=()=>{ close('retry'); requestToken(); };
        w.querySelector('#dRedirect').onclick=()=>{ close('redirect'); redirectSignIn(); }; },'drv'); }
  function redirectSignIn(){ const state=uid(); try{ sessionStorage.setItem('cr.oauthState',state); sessionStorage.setItem('cr.oauthMode',mode); }catch(e){}
    const q=new URLSearchParams({client_id:GOOGLE_CLIENT_ID,redirect_uri:REDIRECT,response_type:'token',scope:SCOPE,state,include_granted_scopes:'true',prompt:'select_account'});
    location.assign('https://accounts.google.com/o/oauth2/v2/auth?'+q); }

  function showPicker(){ const P=google.picker;
    const view=new P.DocsView(P.ViewId.DOCS).setMimeTypes(DRIVE_FOLDER_IMPORT?'application/pdf,'+FOLDER:'application/pdf').setIncludeFolders(true).setSelectFolderEnabled(DRIVE_FOLDER_IMPORT).setMode(P.DocsViewMode.LIST);
    if(folder().id) view.setParent(folder().id);   // open directly in the comics folder; subfolders stay navigable
    const b=new P.PickerBuilder().addView(view).enableFeature(P.Feature.MULTISELECT_ENABLED).setOAuthToken(tok.t).setDeveloperKey(GOOGLE_API_KEY)
      .setTitle(DRIVE_FOLDER_IMPORT?'Choose comics or a folder':'Choose comics (PDF)').setCallback(onPicked).setMaxItems(200);
    if(APP_ID) b.setAppId(APP_ID); try{ b.setOrigin(location.origin); }catch(e){}
    const pk=b.build(); pk.setVisible(true); }
  async function onPicked(d){ const P=google.picker; if(d[P.Response.ACTION]!==P.Action.PICKED) return;
    const docs=d[P.Response.DOCUMENTS]||[]; let items=[];
    for(const x of docs){ const id=x[P.Document.ID], name=x[P.Document.NAME]||'Untitled.pdf', mt=x[P.Document.MIME_TYPE];
      if(mt===FOLDER){ try{ toast(`Listing “${name}”…`,{sticky:true}); items=items.concat(await listFolder(id,0,isRangeName(name)?'':name,[folderKey(),x.resourceKey?`${id}/${x.resourceKey}`:''],name)); hideToast(); }catch(e){ toast(`Couldn't open folder “${name}”: ${e.message}`); } }
      else items.push({id,name,size:+(x.sizeBytes||x[P.Document.SIZE_BYTES]||0),resourceKey:x.resourceKey||''}); }
    if(items.length) importRemote(items); else toast('No PDFs found in that selection'); }
  // recursive listing (PDFs + subfolders); subfolder name becomes the series, unless it's just an issue range/era
  // ('150-199', "300's", '1-50') -> keep the parent folder's name as the series
  async function listFolder(fid,depth,series,keys,name){ keys=keys||[folderKey()]; let out=[], page='';
    do{ const q=new URLSearchParams({q:`'${fid}' in parents and trashed=false and (mimeType='application/pdf' or mimeType='${FOLDER}')`,fields:'nextPageToken,files(id,name,size,mimeType,resourceKey)',pageSize:'1000',orderBy:'folder,name_natural',supportsAllDrives:'true',includeItemsFromAllDrives:'true'}); if(page) q.set('pageToken',page);
      const r=await fetch('https://www.googleapis.com/drive/v3/files?'+q,{headers:{Authorization:'Bearer '+tok.t,...rkHeader(keys)}});
      if(r.status===401){ tok=null; throw new Error('Google session expired. Try again.'); } if(!r.ok) throw new Error(r.status===404?'Folder not found or no access (HTTP 404)':'HTTP '+r.status); const j=await r.json();
      for(const f of j.files||[]){ const k=f.resourceKey?`${f.id}/${f.resourceKey}`:'';
        if(f.mimeType===FOLDER){ if(depth<4) out=out.concat(await listFolder(f.id,depth+1,isRangeName(f.name)?(series||name||''):f.name,k?keys.concat(k):keys,f.name)); }
        else out.push({id:f.id,name:f.name,size:+f.size||0,resourceKey:f.resourceKey||'',series:series||'',keys:k?keys.concat(k):keys}); }
      page=j.nextPageToken||''; }while(page);
    return out; }
  const inLib=it=>comics.some(c=>(c.driveId&&c.driveId===it.id)||(it.size&&c.size===it.size&&c.fileName===it.name));

  /* ---------- Import Entire Folder: list, then a checklist sheet ---------- */
  async function folderFlow(){ const f=folder();
    toast(`Listing “${f.name||'Drive folder'}”…`,{sticky:true});
    let items, fname=f.name||'Drive folder';
    try{ const mr=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(f.id)}?fields=name&supportsAllDrives=true`,{headers:{Authorization:'Bearer '+tok.t,...rkHeader([folderKey()])}});
      if(mr.ok) fname=(await mr.json()).name||fname;
      items=await listFolder(f.id,0,'',undefined,fname); hideToast(); }
    catch(e){ toast(`Couldn't list the Drive folder: ${e.message}`); return; }
    if(!items.length){ toast(`No PDFs found in “${fname}”`); return; }
    checklist(items,fname); }
  function checklist(items,fname){
    items.forEach((it,i)=>{ it.k=i; it.dup=inLib(it); it.on=!it.dup; });
    const groups=[]; for(const it of items){ let g=groups.find(x=>x.s===it.series); if(!g) groups.push(g={s:it.series,list:[]}); g.list.push(it); }
    const row=it=>`<label class="ckr${it.dup?' dup':''}"><input type="checkbox" data-k="${it.k}" ${it.on?'checked':''}><span class="ckt"><b>${esc(titleFromName(it.name))}</b><small>${it.size?fmtBytes(it.size):''}${it.dup?' · In library':''}</small></span></label>`;
    return modal(`<div class="mh"><h3>${esc(fname)}</h3><p class="dlsub" id="ckSub"></p>
        <div class="ckbar"><button class="lnk" id="ckAll">Select All</button><button class="lnk" id="ckNone">Select None</button></div></div>
      <div class="dllist ck">${groups.map(g=>`${g.s?`<div class="ckg">${esc(g.s)}</div>`:''}${g.list.map(row).join('')}`).join('')}</div>
      <div class="mf"><button class="btn ghost" data-r="no">Cancel</button><button class="btn" id="ckGo">Import</button></div>`,(w,close)=>{
        const sync=()=>{ const sel=items.filter(x=>x.on); const T=sel.reduce((a,x)=>a+(x.size||0),0);
          w.querySelector('#ckSub').textContent=`${items.length} PDFs · ${items.filter(x=>x.dup).length} already in library · ${sel.length} selected (${fmtBytes(T)})`;
          const b=w.querySelector('#ckGo'); b.textContent=sel.length?`Import ${sel.length}`:'Import'; b.disabled=!sel.length; };
        w.addEventListener('change',e=>{ const c=e.target.closest('input[data-k]'); if(c){ items[+c.dataset.k].on=c.checked; sync(); } });
        const setAll=v=>{ items.forEach(x=>{ x.on=v&&!x.dup; }); w.querySelectorAll('input[data-k]').forEach(c=>c.checked=items[+c.dataset.k].on); sync(); };
        w.querySelector('#ckAll').onclick=()=>setAll(true); w.querySelector('#ckNone').onclick=()=>setAll(false);
        w.querySelector('#ckGo').onclick=()=>{ const sel=items.filter(x=>x.on); close('go'); importRemote(sel); };
        sync(); },'drv ckm'); }

  /* ---------- streamed download -> 4 MB IndexedDB chunks (bounded memory), with a progress sheet ---------- */
  async function streamToChunks(id,resp,onProg,signal){
    let ci=0, got=0;
    if(!resp.body||!resp.body.getReader){ const ab=await resp.arrayBuffer(); for(let o=0;o<ab.byteLength;o+=CHUNK){ await dbPutChunk(id,ci++,ab.slice(o,o+CHUNK)); } onProg(ab.byteLength); return ab.byteLength; }
    const rd=resp.body.getReader(); let buf=new Uint8Array(CHUNK), fill=0;
    try{ for(;;){ if(signal.aborted) throw new DOMException('Cancelled','AbortError');
        const {done,value}=await rd.read(); if(done) break; let off=0;
        while(off<value.length){ const n=Math.min(CHUNK-fill,value.length-off); buf.set(value.subarray(off,off+n),fill); fill+=n; off+=n;
          if(fill===CHUNK){ await dbPutChunk(id,ci++,buf.buffer); buf=new Uint8Array(CHUNK); fill=0; } }
        got+=value.length; onProg(got); }
    }catch(e){ try{ rd.cancel().catch(()=>{}); }catch(_){} throw e; }
    if(fill) await dbPutChunk(id,ci++,buf.slice(0,fill).buffer);
    return got; }

  let ctl=null;
  async function importRemote(items,{auth=true}={}){
    if(importing){ toast('Already importing…'); return; } importing=true; ctl=new AbortController(); const signal=ctl.signal;
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
    const rows=items.map((it,k)=>({...it,k,got:0,st:'wait',msg:'Waiting'}));
    const w=document.createElement('div'); w.className='mwrap dlwrap'; w.innerHTML=`<div class="modal dl" role="dialog" aria-modal="true" aria-label="Importing from Google Drive">
      <div class="mh"><h3 id="dlHead">Importing from Google Drive</h3><p class="dlsub" id="dlSub"></p><div class="dlbar all"><i id="dlAll"></i></div></div>
      <div class="dllist">${rows.map(r=>`<div class="dlr" data-k="${r.k}"><div class="dlt"><b>${esc(titleFromName(r.name))}</b><span class="dlp">0%</span></div><div class="dlbar"><i></i></div><div class="dls">Waiting</div></div>`).join('')}</div>
      <div class="mf"><button class="btn ghost" id="dlCancel">Cancel</button></div></div>`; document.body.appendChild(w);
    const total=()=>rows.reduce((a,r)=>a+(r.size||0),0);
    let last=0; const paint=(force)=>{ const now=performance.now(); if(!force&&now-last<90) return; last=now;
      for(const r of rows){ const el=w.querySelector(`.dlr[data-k="${r.k}"]`); const p=r.st==='done'?1:r.size?Math.min(1,r.got/r.size):0;
        el.className='dlr '+r.st; el.querySelector('.dlbar i').style.width=(p*100).toFixed(1)+'%'; el.querySelector('.dlp').textContent=r.st==='skip'?'—':r.st==='fail'||r.st==='cancel'?'':Math.round(p*100)+'%'; el.querySelector('.dls').textContent=r.msg; }
      const T=total(), G=rows.reduce((a,r)=>a+(r.st==='done'||r.st==='skip'?(r.size||r.got):Math.min(r.got,r.size||r.got)),0); const fin=rows.filter(r=>/done|skip|fail|cancel/.test(r.st)).length;
      w.querySelector('#dlAll').style.width=(T?Math.min(1,G/T)*100:fin/rows.length*100).toFixed(1)+'%';
      w.querySelector('#dlSub').textContent=`${Math.min(fin+1,rows.length)} of ${rows.length}`+(T?` · ${fmtBytes(G)} of ${fmtBytes(T)}`:''); };
    w.querySelector('#dlCancel').onclick=()=>{ if(ctl&&!signal.aborted) ctl.abort(); else w.remove(); };
    paint(true); let ok=0,skip=0,fail=0, wl=null; try{ if(navigator.wakeLock) wl=await navigator.wakeLock.request('screen'); }catch(e){}
    for(const r of rows){
      if(signal.aborted){ r.st='cancel'; r.msg='Cancelled'; paint(true); continue; }
      if(inLib(r)){ r.st='skip'; r.msg='Already in your library'; skip++; paint(true); continue; }
      const id=uid(); let doc=null; r.st='dl'; r.msg='Downloading…'; paint(true);
      try{
        const resp=await fetch(r.url||`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(r.id)}?alt=media&supportsAllDrives=true`,{headers:auth&&tok?{Authorization:'Bearer '+tok.t,...rkHeader((r.keys||[folderKey()]).concat(r.resourceKey?[`${r.id}/${r.resourceKey}`]:[]))}:{},signal,cache:'no-store'});
        if(!resp.ok){ if(resp.status===401){ tok=null; throw new Error('Google session expired. Tap From Google Drive again.'); }
          throw new Error(resp.status===403||resp.status===404?"No access to this file (HTTP "+resp.status+")":'HTTP '+resp.status); }
        if(!r.size) r.size=+resp.headers.get('content-length')||0;
        const got=await streamToChunks(id,resp,n=>{ r.got=n; r.msg=`${fmtBytes(n)}${r.size?' of '+fmtBytes(r.size):''}`; paint(); },signal);
        r.size=got; r.st='proc'; r.msg='Preparing cover…'; paint(true);
        doc=await openPdf(new IDBSource(id,got));
        const meta=await coverMeta(doc);
        const pages=doc.numPages; await doc.destroy(); doc=null;
        const t0=titleFromName(r.name); const rec=withSeriesOverride({id,title:t0,series:r.series||seriesGuess(t0),fileName:r.name,size:got,pages,...meta,added:Date.now()+r.k,lastRead:0,page:0,progress:0,rtl:false,driveId:r.id,source:'drive'});
        await dbPut(rec); comics.push(rec); ok++; r.st='done'; r.msg=`${pages} pages · ${fmtBytes(got)}`; renderShelf();
      }catch(err){ try{ if(doc) await doc.destroy(); }catch(e){} try{ await dbDelete(id); }catch(e){}
        if(signal.aborted||err.name==='AbortError'){ r.st='cancel'; r.msg='Cancelled'; }
        else { fail++; r.st='fail'; const quota=err&&(err.name==='QuotaExceededError'||/quota/i.test(err.message||'')); r.msg=quota?'Out of storage space':/Invalid PDF|PDF header|InvalidPDF/i.test(err.message||'')?'Not a valid PDF':(err.message||'Download failed'); console.warn('drive import failed',err); } }
      paint(true);
    }
    importing=false; ctl=null; renderShelf(); if(ok) kickBlack(); try{ wl&&wl.release(); }catch(e){}
    w.querySelector('#dlHead').textContent=signal.aborted?'Import cancelled':fail?'Import finished with problems':'Import complete';
    w.querySelector('#dlSub').textContent=[ok&&`${ok} imported`,skip&&`${skip} already in library`,fail&&`${fail} failed`,signal.aborted&&'cancelled'].filter(Boolean).join(' · ')||'Nothing imported';
    const b=w.querySelector('#dlCancel'); b.textContent='Done'; b.className='btn'; b.id='dlDone'; b.onclick=()=>w.remove();
    if(ok&&!fail&&!signal.aborted&&!skip) setTimeout(()=>w.isConnected&&w.remove(),1600);
    return {ok,skip,fail}; }

  if(resumePicker&&configured()) addEventListener('load',()=>load().then(afterToken).catch(e=>toast("Couldn't load Google Picker: "+e.message)));
  const setFolder=f=>{ if(f) store.set('driveFolder',f); else { try{ localStorage.removeItem('cr.driveFolder'); }catch(e){} } };
  return {isRangeName,start,preload,importRemote,configured,folder,setFolder,parseFolderLink,checklist,get scope(){return SCOPE},get busy(){return !!ctl},_setToken:t=>{tok=t?{t,exp:Date.now()+3600e3}:null;}};
})();

/* + button: small import menu */
const IC_DRIVE='<svg class="i" viewBox="0 0 24 24"><path d="M8.5 3h7l6 10.5-3.5 6h-12L2.5 13.5z"/><path d="M8.5 3 12 9.5m3.5-6L9 15H2.5m19-1.5H12L8.5 19.5"/></svg>';

const keyFor=(i,w,h)=>`${i}|${Math.round(w*DPR)}x${Math.round(h*DPR)}`;

/* ---- views: single pages, or spreads with the cover alone ---- */
// half mode (fold comics in portrait): each wide sheet becomes two views, its halves in reading order (RTL: right half first);

const WIDE=1.15, SPREAD_AR=1.2;
/* ---- two-page spreads (v29): wide pages are known up front (page shapes read once per comic, remembered as c.ars) ---- */

const isSpreadView=k=>{ const v=R.views[k]; return !!v&&v.length===1&&v[0]<R.n&&!R.half&&!R.fold&&(R.aspects[v[0]]||0)>SPREAD_AR; };
const canRot=()=>isSpreadView(R.vi)&&!isLandscape();
const rotOn=()=>R.rot===R.vi&&R.rot!=null&&canRot();   // in-view 90° rotation of the current spread (web apps can't force device orientation)
const frameWH=()=>{ const W=stage.clientWidth,H=stage.clientHeight; return rotOn()?[H,W]:[W,H]; };
function setRot(on){ cancelFlipNow(); if(P.on){ P.on=false; P.key=null; panelUI(false); } R.rot=on?R.vi:null; renderView(); }
// skipped blank pages (black + nearly white): the reader works on R.seq (visible page indices); R.ord maps page -> position in it

const isLandscape=()=>stage.clientWidth>stage.clientHeight*1.05;
const wantSpread=()=>isLandscape()&&stage.clientWidth>=560&&!store.get('singleLandscape',false)&&R.n>1&&!R.fold;

/* ---- page elements ---- */
function placeCanvas(cv,w,h,align){ const ar=cv.width/cv.height; let cw=w,ch=w/ar; if(ch>h){ ch=h; cw=h*ar; }

function prefetch(){ const want=new Set(pagesOf(R.views[R.vi]));

/* ---- progress ---- */
let saveT=0;

async function openReader(id,opts={}){ const {push=true}=opts;

/* ================= v42: creator credits — writer + artist on each issue, tappable; creator page ================= */
// name variants -> one creator (data is normalised at build time; this also covers names typed later / other spellings)
const CR_ALIAS={'james lee':'Jim Lee','erik j. larsen':'Erik Larsen','eliot r. brown':'Eliot Brown','john romita jr':'John Romita Jr.','john romita, jr.':'John Romita Jr.','allen milgrom':'Al Milgrom','james shooter':'Jim Shooter',"dennis o'neil":"Denny O'Neil",'louise jones':'Louise Simonson','todd smith':'Tod Smith'};
const crNorm=n=>{ const s=String(n||'').replace(/[[\]]/g,'').replace(/\s+/g,' ').trim(); return CR_ALIAS[s.toLowerCase()]||s; };
const crKey=n=>crNorm(n).toLowerCase();
function creditsOf(c){ const r=(c.driveId&&CREDITS.d[c.driveId])||(c.fileName&&CREDITS.f[c.fileName]); if(!r) return null;
  const [w,p]=r.split('|').map(s=>s?s.split(',').map(i=>crNorm(CREDITS.n[+i])):[]); return (w.length||p.length)?{writer:[...new Set(w)],artist:[...new Set(p)]}:null; }
const crBtn=n=>`<button type="button" class="crn" data-creator="${esc(n)}">${esc(n)}</button>`;
function creditsHTML(c){ const k=creditsOf(c); if(!k) return '';
  const row=(lab,L)=>L.length?`<div class="crrow"><span class="crl">${lab}</span><span class="crv">${L.map(crBtn).join('')}</span></div>`:'';
  return `<div class="credits">${row('Writer',k.writer)}${row('Artist',k.artist)}</div>`; }
// every issue in the library by a creator: [{series,items:[{c,d,roles}]}], groups and issues oldest first
function creatorIssues(name){ const key=crKey(name), by=new Map();
  for(const c of comics){ const k=creditsOf(c); if(!k) continue; const roles=[]; if(k.writer.some(n=>crKey(n)===key)) roles.push('Writer'); if(k.artist.some(n=>crKey(n)===key)) roles.push('Artist'); if(!roles.length) continue;
    const s=c.series||'Other'; if(!by.has(s)) by.set(s,[]); by.get(s).push({c,d:dateOf(c),roles}); }
  const t=x=>x.d?ymOf(x.d):1e9;
  const groups=[...by.entries()].map(([series,items])=>({series,items:items.sort((a,b)=>t(a)-t(b)||byIssue(a.c,b.c))}));
  return groups.sort((a,b)=>t(a.items[0])-t(b.items[0])||a.series.localeCompare(b.series)); }
const CRP={on:false,name:''};
function openCreator(name){ name=crNorm(name); const mw=document.querySelector('.mwrap'); if(mw){ const x=mw.querySelector('[data-r=cancel],[data-r=done]'); if(x) x.click(); else mw.remove(); } const G=creatorIssues(name), n=G.reduce((s,g)=>s+g.items.length,0);
  const roles=[...new Set(G.flatMap(g=>g.items.flatMap(x=>x.roles)))].join(' · ');
  const yrs=G.flatMap(g=>g.items.filter(x=>x.d).map(x=>x.d.y)), span=yrs.length?(Math.min(...yrs)===Math.max(...yrs)?String(yrs[0]):`${Math.min(...yrs)}–${Math.max(...yrs)}`):'';
  const el=$('#creator'); $('#crName').textContent=name; $('#crSub').textContent=[roles,`${n} issue${n===1?'':'s'}`,span].filter(Boolean).join(' · ');
  $('#crBody').innerHTML=G.map(g=>`<section class="crg"><h3>${esc(g.series)}<small>${g.items.length}</small></h3><div class="crgrid">${g.items.map(x=>`<button class="crc" data-id="${x.c.id}" aria-label="${esc(x.c.title)}${x.d?', '+esc(fmtDate(x.d)):''}">${coverBox(x.c)}<span class="tt">${esc(x.c.title)}</span><span class="td">${x.d?esc(fmtDate(x.d)):'Unknown date'}${x.roles.length===1&&roles.includes('·')?' · '+x.roles[0]:''}</span></button>`).join('')}</div></section>`).join('')||'<p class="qempty">No issues by this creator in your library.</p>';
  $('#crBody').scrollTop=0; el.classList.remove('hidden'); CRP.on=true; CRP.name=name; }
function closeCreator(){ $('#creator').classList.add('hidden'); CRP.on=false; }
$('#crClose').addEventListener('click',closeCreator);
$('#crBody').addEventListener('click',e=>{ const b=e.target.closest('.crc'); if(!b) return; closeCreator(); openReader(b.dataset.id); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&CRP.on&&!document.querySelector('.mwrap')) closeCreator(); });
// any tappable name anywhere (info sheet, reader info) opens the creator page
document.addEventListener('click',e=>{ const b=e.target.closest('.crn[data-creator]'); if(!b) return; e.preventDefault(); e.stopPropagation(); openCreator(b.dataset.creator); },true);

function readerInfo(){ const c=R.comic; if(!c) return; const d=dateOf(c);
